      informacjami i przygotować się na pytania.
    running: Już rozpocząłeś/rozpoczęłaś quiz i odpowiedziałeś/aś na 
      {questionsAnswered} z {questionCount} pytań.
    passed: Już zdałeś/aś ten quiz.
    failed: Niestety, przy ostatniej próbie nie zdałeś/aś tego quizu.
    noWaitAfter: Jeszcze raz przejrzyj artykuły informacyjne i spróbuj ponownie.
    disqualified: Niestety, zostałeś/aś zdyskwalifikowany/a z tego quizu, 
      ponieważ zbyt często go nie zdałeś/aś.
    passedBefore: Już zdałeś/aś ten quiz wcześniej.
    willExpire: Ważność twojego quizu kończy się po {expirationTime} dniach. 
      Dlatego możesz już teraz odświeżyć swoją wiedzę w tym zakresie i ponownie 
      wziąć udział w tym quizie.
    disqualifiedAfter: Masz już tylko jedną ostatnią szansę, żeby zdać ten quiz!
      Jeśli teraz nie zdasz, będziesz trwale zdyskwalifikowany/a z tego quizu. 
      Bierz udział tylko pod warunkiem, że dokładnie przestudiowałeś/aś treści 
      zawarte w wiki.
    expired: Jednakże twoja ostatnia próba tego quizu już jest nieważna.
    pauseElapsed: Twoja przerwa na naukę się skończyła. Dlatego możesz ponownie 
      przystąpić do quizu. Miejmy nadzieję, że wykorzystałeś/aś czas to lepiej 
      zaznajomić się z treściami.
  regstart: Rozpocznij quiz bez limitu czasu i {count} pytań
  button:
    pause: Kontynuuj później
    finish: Zakończ quiz
  title:
    start: '{name} - Przystąp teraz do quizu!'
    continue: '{name} - Kontynuuj quiz!'
    disqualified: '{name} - Niestety, zdyskwalifikowany.'
    finished: '{name} - zdałeś/aś!'
    pause: Przerwa na naukę ({name})
  startmodal:
    title: Wskazówki do quizu
    infos:
      wiki: Nie zaczynaj quizu na próbę. Najpierw przeczytaj dokładnie 
        wymienione strony informacyjne. Bez wiedzy z Wiki nie uda ci się zdać 
        quizu.
      real_life_examples: Większość pytań opiera się na rzeczywistych sytuacjach
        z życia foodsharingu.
      limited_tries: Nie możesz powtarzać quizu tak często, jak chcesz. Po 
        trzech próbach musisz poświęcić 30 dni na naukę, następnie masz jeszcze 
        tylko dwie próby. Pytania zadawane przy każdej próbie są inne.
      read_carefully: Przeczytaj uważnie wszystkie pytania i odpowiedzi.
      multiple_choice: Może być kilka poprawnych odpowiedzi na dane pytanie - 
        albo też żadna. Zdecyduj niezależnie dla każdej odpowiedzi, czy jest 
        poprawna czy fałszywa.
      timed: Czas odpowiadania na pytania jest ograniczony. Nie stresuj się tym.
        Czas jest tak dostosowany do poszczególnych pytań, aby był wystarczający
        do odpowiedzenia w spokoju na dane pytanie. Jeśli mimo to kiedyś 
        zabraknie ci czasu, poinformuj administratorów/ki quizu  poprzez 
        komentarz.
      pause: Możesz zastopować quiz po każdym pytaniu i kontynuować później.
      feedback: Na koniec quizu otrzymasz bezpośrednio ocenę, czy zdałeś/aś i 
        jakie popełniłeś/aś błędy. Możesz wtedy w spokoju przeczytać 
        uzasadnienia.
      unlimited_tries: Możesz powtarzać ten quiz dowolną liczbę razy i nie 
        zostaniesz zdyskwalifikowany/a przez błędne próby. Jednakże, być może 
        będziesz musiał/a zrobić przerwę na naukę między podejściami.
      alone: Musisz zdać quiz samodzielnie i bez pomocy z zewnątrz. Jeśli masz 
        problemy językowe albo potrzebujesz asystencji osobistej, oczywiście 
        inna osoba może ci pomóc zrozumieć pytania; jednak musisz być w stanie 
        samodzielnie na nie odpowiedzieć. Dlatego poszukaj spokojnego miejsca, 
        gdzie możesz przeprowadzić quiz bez zakłóceń.
      comment: Po odpowiedzeniu na każde pytanie zobaczysz pośrednią ewaluację z
        wyjaśnieniami do każdej możliwej odpowiedzi. To pomoże ci zrozumieć, 
        która odpowiedź jest poprawna lub błędna, i dlaczego. Jeśli popełnisz 
        błąd, powinieneś/powinnaś przeczytać dokładnie wyjaśnienia. Jeśli coś 
        wydaje ci się nielogiczne, niezrozumiałe lub nawet błędne, zostaw 
        komentarz. Twoje komentarze są przyporządkowane do ciebie, aby umożliwić
        indywidualną informację zwrotną.
    acceptPrivacyNotice: Zgadzam się.

      wziąć udział w tym quizie.
    disqualifiedAfter: Masz już tylko jedną ostatnią szansę, żeby zdać ten quiz!
      Jeśli teraz nie zdasz, będziesz trwale zdyskwalifikowany/a z tego quizu. 
      Bierz udział tylko pod warunkiem, że dokładnie przestudiowałeś/aś treści 
      zawarte w wiki.
    expired: Jednakże twoja ostatnia próba tego quizu już jest nieważna.

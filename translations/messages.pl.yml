      md: 'Jako podobne zasoby jest pokazywanych maksymalnie 10 dalszych zasobów,
        dla których wprowadzono te same kategorie.'
    profileCommitmentsStat:
      title: 'Statystyka zaangażowania'
      md: ''
    pollScopes:
      md: "Przy tworzeniu głosowania możesz wybrać różne grupy osób, które są uprawnione
        do głosowania. \nPrzy wszystkich możliwościach wyboru obowiązuje:\n- Mogą
        głosować nie tylko wszyscy/tkie foodsaverzy/ki z rejonu/zespołu, ale także
        rejony podrzędne.\n- Liczba uprawnionych do głosowania foodsaverów/ek jest
        w nawiasie za możliwością wyboru\n- Jak tylko utworzone zostanie głosowanie,
        następuje ustalenie uprawnionych do głosowania. Uprawniony/a do głosowania
        jest ten/ta, kto należy do danej grupy osób w momencie utworzenia głosowania.\n"
      title: 'Prawo do głosowania'
    polls:
      title: 'Głosowania'
      md: 'Przy pomocy modułu głosowań można przeprowadzać wybory, ankiety i inne
        głosowania anonimowo i po prostu bezpośrednio na platformie foodsharingu.
        Szczegółowe instrukcje znajdziesz pod adresem https://wiki.foodsharing.de/Abstimmungs-Modul

        '
    publicEvent:
      title: 'Publiczne eventy'
      md: "Administratorzy/ki wybranego zespołu albo GOALS-zespołu public relations
        bądź ambasadorzy/ki mogą wprowadzać eventy publiczne. Eventy publiczne są
        dostępne dla wszystkich. Nie trzeba być zarejestrowanym na platformie, aby
        zobaczyć miejsce wydarzenia i informacje. Jednakże tablica i lista uczestniczących
        są widoczne tylko dla zalogowanych użytkowników/czek. \nWprowadź event publiczny,
        jeśli chcesz zaprosić też osoby spoza lokalnej społeczności foodsharingu i
        wszyscy mogą przyjść.\n"
    reportReasons:
      title: 'Formularz skarg'
      md: ''
    achievementIcon:
      title: 'Ikony do stickerów'
      md: 'Każdy sticker ma ikonę, czyli małą grafikę, która na pierwszy rzut oka
        ma ilustrować, o co chodzi. Listę dostępnych ikon znajdziesz pod: https://fontawesome.com/v5/search?o=r&m=free&s=solid.


        W polu wprowadzania musisz podać nazwę ikony, której chcesz użyć, czyli np.
        „*walking*“ lub „*shopping-cart*“.

        Przy pomocy podglądu możesz sprawdzić, czy twoje wprowadzone dane zadziałały.

        Jeśli nie podasz żadnej ikony, zostanie automatycznie użyta standardowa ikona
        dla stickerów „*tag*“.

        '
    moderatorForumHide:
      title: 'Ukrywanie na forum przez moderatorów/ki'
      md: ''
    my_resources:
      title: 'Własne zasoby'
      md: 'W tym obszarze możesz zarządzać swoimi własnymi zasobami; wprowadzić nowy
        zasób,  edytować, usuwać lub po prostu zobaczyć, czym aktualnie się dzielisz.


        ##### Czym jest zasób?


        Zasobem może być wszystko, co możesz wnieść do społeczności foodsharingu.
        Mogą to być **umiejętności**, np. gotowanie lub programowanie, **przedmioty,**
        które jesteś gotowy/a pożyczyć, np. rower towarowy lub kuchenka mobilna, bądź
        też **kontakty** z innymi inicjatywami, instytucjami, mediami itd.


        ##### Nic nie musisz, wszystko możesz


        Nikt nie jest zmuszony do wprowadzania zasobów, i tylko dlatego, że wprowadziłeś/aś
        jakiś konkretny zasób, nie oznacza, że *musisz* go udostępnić do konkretnych
        aktywności. Dużo bardziej chodzi o to, aby dzielić się tym, co *chętnie chciał(a)być
        wnieść*.


        ##### Kto widzi moje zasoby?


        Zasoby są widoczne w obrębie twoich rejonów i zespołów. Wyłączone z tego są
        jednak bardzo duże rejony typu państwo lub województwo, w których mozaika
        zasobów nie jest dostępna. Możesz też ograniczyć widoczność pojedynczych zasobów
        do foodsaverów/ek, których/e znasz.

        '
    report:
      title: 'Rozpatrywanie skarg'
      md: 'Tu są pokazywane skargi, które dotyczą osób z tego rejonu macierzystego.
        Jednakże nie zobaczysz wszystkich skarg:

        - z zasady nie są pokazywane skargi, które dotyczą ciebie albo twoich współadministratorów/ek
        z LZRS lub LRA.

        - jako administrator/ka LRA masz dostęp tylko do skarg, które dotyczą administratorów/ek
        LZRS.

        ---

        Wskazówki do rozpatrywania skargi możecie przeczytać tutaj:  [Rozpatrywanie
        skargi](https://wiki.foodsharing.de/Regelverletzungen_-_Konsequenzen_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)

        '
    achievementDuplicateMode:
      title: 'Wielokrotne przyznawanie stickerów'
      md: ''
    masterRegion:
      title: 'Master-rejon'
      md: 'Jeśli rejony mają master-rejon, wszyscy członkowie tego rejonu są też automatycznie
        włączeni do master-rejonu. W wielu przypadkach jest sensowne, wybrać rejon
        nadrzędny jako master, ale inne zastosowania też są możliwe. Jeśli master-rejon
        nie jest rejonem nadrzędnym, użytkownicy/czki rejonu **nie** zostaną automatycznie
        włączeni/one do rejonu nadrzędnego.


        Jeśli nie chcesz, aby użytkownicy/czki zostali/ły automatycznie włączeni/one
        do innego rejonu, ustaw master na root.

        ---

        Włączenie do master-rejonu następuje jednorazowo każdej nocy. Zmiany nie następują
        tutaj natychmiastowo.

        '

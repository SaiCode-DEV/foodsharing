        poprawna czy fałszywa.
      timed: Czas odpowiadania na pytania jest ograniczony. Nie stresuj się tym.
        Czas jest tak dostosowany do poszczególnych pytań, aby był wystarczający
        do odpowiedzenia w spokoju na dane pytanie. Jeśli mimo to kiedyś 
        zabraknie ci czasu, poinformuj administratorów/ki quizu  poprzez 
        komentarz.
      pause: Możesz zastopować quiz po każdym pytaniu i kontynuować później.
      feedback: Na koniec quizu otrzymasz bezpośrednio ocenę, czy zdałeś/aś i 
        jakie popełniłeś/aś błędy. Możesz wtedy w spokoju przeczytać 

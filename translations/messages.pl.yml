    pause: Przerwa na naukę ({name})
  startmodal:
    title: Wskazówki do quizu
    infos:
      wiki: Nie zaczynaj quizu na próbę. Najpierw przeczytaj dokładnie 
        wymienione strony informacyjne. Bez wiedzy z Wiki nie uda ci się zdać 
        quizu.
      real_life_examples: Większość pytań opiera się na rzeczywistych sytuacjach
        z życia foodsharingu.
      limited_tries: Nie możesz powtarzać quizu tak często, jak chcesz. Po 
        trzech próbach musisz poświęcić 30 dni na naukę, następnie masz jeszcze 
        tylko dwie próby. Pytania zadawane przy każdej próbie są inne.
      read_carefully: Przeczytaj uważnie wszystkie pytania i odpowiedzi.
      multiple_choice: Może być kilka poprawnych odpowiedzi na dane pytanie - 
        albo też żadna. Zdecyduj niezależnie dla każdej odpowiedzi, czy jest 
        poprawna czy fałszywa.
      timed: Czas odpowiadania na pytania jest ograniczony. Nie stresuj się tym.
        Czas jest tak dostosowany do poszczególnych pytań, aby był wystarczający
        do odpowiedzenia w spokoju na dane pytanie. Jeśli mimo to kiedyś 
        zabraknie ci czasu, poinformuj administratorów/ki quizu  poprzez 
        komentarz.
      pause: Możesz zastopować quiz po każdym pytaniu i kontynuować później.
      feedback: Na koniec quizu otrzymasz bezpośrednio ocenę, czy zdałeś/aś i 
        jakie popełniłeś/aś błędy. Możesz wtedy w spokoju przeczytać 
        uzasadnienia.

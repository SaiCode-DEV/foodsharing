        preciso, puoi anche impostare valori più alti in modo che le discussioni siano
        sempre in cima, indipendentemente dalla data di modifica.\nLe discussioni
        con priorità -1 vengono visualizzate sotto tutte le altre.\n"
    storeLog:
      title: Registro delle operazioni
      md: "Il registro delle operazioni è un modo per tracciare le **attività in un'azienda**.
        Può aiutare a risolvere conflitti o correggere errori accidentali.\n---\n\
        \ ###### Esempio\nSupponiamo che tu voglia sapere chi si è stato aggiunto
        al team nelle ultime 3 settimane e da chi. Puoi specificare il periodo utilizzando
        le date di inizio e fine nei due campi data. Successivamente, puoi selezionare
        tutti i tipi di azione pertinenti dal menu a tendina. In questo caso, ad esempio,
        “*Effettua richieste di iscrizione*”, “*Accetta richieste di iscrizione*”
        e “*Rifiuta richieste di iscrizione*”. Se ora fai clic sul pulsante “*Mostra
        azioni selezionate*”, ti verrà mostrata la cronologia degli eventi selezionati.\n\
        \ ---\n###### Accesso\nL'accesso è consentito solo a chi può gestire l'azienda.
        Il registro delle operazioni non è visibile ai foodsavers e jolly.\n---\n\
        \ ###### Restrizioni\nVengono caricate al massimo 100 voci. Potrebbe essere
        necessario limitare il periodo di ricerca o i tipi di azione selezionati se
        non vengono visualizzati tutti i risultati.\n"

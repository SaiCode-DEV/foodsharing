  startmodal:
    infos:
      limited_tries: Non puoi ripetere il quiz quante volte vuoi. Dopo tre 
        tentativi devi prenderti una pausa dallo studio di 30 giorni, dopodiché 
        hai solo altri due tentativi. Le domande che ti verranno poste in ogni 
        tentativo sono diverse.
      alone: Devi completare il quiz da solo e senza alcun aiuto esterno. Se hai
        difficoltà linguistiche o hai bisogno di aiuto, ovviamente un'altra 
        persona può aiutarti a comprendere le domande; tuttavia, dovrai 
        rispondere da solo. Pertanto, trova un posto tranquillo dove poter 
        svolgere il quiz indisturbato.
      multiple_choice: Per ogni domanda possono essere corrette più risposte, o 
        nessuna. Pertanto, decidi individualmente per ciascuna risposta se è 
        giusta o sbagliata.
      unlimited_tries: Puoi ripetere questo quiz tutte le volte che vuoi e non 
        sarai mai squalificato se non lo superi. Tuttavia, a volte devi fare una
        pausa dall'apprendimento tra un tentativo e l'altro.
      timed: Il tempo per rispondere alle domande è limitato. Non lasciare che 
        questo ti stressi. Il tempo è fissato individualmente per ogni domanda 
        in modo da avere abbastanza tempo per rispondere alla domanda in tutta 
        tranquillità. Se esaurisci il tempo a tua disposizione, informa gli 
        amministratori del quiz con un commento.
      read_carefully: Leggi attentamente tutte le domande e le risposte.
      wiki: Si prega di non iniziare il quiz a caso. Leggere attentamente le 
        pagine informative elencate in anticipo. Senza la conoscenza del wiki 
        non supererai il quiz.
      real_life_examples: La maggior parte delle domande si basa su casi reali 
        legati al foodsharing.
      feedback: Alla fine del quiz riceverai una valutazione immediata se hai 
        superato il test, quali errori hai commesso e dove. Qui potrai rileggere
        le ragioni.
      comment: Dopo aver risposto a ciascuna domanda, vedrai una valutazione 
        intermedia con spiegazioni per ciascuna delle opzioni di risposta. 
        Questo aiuta a capire quale risposta è giusta o sbagliata e perché. Per 
        ogni errore è necessario leggere attentamente le spiegazioni. Se 
        qualcosa ti sembra illogico, incomprensibile o addirittura sbagliato, 
        lascia un commento. I tuoi commenti possono essere assegnati a te per 
        darti un feedback individuale.
      pause: Puoi mettere in pausa il quiz dopo ogni domanda e riprenderlo in un
        secondo momento.

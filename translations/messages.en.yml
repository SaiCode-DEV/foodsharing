help:
  key:
    storeLog:
      title: Store log
      md: "The store log is a way to track the **activities in a store**. It can help
        resolve conflicts or correct accidental mistakes.\n---\n###### Example\nLet’s
        say you want to know who was added to the team by whom in the last 3 weeks.
        Then you can set the period using the start and end dates in the two date
        fields. Next, you can select all relevant action types from the dropdown.
        In this case, for example, “*Make membership requests*”, “*Accept membership
        requests*” and “*Reject membership requests*”. If you now click on the “*Show
        selected actions*” button, you will be shown a history of the selected events.\n\
        \ ---\n###### Access\nOnly those who can manage the company have access to
        it. The operating log is not visible to normal foodsavers and jumpers.\n---\n\
        \ ###### Restrictions\nA maximum of 100 entries will be loaded. You may need
        to limit the search period or the selected action types if not all results
        are displayed.\n"
    threadPriority:
      title: Thread priority
      md: "Topics are listed sorted by display priority. Topics with the same priority
        are sorted by the time of last activity.\n---\nPinned threads have a priority
        of 1, normal threads have a priority of 0. To be able to sort the displayed
        threads more precisely, you can also set higher values here so that topics
        are always at the top regardless of the modification date.\nThreads with priority
        -1 appear below all other threads.\n"
    masterRegion:
      md: "In case districts have a master district, all members of the district will
        automatically be included into the master district. In many cases it makes
        sense to assign the parent district as master. If the master district is not
        the parent district, users of the district will **not** be included into the
        parent district.\n\nIf you don’t want users to be automatically included in
        another district, set the Master to Root.\n---\nThe inclusion into the master
        district happens over night. Changes do not occur immediately.\n"
      title: Master district
    profileCommitmentsStat:
      title: Engagement statistics
      md: is visible from the role of the store manager. It is restricted to a 
        common master district or common stores.
    achievements:
      title: Stickers
      md: "The sticker system can be used to mark user-specific characteristics, such
        as participation in certain training courses. Stickers can be valid for any
        length of time or have an end date after which they become invalid.\n"
    reportReasons:
      title: Report form
      md: "Using the report form, foodsavers can directly report rule violations.
        If it is activated, people who are responsible for reports will recieve notifications
        about reports.\n---\nThe local report group of the region can adjust which
        reasons are selectable in the report form.\nThis can either be the simple
        or extended versions of the reasons. In the extended version, all rules that
        are listed [in the Wiki at point B](https://wiki.foodsharing.de/Verhaltensregeln#B.29_Verhalten_bei_Abholungen)
        will be listed.\nAdditionally, the option “Other reason” can be enabled to
        be listed in the form.\n---\nRecommendations about the settings can be given
        to the local report group. The decision about this can, however, be solely
        made by the administrators of that group, who do not *have to* follow these
        recommendations.\n"
    report:
      title: Report processing
      md: "Here, you see all reports that were made about people in this home region.
        However, not all reports are shown to you:\n- You will not see any reports,
        which involve you or any other admin of the local report group or the arbitration
        group.\n- If you are admin of the arbitration group, you will only see reports
        which involve an admin of the local report group.\n---\nYou can find information
        about processing reports at: [Bearbeitung einer Meldung (German)](https://wiki.foodsharing.de/Regelverletzungen_-_Konsequenzen_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)\n"
    basket:
      title: Food baskets
      md: "Food baskets are offered by users who want to give away (often rescued)
        food **for free**. Registered users can request a food basket to pick it up.\n"
    achievementIcon:
      title: Icons for stickers
      md: "Each sticker has an icon that should indicate, what the sticker is about.
        You can find a list of available icons at https://fontawesome.com/v5/search?o=r&m=free&s=solid.\n\
        \ \nYou need to put the name of the desired icon into the field, for example
        “*walking*” or “*shopping-cart*”.\nIf the input is valid, you will see the
        icon in the preview.\nThe icon “*tag*” will be used as default if you do not
        enter an icon.\n"
    moderatorForumHide:
      md: "###### Who is a moderator?\nThe moderators of a group or district are usually
        the administrators or AMBs. If there is a GOALS working group *Moderation*
        in a district, the administrators of this group take on the role of moderator.\n\
        \ ---\n###### Hiding in forums\nIf this option is activated, the moderators
        can hide all posts in the forum, not just their own. To do this, they must
        give a reason why they want to hide a post or entire thread. After that, a
        post remains accessible to the moderators for a further three months and can
        also be restored during this time. Other users (without organizational rights)
        no longer have access to it. After these three months, a hidden post can no
        longer be restored and is permanently deleted from the database.\n---\n######
        Where can this option be used?\nIn local reporting groups and arbitration
        boards (GOALS working groups), this function is necessary for data protection
        reasons.\nOther working groups can hold an internal vote to give admins the
        right to hide posts and send a link to the successful vote to ags.bezirke@foodsharing.network.
        This option is not available for local districts.\n"
      title: Hiding in forums by moderators
    pollScopes:
      md: "When creating a vote, you can select from different groups of people who
        should be entitled to vote.\nThe following applies to all voting options:\n\
        \ - Not only all food savers in the district/group can vote, but also those
        in the sub-districts.\n- The number of food savers entitled to vote is shown
        in brackets after the selection option.\n- As soon as the vote is created,
        the people entitled to vote are determined. Anyone who falls into the corresponding
        group of people at the time the vote is created is entitled to vote.\n"
      title: Right to vote
    polls:
      title: Polls
      md: "Using the voting module, elections, surveys and other votes can be carried
        out anonymously and easily directly on the foodsharing platform. You can find
        detailed instructions at https://wiki.foodsharing.de/Abstimmungs-Modul\n"
    hygieneRequirement:
      title: Hygiene requirement for stores
      md: "Some companies require food savers to be trained in food hygiene in order
        to be able to pick up food there. If this function is activated for a particular
        store, this has the following consequences:\n1. Food savers without valid
        hygiene training cannot apply for the team.\n2. Food savers who are already
        part of the team can only register for slots if their hygiene training is
        still valid at the time of the desired pick-up.\n\nIn both cases, a message
        will be displayed explaining that the hygiene training is required for this
        action. The hygiene quiz is also linked directly in each case.\n\n---\n\n\
        \ Important to note: This function is only based on foodsharing’s own hygiene
        training. Neither hygiene certificates from external providers (e.g. Metro)
        uploaded to the profile nor hygiene training courses noted elsewhere are currently
        taken into account.\n"
    change_verified_data:
      title: Request a change to verified data
      md: "To get involved as a foodsaver, it’s important that the information in
        your profile is correct. Before you can save food, the ambassadors will check
        it against your ID. Therefore, you can’t simply change your name and date
        of birth.\n---\nShould it happen that one of these fields needs to be changed,
        you can contact an ambassador from your home district. They can make the necessary
        changes for you. You can find out who the ambassadors are in your home district
        in the [district forum]({link}) in the left sidebar.\n"
    publicEvent:
      title: Public events
      md: "Events can be registered as public by the admins of a working group, the
        admins of the GOALS Public Relations Working Group, or the ambassadors. Public
        events are open to everyone. You don’t need to be logged in to the platform
        to view the event location and information. However, the bulletin board and
        participant list are only accessible to registered users.\nRegister an event
        as public if you want to invite people outside of your local food sharing
        community, and everyone is welcome to attend.\n"
    pickupOptions:
      title: Pickup options
      md: "The *Pickup options* section shows you an overview of all upcoming pickups
        at your stores that are still looking for foodsavers. You can customize the
        view to your needs using the options menu:\n\n**Registered pickups:** To help
        you plan your pickups better, you can also view pickups for which you are
        already registered. These pickups are displayed slightly paler so you can
        recognize them at a glance.\n\n**Team manager view:** Team managers ensure
        that all pickups at their businesses run reliably. If you are a Team manager,
        you can limit the view to the stores for which you are responsible. This makes
        it easier to keep track.\n\n**Grouped by day:** In this view, your pickup
        options are summarized by day and presented in a more compact format. This
        makes it easier to get an overview, especially if you have many pickup options
        available each day.\n"
    resource_mosaic:
      title: Resource Mosaic
      md: "##### The idea\nWhile saving food we all try to efficiently use our time,
        experience, and transport capabilities. However, in order to find ways towards
        a more sustainable food system and to strengthen the foodsharing community,
        we need more than picking up food. Each and every one of us has certain resources,
        including *abilities*, *tools* or *contacts*, which are often hidden to others
        and thus remain unused. Together we can make these resources visible and use
        them – just like the individual parts of a mosaic, which yield a big picture.
        The resource mosaic can make this diversity visible. It provides a space for
        new ideas, collaboration, and mutual support beyond saving food.\n\n#####
        The overview panel\nThe core of the resource mosaic is the panel that lists
        all resources of the region or working group. You can either browse the list
        and draw inspiration from the group or you can search for specific resources.
        Each resource can be clicked on to see more information about it. You can
        also mark resources as favourites in order to find them easier later on.\n\
        \nThe colour of a resource tells you how gladly the user is willing to share
        it: bright colours indicate resources that the owner is happy to share while
        resources which the user is less eager to share are greyed out.\n\n##### Searching,
        filtering and sorting\nTo quickly find a fitting resource you have several
        options for filtering.\n- You can filter for **categories** or search **for
        specific terms**.\n- The option **Just active users** hides resources of all
        users who have not logged in within the last 30 days or who are currently
        wearing their nightcap.\n- The resource mosaic shows the resources of all
        foodsavers in that group. In regions you can also restrict that list to users
        who have that region set as their **home region**.\n- You can show a list
        of your **favourite** resources if you have marked any as favourites.\n\n\
        In addition, you can **sort** the results, for example by colour or actuality.\n"
    my_resources:
      title: Own resources
      md: "In this section you can manage your own resources; create, edit, and delete
        resource, and see which ones you currently share.\n\n##### What is a resource?\n\
        A resource can be anything that you want to contribute to the foodsharing
        community. This can include **abilities** like cooking or computer programming,
        **tools** which you would be able to lend like a cargo bike or a mobile cooking
        station, and even **contacts** with other NGOs, authorities, the media etc.\n\
        \n##### Nothing is a must\nNoone has to enter any resources. Also, entering
        a resource does not mean that you *have* to supply that resource for anything.
        This is mostly about things that you *would like to share*.\n\n##### Who can
        see my resources?\nResources are visible in your regions and working groups.
        This does not, however, include large regions which are countries or states,
        in which the resource mosaic is not available. You can even restrict the visibility
        of each of your resources individually to your buddies.\n"
    similar_resources:
      title: Similar resources
      md: You will be shown up to 10 other resources as similar resources, for 
        which the **same categories** are entered.
    commons_resources:
      title: Common resources
      md: "Some resources do not belong to one person but to the commons.\n\n#####
        What are examples of common resources?\nCommon resources are usually **objects**,
        **information**, or **contacts**. It might be the region's foodsharing banner,
        photo archives in the cloud, or an external contact. Since a common resource
        is not the responsibility of just one person, the resource's description should
        contain a contact information, if applicable.\n\n##### Who maintains common
        resources?\nIn a working group, all admins can create, edit, and delete common
        resources. In a region, only the ambassadors have those permissions. If there
        is a resource group in the region, the permissions reside in that group's
        admins.\n"
    achievementVisibility:
      title: Sticker visibility
      md: |
        The visibility setting of a sticker determines who can see if the sticker has been assigned to someone. The following options are available:

        - **Hidden:** The sticker is only visible to users with organizational rights.
        hidden: "Not displayed to anyone"
        - **Private:** Only the individual in question, as well as admins and ambassadors within the specified area, can see the sticker.
        - **Store managers only:** The sticker is displayed to the individual and all store managers within the selected area.
        - **Within area:** The sticker is visible to all users who are members of the specified district.
        - **Global:** The sticker is visible to all registered users.

        Please always consider how far the visibility can be restricted to avoid unnecessarily revealing personal information. The visibility level can be adjusted later.
    achievementDuplicateMode:
      title: Multiple allocation of stickers
      md: |
        Stickers can serve as markers in a wide variety of situations. Therefore, you can set whether the sticker can be awarded to the same person multiple times at the same time.

        - **Overwrite:** The sticker cannot be received multiple times at the same time. If the sticker is awarded again, the current award replaces or extends the previous one. This is used, for example, for hygiene training. Those who renew the training simply have their sticker extended. Select *Overwrite* if the sticker is to mark a current, unique status.
        - **Multiple assignments:** Multiple assignments are possible at the same time. Stickers assigned multiple times are grouped together in the profile, but all relevant information is accessible. This could be used, for example, to document introductory pickups, of which several are necessary. Select *Multiple assignments* if each individual assignment is important and must remain traceable.
    store_chain_info:
      md: |
        This store is part of a [store chain](https://wiki.foodsharing.de/Betrieb#Betriebskette). Each chain has responsible [KAMs](https://wiki.foodsharing.de/Key_Account_Manager_(KAM)) who are allowed to see the team and the pick-up slots of this store.
      title: ''
  tooltip: Show help
  helpTitle: 'Help: {title}'
team_page:
  it_member:
    title: IT team
    text: "foodsharing is only possible thanks to the commitment of thousands of volunteers!
      Here are some of the people who coordinate national working groups, develop
      the website or take on other important tasks for foodsharing as a whole:\n"
  alumni_member:
    title: Alumni
    text: "Together, we can look back on a successful history of foodsharing. We would
      like to take this opportunity to thank all the people who have contributed to
      this, some of whom have worked full-time on a voluntary basis or to a very large
      extent for the organizing team or the board!\n"
  board_member:
    title: Club board
    text: "The board of foodsharing e. V. holds the strings together, networks Germany,
      Austria and Switzerland as users of the foodsharing.de platform and is responsible
      for supra-regional matters. The Executive Board works closely together as a
      team and mainly online to deal with all the concerns of the large foodsharing
      community and external parties. In addition, the Executive Board deals extensively
      with organizational development and the political dimension of food waste.\n"

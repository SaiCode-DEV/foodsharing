  # Enable 2FA
  two_fa_enable:
    title: "Enable Two-Factor Authentication"
    tutorial: "Using two-factor authentication increases the security of your account.
      With two-factor authentication enabled, you will need to enter a code in addition
      to your password at each login. You can obtain this via an authenticator app.
      In addition, you will be shown so-called \"backup codes\" which you should keep
      in a safe place in order to still have access to your account in an emergency
      (e.g. if you lose your smartphone)."
    explanation: "Two-factor authentication is optional, but is recommended by leading
      security experts as well as the German Federal Office for Information Security
      (BSI) wherever possible."
    further_info: "You can find further information on two-factor authentication and
      a short explanatory video, for example [on the BSI website](https://www.bsi.bund.de/dok/509176)."
    tabs:
      tutorial: "Tutorial"
      qr_code: "Scan QR Code"
      backup_codes: "Backup Codes"
      confirm: "Confirm Activation"
    apps:
      title: "Recommended Authenticator Apps"
      description: "Choose one of the following free and open-source authenticator
        apps for your device:"
      info: "You can also use an authenticator app that is already used for other
        services. If you don't have one yet, install an app first before proceeding."
    qrcode:
      title: "Scan QR Code"
      label: "Scan this QR code with your authenticator app:"
      scan_instruction: "Open your authenticator app and add a new account by scanning
        this QR code."
      multi_device: "You can use this code to set up any number of devices."
    secret_label: "Alternatively, you can enter this code manually:"
    secret_toggle: "Show code (if QR scan doesn't work)"
    backup_codes:
      title: "Save Backup Codes"
      label: "In case you should lose access to your second factor device (lost/stolen/damaged),
        you can use the following one-time backup codes:"
      info: "Please keep these codes in a safe place. Anyone who has access to these
        codes and knows your password can log into your account."
      save_instruction: "Save these codes now in a secure location (e.g. in a password
        manager or on paper)."
      confirmation: "I have securely saved the backup codes"
      must_confirm: "You must confirm that you have saved the backup codes"
    confirm:
      title: "Confirm Activation"
      instruction: "To activate two-factor authentication, please enter the generated
        code and your password here."
      test_instruction: "Open your authenticator app and enter the current 6-digit
        code to make sure everything works."
      logout_notice: "Note: After activating two-factor authentication, you will need
        to log in again."
    generated_code_label: "Generated code"
    password_info: "Entering your password is always required to make changes. This
      prevents someone else who is using your computer or mobile phone from changing
      this security-critical setting."
    danger: "Important: If you lose your mobile phone or it is stolen and you do not
      have access to the backup codes, you will not be able to log in. You will then

    info: "Here, you can connect your foodsharing appointments with the calendar software
      of your choice. That way, your pickup times and events will be entered into
      your calendar.\n\n**Always keep your calendar links secret.** They contain a
      *token*, which allows to access the data of your appointments without a password.
      You can always delete your current token, which renders all your previous calendar
      links invalid.\n\nYour calendar software needs to **synchronise** the data regulary,
      so that new appointments show up and canceled events disappear. If you download
      the calendar file instead, you will only see your current appointments and will
      not receive automatic updates.\n\nYou can find more information about this [in
      the Wiki]({calendarUrl}).\n"

  startmodal:
    infos:
      real_life_examples: Most of the questions are based on real cases from 
        foodsharing life.
      alone: You have to complete the quiz yourself and without any outside 
        help. If you have language difficulties or need assistance, another 
        person can of course help you understand the questions; however, you 
        must be able to answer them on your own. So find a quiet place where you
        can do the quiz without being disturbed.
      read_carefully: Read all questions and answers carefully.
      pause: You can pause the quiz after each question and resume it at a later
        time.
      feedback: At the end of the quiz you will receive an immediate evaluation 
        of whether you passed and what mistakes you made and where. Here you can
        read through the reasons again at your leisure.
      wiki: Please do not start the quiz on a whim. Read the information pages 
        carefully beforehand. Without the necessary prior knowledge, you may not
        pass the quiz.
      multiple_choice: There may be several correct answers per question — or 
        none. Therefore, decide for each answer individually whether it is right
        or wrong.
      limited_tries: You cannot repeat the quiz as many times as you want. After
        three attempts you have to take a 30-day break to study again, after 
        which you only have two more attempts. The questions you will be asked 
        in each attempt are different.
      comment: After answering each question, you will see an interim evaluation
        with explanations for each possible answer. This helps you to understand
        which answer is right or wrong and why. If you make a mistake, you 
        should read the explanations carefully. If something seems illogical, 
        incomprehensible or even wrong, please leave a comment. Your comments 
        can be assigned to you in order to give you individual feedback.
      unlimited_tries: You can repeat this quiz as often as you like and will 
        never be disqualified if you fail. However, you may have to take a break
        between attempts.
      timed: The time to answer the questions is limited. Don’t let that stress 
        you out. The time is set individually for each question so that you have
        enough time to answer the question calmly. If you do run out of time, 
        let the quiz admins know with a comment.
    title: Quiz notes
    acceptPrivacyNotice: I agree.

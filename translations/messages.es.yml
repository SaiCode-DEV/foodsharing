    FAILED:
      1: Lamentablemente, no ha superado este cuestionario en su primer intento.
        Esto puede ocurrir a veces. Eche otro vistazo a los artículos 
        pertinentes de la Wiki y vuelva a intentarlo.
      2: Lamentablemente, no has aprobado este examen en tus dos primeros 
        intentos. Tienes un tercer intento antes de que tengas que tomarte un 
        mes de descanso del estudio. Asegúrate de consultar los artículos 
        pertinentes de la Wiki para poder aprobar el cuestionario.
    DISQUALIFIED: Lamentablemente, está descalificado para este examen, ya que 
      ha suspendido cinco veces.
    PAUSE: Fallaste esta prueba tres veces. La fiabilidad, un buen conocimiento 
      de las reglas y una apariencia profesional son esenciales para compartir 
      alimentos. Desafortunadamente, no transmites eso con tus respuestas en 
      este momento. Por lo tanto, tendrás un mes de descanso en tus estudios 
      antes de tener dos intentos más para aprobar el examen. Tu descanso 
      finaliza en {wait} días.
    PAUSE_ELAPSED:
      3: Tu descanso ha terminado. Ahora puede realizar el cuestionario dos 
        veces más. Esperamos que haya aprovechado el tiempo para familiarizarse 
        más con el contenido.
      4: ¡Solo tienes un último intento para aprobar este cuestionario! Si falla
        ahora, quedará descalificado permanentemente de esta prueba. Por favor, 
        participe únicamente si ha estudiado el contenido de la wiki en detalle.

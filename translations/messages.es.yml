  startmodal:
    title: Notas sobre el cuestionario
    infos:
      real_life_examples: La mayoría de las preguntas se basan en casos reales 
        de la vida de compartir los alimentos.
      alone: El cuestionario debe ser completado por usted mismo y sin ayuda 
        externa. Si tiene dificultades lingüísticas o depende de un asistente, 
        otra persona puede ayudarle a entender las preguntas, pero usted debe 
        ser capaz de responderlas por sí mismo. Por lo tanto, busque un lugar 
        tranquilo donde pueda completar el cuestionario sin ser molestado.
      read_carefully: Lea atentamente todas las preguntas y respuestas.
      wiki: Por favor, no empiece el cuestionario al azar. Lee atentamente las 
        páginas de información listadas de antemano. Sin los conocimientos de la
        wiki, no aprobarás el cuestionario.
      limited_tries: No puedes repetir el cuestionario tantas veces como 
        quieras. Después de tres intentos, tienes que tomarse un descanso de 30 
        días para estudiar, tras el cual sólo dispones de dos intentos más. Las 
        preguntas que se te plantean en cada intento son diferentes.
      multiple_choice: Varias respuestas por pregunta pueden ser correctas, o 
        ninguna. Por lo tanto, decide para cada respuesta individualmente si es 
        correcta o incorrecta.
      pause: Puedes pausar el cuestionario después de cada pregunta y continuar 
        más tarde.
      feedback: Al final del cuestionario, recibirá una evaluación inmediata de 
        si aprobó, qué errores cometió y dónde. Aquí podrá volver a leer los 
        motivos cuando lo desee.
      comment: Después de responder cada pregunta, verá una evaluación 
        intermedia con explicaciones para cada una de las opciones de respuesta.
        Esto ayuda a comprender qué respuesta es correcta o incorrecta y por 
        qué. Para cada error, debes leer atentamente las explicaciones. Si algo 
        te parece ilógico, incomprensible o incluso incorrecto, deja un 
        comentario. Se le pueden asignar sus comentarios para brindarle 
        comentarios individuales.
      unlimited_tries: Puede repetir este cuestionario tantas veces como quiera 
        y nunca será descalificado si suspende. Sin embargo, es posible que 
        tenga que tomarse un descanso entre cada intento.
      timed: El tiempo para responder a las preguntas es limitado. No deje que 
        esto le estrese. El tiempo se fija individualmente para cada pregunta, 
        de modo que tengas tiempo suficiente para responderla tranquilamente. Si
        te quedas sin tiempo, házselo saber a los administradores del concurso 
        con un comentario.
    acceptPrivacyNotice: Estoy de acuerdo.
    privacyNotice:
      hygiene: Si supera este cuestionario, quedará constancia de que lo ha 
        hecho y se le concederá un certificado de higiene. Los responsables de 
        higiene y operaciones podrán comprobar si tienes un certificado de 
        higiene válido.

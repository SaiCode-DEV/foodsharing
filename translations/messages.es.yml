help:
  helpTitle: 'Ayuda: {title}'
  tooltip: Mostrar la ayuda
  key:
    storeLog:
      title: Registro de las operaciones
      md: "El registro de operaciones es una forma de hacer un seguimiento de las
        **actividades de una empresa**. Puede ayudar a resolver conflictos o corregir
        errores involuntarios.\n---\n###### Ejemplo\nSupongamos que desea saber quién
        se ha incorporado al equipo en las últimas 3 semanas y quién lo ha hecho.
        Entonces puede definir el periodo utilizando las fechas de inicio y fin en
        los dos campos de fecha. A continuación, puede seleccionar todos los tipos
        de acción relevantes en el desplegable. En este caso, por ejemplo, \"*Solicitar
        afiliación*\", \"*Aceptar solicitudes de afiliación*\" y \"*Rechazar solicitudes
        de afiliación*\". Si ahora hace clic en el botón \"*Mostrar acciones seleccionadas*\"\
        , se le mostrará un historial de los eventos seleccionados.\n---\n###### Acceso\n\
        \ Sólo tienen acceso aquellos que también pueden administrar la operación.
        El registro de operaciones no puede ser visto por los ahorradores y saltadores
        normales.\n---\n###### Restricciones\nSe carga un máximo de 100 entradas.
        Es posible que tenga que restringir el periodo de búsqueda o los tipos de
        acción seleccionados si no se muestran todos los resultados.\n"
    threadPriority:
      title: Mostrar la prioridad en los foros
      md: "Los temas se enumeran ordenados por prioridad de visualización. Los temas
        con la misma prioridad se ordenan por hora de la última actividad.\n---\n\
        \ Los hilos fijados tienen una prioridad de 1, los hilos normales tienen una
        prioridad de 0. Para poder ordenar los hilos mostrados con mayor precisión,
        también puede establecer valores más altos aquí para que los temas estén siempre
        en la parte superior independientemente de la fecha de modificación.\nLos
        hilos con prioridad -1 aparecen debajo de todos los demás hilos.\n"
    masterRegion:
      title: Distrito principal
      md: "Si los distritos tienen un distrito maestro, todos los miembros del distrito
        se incluyen automáticamente en el distrito maestro. En muchos casos, tiene
        sentido seleccionar el distrito padre como maestro, pero también son posibles
        otras aplicaciones. Si el distrito maestro no es el distrito padre, los usuarios
        del distrito **no** se incluirán automáticamente en el distrito padre.\n\n\
        \ Si no desea que los usuarios se añadan automáticamente a otro distrito,
        establezca el maestro como raíz.\n---\nLa inclusión en el distrito maestro
        ocurre una vez cada noche. Los cambios no se producen inmediatamente.\n"
    profileCommitmentsStat:
      title: Estadísticas de participación
      md: es visible desde el papel del responsable de la empresa. Se limita a 
        un distrito de domicilio común o a operaciones conjuntas.
    achievements:
      title: Etiquetas
      md: "El sistema de pegatinas se puede utilizar para marcar características específicas
        del usuario, como la participación en determinados cursos de formación. Las
        pegatinas pueden ser válidas por cualquier período de tiempo o tener una fecha
        de finalización a partir de la cual dejan de ser válidas.\n"
    report:
      title: Procesamiento de mensajes
      md: "Aquí veras mensajes escritos sobre personas de este distrito de origen.
        Sin embargo, no se mostrarán todos los mensajes:\n- En principio, no verás
        ningún mensaje en el que tu o tus coadministradores de LMG o LS estén involucrados.\n\
        \ - Como administrador de LS, solo tienes acceso a los informes en los que
        participan los administradores de LMG.\n---\nPuedes leer información sobre
        cómo procesar un informe: [Procesar un informe](https://wiki.foodsharing.de/Rulestraumas_-_Konsequences_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)\n"
    reportReasons:
      title: Formulario del informe
      md: "Foodsavers puede informar infracciones de las reglas directamente utilizando
        el formulario de informe. Al activarlo, los responsables de los reportes recibirán
        rápida y fácilmente notificaciones de los reportes realizados de esta manera.\n\
        \ ---\nEl grupo local de quejas del distrito puede establecer qué motivos
        de notificación se muestran en el formulario de notificación.\nPuede elegir
        entre motivos de informes simplificados y detallados. Los motivos detallados
        para informar incluyen todas las reglas enumeradas [aquí en la wiki en el
        punto B](https://wiki.foodsharing.de/Verhaltensregelen#B.29_Verhalten_bei_Abholungen).\n\
        También puede elegir si la opción “Otro” debe aparecer como motivo adicional
        del mensaje.\n---\nEl grupo local de reclamaciones puede recibir recomendaciones
        sobre contratación. Sin embargo, la decisión y la responsabilidad de estas
        configuraciones recae únicamente en los administradores del grupo de informes
        local, quienes no *tienen* que seguir estas recomendaciones.\n"
    basket:
      title: Cestas de comida
      md: "Las cestas de alimentos son ofrecidas por usuarios que desean entregar
        alimentos (a menudo rescatados) **gratis**. Los usuarios registrados pueden
        solicitar una cesta de alimentos para recogerla.\n"
    achievementIcon:
      md: "Cada etiqueta tiene un icono, es decir, un pequeño gráfico que debe mostrar
        a primera vista de qué se trata. Puedes encontrar una lista de los iconos
        disponibles en https://fontawesome.com/v5/search?o=r&m=free&s=solid.\n\nEn
        el campo de entrada tienes que introducir el nombre del icono que quieres
        utilizar, por ejemplo «*walking*» o «*shopping-cart*».\nPuedes comprobar si
        tu entrada funciona mirando la vista previa.\nSi no introduce ningún icono,
        se utilizará automáticamente el icono estándar para notas «*tag*».\n"
      title: Iconos para etiquetas
    moderatorForumHide:
      title: Oculto en los foros por los moderadores
      md: "###### ¿Quién es un moderador?\nLos moderadores de un grupo o distrito
        son normalmente los administradores o BOTs. Si hay un GOALS-AG *Moderación*
        en un distrito, los administradores de este grupo tienen el papel de moderadores.\n\
        \ ---\n###### Ocultar en los foros\nSi esta opción está activada, los moderadores
        pueden ocultar todos los mensajes del foro. Deben dar una razón por la que
        quieren ocultar un mensaje o un tema. Los moderadores podrán seguir accediendo
        a los mensajes durante 3 meses más, durante el cual también podrán recuperarlos.
        Los demás usuarios (sin derechos de organización) ya no tienen acceso a él.
        Transcurridos estos 3 meses, los mensajes ocultos ya no podrán restaurarse
        y se borrarán\n---\n###### ¿Dónde se puede usar esta opción?\nEn los grupos
        de notificación locales y organismos de arbitraje (GOALS AGs) esta función
        es necesaria por razones de privacidad.\nOtros grupos de trabajo pueden votar
        por los permisos de los administradores para ocultar publicaciones y enviar
        un enlace a ags.distrito@foodsharing.network. Esta opción no está prevista
        para los distritos locales.\n"
    polls:
      title: Votación
      md: "Con el módulo de votación, las elecciones, encuestas y otros votos se pueden
        realizar de forma anónima y sencilla directamente en la plataforma foodsharing.
        Encontrarás instrucciones detalladas en https://wiki.foodsharing.de/Modul\n"
    pollScopes:
      md: "Al crear una votación, puedes elegir entre diferentes grupos de personas
        para votar.\nPara todas las opciones:\n- No solo pueden votar todos los Foodsaver
        dentro del distrito/grupo, sino también los subdistritos.\n- El número de
        Foodsaver con derecho a voto se encuentra entre paréntesis detrás de la opción.\n\
        \ - Una vez que la votación se ha creado, los votantes están determinados.
        Tiene derecho a votar quien, en el momento de la creación de la votación,
        pertenece al grupo de personas correspondiente.\n"
      title: Derecho a votar
    hygieneRequirement:
      md: "Para la recogida en algunos establecimientos, los food savers deben tener
        una formación en higiene alimentaria. Si esta función está activada para un
        establecimiento, esto tiene los siguientes efectos:\n1. los ahorradores de
        comida sin formación válida en higiene no pueden inscribirse en el equipo
        del establecimiento.\n2. los restauradores que ya formen parte del equipo
        sólo podrán inscribirse en las franjas horarias en las que su formación en
        higiene siga siendo válida en ese momento.\n\nEn ambos casos, se mostrará
        una nota explicando que falta la formación en higiene para esta acción. La
        formación en higiene también se vincula directamente en cada caso.\n\n---\n\
        \ \nImportante: Esta función sólo se basa en los propios adhesivos de higiene
        de foodsharing. Técnicamente no se tienen en cuenta ni los certificados de
        higiene de proveedores externos (como Metro) cargados en el perfil ni la formación
        en higiene adquirida en otro lugar.\n"
      title: Requisitos de higiene para las empresas
    change_verified_data:
      title: Solicitar un cambio en los datos verificados
      md: "Para trabajar como ahorrador de alimentos, es importante que la información
        de tu perfil sea correcta. Antes de poder ahorrar alimentos, los embajadores
        la compararán con tu identificación. Por lo tanto, no puedes simplemente cambiar
        tu nombre y fecha de nacimiento.\n---\nSi necesitas cambiar alguno de estos
        campos, puedes contactar a un embajador de tu distrito. Ellos harán los cambios
        necesarios. Puedes averiguar quiénes son los embajadores de tu distrito en
        el [foro del distrito]({link}) en la barra lateral izquierda.\n"
    publicEvent:
      title: Eventos públicos
      md: "Los administradores de un grupo de trabajo, los administradores del Grupo
        de Trabajo de Relaciones Públicas de GOALS o los embajadores pueden registrar
        eventos como públicos. Los eventos públicos están abiertos a todos. No es
        necesario iniciar sesión en la plataforma para ver la ubicación y la información
        del evento. Sin embargo, el tablón de anuncios y la lista de participantes
        solo son accesibles para usuarios registrados.\nRegistra un evento como público
        si deseas invitar a personas fuera de tu comunidad local de foodsharing; todos
        son bienvenidos.\n"
    pickupOptions:
      title: Opciones de recogida
      md: "La sección *Opciones de recogida* te muestra un resumen de todas las recogidas
        próximas en tus negocios que aún buscan rescatadores de alimentos. Puedes
        personalizar la vista según tus necesidades usando el menú de opciones:\n\n\
        **Recogidas registradas:** Para ayudarte a planificar mejor tus recogidas,
        también puedes ver las recogidas en las que ya estás registrado. Estas recogidas
        se muestran un poco más claras para que puedas reconocerlas a simple vista.\n\
        \n**Vista para jefes de equipo:** Los jefes de equipo se aseguran de que todas
        las recogidas en sus negocios funcionen correctamente. Si es jefe de equipo,
        puedes limitar la vista a los negocios de los que eres responsable. Esto facilita
        el seguimiento.\n\n**Agrupado por día:** En esta vista, tus opciones de recogida
        se resumen por día y se presentan de forma más compacta. Esto facilita obtener
        una visión general, especialmente si tienes muchas opciones de recogida disponibles
        al día.\n"
team_page:
  board_member:
    text: "La junta directiva de foodsharing e.V. mantiene unidos los hilos, conecta
      a Alemania, Austria y Suiza como usuarios de la plataforma foodsharing.de y
      es responsable de los asuntos nacionales. La junta directiva trabaja mucho en
      equipo, en estrecha consulta entre sí y principalmente en línea para abordar
      todas las inquietudes de la gran comunidad de intercambio de alimentos y de
      partes externas. Además, la junta se ocupa ampliamente del desarrollo organizacional
      y la dimensión política del desperdicio de alimentos.\n"
    title: Junta Directiva
  alumni_member:
    text: "Juntos recordamos la exitosa historia del intercambio de alimentos. ¡Aprovechamos
      esta oportunidad para agradecer a todas las personas que participaron en esto,
      ya sea como voluntarios a tiempo completo o en muy alto grado, al equipo de
      organización o a la junta directiva!\n"
    title: Antiguos alumnos
  it_member:
    title: Equipo de TI
    text: "El foodsharing sólo es posible gracias al compromiso de miles de voluntarios.
      Estas son algunas de las personas que coordinan grupos de trabajo nacionales,
      desarrollan el sitio web o asumen otras tareas importantes para el foodsharing
      en su conjunto:\n"

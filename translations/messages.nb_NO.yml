startpage:
  donate:
    title: Donere
    link: Støtt foodsharing
    text: "Vi prøver å sponse eventuelle utgifter. I noen tilfeller lykkes eller lykkes
      dette imidlertid ikke\ni sin helhet, for eksempel til utgifter til finansiering
      av arrangementer, juridisk rådgivning eller forsikring.\nVi tar gjerne imot
      all støtte.\n"
  demands:
    title: Krav
    text: "For å redusere matsvinnet på en effektiv måte må vi gjøre mer enn bare
      å redde matrester fra gårdene eller opplyse forbrukerne fra gårdene eller opplyse
      forbrukerne.\nI stedet må noe endres politisk:\nVi trenger forpliktende reduksjonsmål
      for avfall langs hele verdikjeden. I tillegg må gjeldende handelsstandarder
      revurderes og lempes, og organisasjoner som sparer mat eller tilbyr undervisning
      om ernæringsfaget må styrkes.\n"
  near_you:
    text2:
      part2: Matkurver
      part1: Det er også
      part3: – med denne kan du tilby egne overskuddsvarer og hente dagligvarer hos
        andre.
    text1:
      part2: Kart
      part4: Distribusjonsstasjon
      part1: På
      part3: finner du
      part5: ', dette er hyller eller kjøleskap hvor du kan hente eller ta med dagligvarer
        gratis.'
    text3:
      part2: Finn distrikter i ditt område
      part1: Samfunnet er organisert i distrikter.
    title: nærme deg
  call_to_action:
    title: Delta
    text: Vi ble grunnlagt i 2012, og nå er vi en internasjonal bevegelse med over
      500 000 brukere i Tyskland, Østerrike, Sveits og andre europeiske land.
  vision:
    title: Oppdrag
    text: Vårt langsiktige mål er å redusere kastkulturen av mat og andre ressurser.
      Vi sparer mat i private husholdninger og bedrifter – kollektivt, bærekraftig
      og respektfullt. Vi ser på oss selv som både en politisk og en utdanningsbevegelse.
  slogan_3: foodsharing er og forblir gratis.
  slogan_2: samarbeidende, bærekraftig og takknemlig
  slogan_1: Sammen for mer verdsettelse av mat
  welcome_text: Velkommen til foodsharing
  call_to_action_button: Delta
  how_we_work:
    text: "«Alt dette bygges opp frivillig og gratis, uavhengig og reklamefritt. Denne
      plattformen er hjertet\nav samfunnet vårt. Det er stedet hvor vi koordinerer
      oss lokalt og i hele Europa. Nettstedet og betaappen er\nåpen kildekode og de
      er basert på involvering og medfølelse fra mange. Hvordan kan du delta i IT-avdelingen?»\n"
    title: Slik går det
  private:
    title: privat
    text: Si krig mot matsvinn i husholdningen din. Vi gir informasjon om hvordan
      du gjør dette på messer og arrangementer.
  store:
    title: som et selskap
    text: Jobber du i et supermarked, restaurant, kantine, …? Registrer bedriften
      din og spar mat.
  member:
    text: Del dine overflødige dagligvarer med matdelingsfellesskapet eller spar dagligvarer
      fra selskaper.
    title: som medlem
  more_infos: Finne ut mer
  this_is_how_it_works: Slik fungerer det
  towns:
    title: foodsharing byer
    text: "Deltakende byer er forskjellige når det gjelder om de fortsatt er på vei
      eller allerede ble anerkjent\nsom en matdelingsby. Det siste er tilfellet når
      det er et matdelingsteam på stedet også en\nmotivasjonserklæring signert av
      byadministrasjonen som et symbol på partnerskapet mellom\nfoodsharing og offentlig
      sektor.\n"
  bedependable: Vær pålitelig
  join: Ta del
  beresponsible: Vær ansvarlig
  join_rules: Delta – Våre regler
  followrules_c: Alle detaljer finner du i <a href="https://wiki.foodsharing.de/Hygieneregeln"
    target="_blank" rel="noopener noreferrer nofollow">hygieneregler for matdeling</a>.
    Merknader kan også finnes i <a href="https://wiki.foodsharing.de/Hygiene-Ratgeber_für_Lebensmittel"
    target="_blank" rel="noopener noreferrer nofollow">Guide</a>.
  forstores: For bedrifter og virksomheter
  registernow: Registrer deg nå
  register: Nederst på denne siden kan du registrere deg som matdeler.
  followrules_b: Vi påpeker uttrykkelig at vi av juridiske årsaker kun tillater tilbud
    og deling av visse matvarer og andre varer under visse betingelser. Dette gjelder
    spesielt lett bedervelige matvarer som rå fisk, rått kjøtt, rå eggeretter og ferdigmat.
    Generelt bruker vi alle sansene våre for å sikre at maten fortsatt er spiselig.
  join_welcome: Fint at du vil være med på matdeling!
  makeproposals: Kom med forslag
  telltruth: Alle vi som utviklet matdeling og driver nettstedet tar jobben vår veldig
    seriøst. Vi følger en rekke lover og forskrifter. Vær også ærlig når du fyller
    ut dataene dine og i alle andre bidrag du gir på plattformen, for eksempel matkurver
    og foruminnlegg.
  honest: Vær ærlig
  respect: 'Siden mat holder oss i live, ønsker vi også å behandle den med respekt.
    For å sikre at alt går optimalt for oss, har vi definert en rekke oppførselsregler
    opp gjennom årene. Å gi mat videre til andre er en veldig human, men også ansvarlig
    ting. Grunnprinsippet er alltid: «Ikke gi noe videre til andre som du ikke lenger
    ville spist selv». Les matdelingsetiketten en gang!'
  followrules_a: Følg reglene og <a href="https://wiki.foodsharing.de/Hygiene-Ratgeber_für_Lebensmittel"
    target="_blank" rel="noopener noreferrer nofollow">Guide</a> for å gi mat videre
  together: Sammen med matdeling kan du jobbe for at utsortert og uselgbar mat kommer
    til god nytte i stedet for å kastes. Mer informasjon finner du [her](/fuer-unternehmen).
  dependability: Mange steder er det lagt opp til at mat deles på visse steder. Du
    kan møtes der eller på andre nøytrale steder for å dele. Hvis du ønsker å overlevere
    eller overta dagligvarer, vær pålitelig og punktlig, ikke la noen bli stående
    ute i regnet.
  notallowed: Formidling av medisiner (inkludert homøopatiske midler) er utelukket
    med foodsharing. Klær, kosmetikk, husholdningskjemikalier, leker og andre ikke-matvarer
    kan ikke byttes eller deles via matdeling. Plattformen forbeholder seg retten
    til å slette slike tilbud.
  responsibility: En tredjedel av all mat havner i søpla. Dette bør det bli en slutt
    på. Vi vil bekjempe matsvinnet totalt. Vi ønsker å håndtere mat på en ansvarlig
    måte og er glade for at du deltar.
  proposals: Vi ønsker å fortsette å utvikle oss, for å bli bedre og bedre. Til dette
    trenger vi dine gode idéer og tips. Send dem til [info@foodsharing.de](mailto:info@foodsharing.de)
  etiquette: etikette for matdeling
  followrules_title: Følg reglene og rådene for videresending av mat
  followrules: "Vi påpeker uttrykkelig at vi av juridiske årsaker kun tillater tilbud
    og deling av visse matvarer og andre varer under visse betingelser. Dette gjelder
    spesielt lett bedervelige matvarer som rå fisk, rått kjøtt, rå eggeretter og ferdigmat.
    Generelt bruker vi alle sansene våre for å sikre at maten fortsatt er spiselig.
    Alle detaljer finner du i [hygieneregler for matdeling](https://wiki.foodsharing.de/Hygiene
    Rules). Informasjon kan også finnes i [Guide](https://wiki.foodsharing.de/Hygiene-Ratgeber_für_Lebensmittel).\n"

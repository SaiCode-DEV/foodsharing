team_page:
  board_member:
    title: Klubbstyret
    text: "Styret i foodsharing e.V. holder trådene sammen, nettverker Tyskland, Østerrike
      og Sveits som brukere av foodsharing.de-plattformen og er ansvarlig for overregionale
      saker. Hovedstyret jobber tett sammen som et team og hovedsakelig online for
      å håndtere alle bekymringer fra det store foodsharing-fellesskapet og eksterne
      parter. I tillegg arbeider hovedstyret mye med organisasjonsutvikling og den
      politiske dimensjonen ved matsvinn.\n"
  it_member:
    title: IT-teamet
    text: "foodsharing er bare mulig takket være engasjementet til tusenvis av frivillige!
      Her er noen av dem som koordinerer nasjonale arbeidsgrupper, utvikler nettstedet
      eller tar på seg andre viktige oppgaver for foodsharing som helhet:\n"
  alumni_member:
    title: Tidligere
    text: "Sammen kan vi se tilbake på en vellykket historie med foodsharing. Vi vil
      gjerne benytte anledningen til å takke alle som har bidratt til dette, noen
      av dem har jobbet fulltid på frivillig basis eller i svært stor grad for arrangørteamet
      eller styret!\n"

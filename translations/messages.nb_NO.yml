        hvilket svar som er riktig eller galt, og hvorfor. Hvis du gjør en feil, bør
        du lese forklaringene nøye. Hvis noe virker ulogisk, uforståelig eller til
        og med feil, kan du legge igjen en kommentar. Kommentarene dine kan knyttes
        til deg, slik at du får personlig tilbakemelding.
      pause: Du kan sette quizen på pause etter hvert spørsmål og fortsette på et
        senere tidspunkt.
      feedback: Når du er ferdig med quizen, får du umiddelbart en evaluering av om
        du har bestått og hvilke feil du har gjort hvor. Deretter kan du lese gjennom
        begrunnelsene igjen i ro og mak.
      unlimited_tries: Du kan gjenta denne testen så ofte du vil, og du blir aldri
        diskvalifisert hvis du stryker. Det kan imidlertid hende du må ta en pause

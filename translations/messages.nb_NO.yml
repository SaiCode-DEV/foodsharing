help:
  key:
    storeLog:
      title: Driftslogg
      md: "Driftsloggen er en måte å spore **aktivitetene i en bedrift**. Det kan
        bidra til å løse konflikter eller rette opp tilfeldige feil.\n---\n######
        Eksempel\nLa oss si at du vil vite hvem som ble lagt til i teamet av hvem
        i løpet av de siste 3 ukene. Deretter kan du angi perioden ved å bruke start-
        og sluttdatoene i de to datofeltene. Deretter kan du velge alle relevante
        handlingstyper fra rullegardinmenyen. I dette tilfellet, for eksempel \" *Gjør
        medlemskapsforespørsler*\", \"*Godta medlemskapsforespørsler*\" og \"*Avvis
        medlemskapsforespørsler*\". Hvis du nå klikker på \"*Vis valgte handlinger*\"\
        -knappen, vil du få vist en historikk over de valgte hendelsene.\n---\n######
        Tilgang\nBare de som kan administrere selskapet har tilgang til det. Driftsloggen
        er ikke synlig for vanlige matsparere og hoppere.\n---\n###### Begrensninger\n
        Maksimalt 100 oppføringer vil bli lastet inn. Du må kanskje begrense søkeperioden
        eller de valgte handlingstypene hvis ikke alle resultater vises.\n"
    threadPriority:
      md: "Emner er oppført sortert etter visningsprioritet. Emner med samme prioritet
        er sortert etter tidspunktet for siste aktivitet.\n---\nFestede tråder har
        en prioritet på 1, vanlige tråder har en prioritet på 0. For å kunne sortere
        de viste trådene mer presist kan du også sette høyere verdier her slik at
        emner alltid er øverst uavhengig av endringsdato.\nTråder med prioritet -1
        vises under alle andre tråder.\n"
      title: Trådprioritet
    profileCommitmentsStat:
      title: Engasjementsstatistikk
      md: er synlig fra rollen som samarbeidsleder. Det er begrenset til et felles
        hjemdistrikt eller vanlige butikker.
    masterRegion:
      md: "Hvis distriktene har et masterdistrikt, blir alle medlemmene i distriktet
        automatisk inkludert i masterdistriktet. I mange tilfeller er det fornuftig
        å velge foreldredistriktet som masterdistrikt, men det er også mulig å velge
        andre anvendelser. Hvis masterdistrikt ikke er foreldredistriktet, vil brukere
        i distriktet **ikke** automatisk bli inkludert i foreldredistriktet.\n\nHvis
        du ikke ønsker at brukere automatisk skal legges til i et annet distrikt,
        må du sette masterdistriktet til root.\n---\nInkludering i masterdistrikt
        skjer én gang hver natt. Endringer skjer ikke umiddelbart.\n"
      title: Mesterdistrikt
    achievements:
      md: "Klistremerkesystemet kan brukes til å markere brukerspesifikke egenskaper,
        som for eksempel deltakelse på enkelte kurs. Klistremerker kan være gyldige
        i en hvilken som helst tid eller ha en sluttdato som de er ugyldige fra.\n"
      title: Klistremerker
    basket:
      md: "Matkurver tilbys av brukere som ønsker å gi videre (ofte reddet) mat **gratis**.
        Registrerte brukere kan be om en matkurv å hente.\n"
      title: Matkurver
    report:
      title: Klagebehandling
      md: "Her vil du se klager skrevet på personer med dette hjemdistriktet. Imidlertid
        vil ikke alle klager vises til deg:\n- Du vil i utgangspunktet ikke bli vist
        noen klager der du eller dine medadministratorer er involvert.\n- Som admin
        i den lokale voldgiftsnemnda har du kun tilgang til klager der administratorene
        i den lokale klagegruppen er involvert.\n---\nDu finner informasjon om hvordan
        du behandler en klage i Wiki.\n"
    reportReasons:
      md: "Matsparere kan rapportere regelbrudd direkte ved å bruke rapporteringsskjemaet.
        Ved å aktivere den vil de klageansvarlige motta raske og enkle varsler for
        klager som fremsettes på denne måten.\n---\nBydelens klageteam kan justere
        hvilke årsaker som vises på klageskjemaet. Du kan velge mellom forenklet og
        detaljert begrunnelse for klagen. Alle reglene som er oppført i Wiki er inkludert
        i den detaljerte begrunnelsen for klagen. Du kan også velge om alternativet
        «Annet» skal stå oppført som en ekstra grunn for rapportering.\n---\nAnbefalinger
        om seponering kan rettes til klagegruppen. Avgjørelsen og ansvaret for disse
        innstillingene ligger imidlertid utelukkende hos administratorene i den lokale
        klagegruppen, som ikke trenger å følge disse anbefalingene.\n"
      title: Klageskjema
    achievementIcon:
      title: Ikoner for klistremerker
      md: "Hvert klistremerke har et ikon, en liten grafikk som skal vise ved første
        øyekast hva den handler om. Du kan finne en liste over tilgjengelige ikoner
        på https://fontawesome.com/v5/search?o=r&m=free&s=solid.\n\nI inntastingsfeltet
        må du skrive inn navnet på ikonet du vil bruke, for eksempel «*walking*» eller
        «*shopping-cart*».\nDu kan sjekke om inndataene dine fungerer ved å bruke
        forhåndsvisningen.\nHvis du ikke skriver inn et ikon, vil standardikonet for
        klistremerker «*tag*» automatisk bli brukt\n"
    polls:
      title: Avstemningene
      md: "Ved å bruke stemmemodulen kan valg, undersøkelser og andre stemmer gjennomføres
        anonymt og enkelt direkte på matdelingsplattformen. Du finner detaljerte instruksjoner
        på https://wiki.foodsharing.de/Abstimms-Modul\n"
    pollScopes:
      title: Stemmerett
      md: "Når du oppretter en stemme, kan du velge blant ulike grupper av personer
        som skal ha stemmerett.\nFølgende gjelder for alle alternativer:\n- Ikke bare
        alle matsparere i bydelen/gruppa får stemme, men også i underdistriktene.\n
        - Antall stemmeberettigede matsparere står i parentes bak valgmuligheten.\n
        - Så snart avstemningen er opprettet, avgjøres de stemmeberettigede. Den som
        faller inn i den aktuelle folkegruppen på det tidspunkt avstemningen foretas,
        har stemmerett.\n"
    moderatorForumHide:
      title: Skjuler seg i forum av moderatorer
      md: "###### Hvem er moderator?\nModeratorene for en gruppe eller et distrikt
        er vanligvis administratorer eller ambassadører. Hvis det er en GOALS-AG *moderasjon*
        i et distrikt, tar administratorene av denne gruppen på seg rollen som moderatorer.\n
        ---\n###### Skjul i fora\nNår aktivert, kan moderatorer skjule alle innlegg
        i forumet, ikke bare sine egne. For å gjøre dette må du oppgi en grunn til
        hvorfor du vil skjule et innlegg eller hele tråden. Et innlegg forblir deretter
        tilgjengelig for moderatorene i ytterligere tre måneder og kan også gjenopprettes
        i løpet av denne tiden. Andre brukere (uten organisasjonsrettigheter) har
        ikke lenger tilgang til den. Etter disse tre månedene kan et skjult innlegg
        ikke lenger gjenopprettes og vil bli permanent slettet fra databasen.\n---\n
        ###### Hvor kan dette alternativet brukes?\nI lokale rapporteringsgrupper
        og voldgiftsråd (GOALS AGs) er denne funksjonen nødvendig av hensyn til databeskyttelse.\n
        Andre arbeidsgrupper kan stemme internt for å gi administratorer tillatelse
        til å skjule innlegg og sende en lenke til den vellykkede avstemningen til
        ags.bezirke@foodsharing.network. Dette alternativet er ikke gitt for lokale
        distrikter.\n"
    hygieneRequirement:
      title: Hygienekrav for bedrifter
      md: "Noen bedrifter krever at matreddere må være opplært i mathygiene for å
        kunne hente hos dem. Hvis denne funksjonen er aktivert for en bestemt butikk,
        har dette følgende konsekvenser:\n1. matsparere uten gyldig hygieneopplæring
        kan ikke søke om å bli med i teamet.\n2. matsparere som allerede er en del
        av teamet, kan bare registrere seg for plasser hvis hygienetreningen deres
        fortsatt er gyldig på tidspunktet for ønsket henting.\n\nI begge tilfeller
        vises det en melding som forklarer at hygienetreningen er nødvendig for denne
        handlingen. Hygienetesten er også koblet direkte i hvert enkelt tilfelle.\n
        \n---\n\nViktig å merke seg: Denne funksjonen er kun basert på foodsharings
        egen hygieneopplæring. Verken hygienesertifikater fra eksterne leverandører
        (f.eks. Metro) som er lastet opp til profilen eller hygienekurs som er notert
        andre steder, blir for øyeblikket tatt i betraktning.\n"

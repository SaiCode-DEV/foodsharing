      Aqui podes associar os teus eventos de foodsharing a um programa de calendário à tua escolha. Assim, todas as tuas vagas e/ou eventos serão automaticamente adicionados no teu calendário.

      **Mantém os links do calendário em segredo.** Eles contêm um *token* que permite aceder aos dados das tuas vagas sem necessidade de palavra-passe. Podes eliminar o teu token atual a qualquer momento, tornando inválidos os links do calendário criados anteriormente.

      O teu programa de calendário deve **sincronizar** este calendário regularmente. Só assim as novas vagas aparecerão e os eventos cancelados deixarão de aparecer. Se, em vez disso, descarregares o teu calendário atual, este conterá apenas os teus eventos atuais e não será atualizado automaticamente.

      description: 'Escolha uma das seguintes aplicações de autenticação gratuitas
        e de código aberto para o teu equipamento:'
      info: Também é possível utilizar aqui uma aplicação de autenticação já 
        utilizada para outros serviços. Se ainda não tiver uma, instale primeiro
        uma aplicação antes de continuar.
    qrcode:
      title: Digitalizar código QR
      label: 'Digitalize este código QR com a tua aplicação de autenticação:'
      scan_instruction: Abra a tua aplicação de autenticação e adicione uma nova
        conta digitalizando este código QR.
      multi_device: Pode utilizar este código para configurar quantos 
        dispositivos desejar.
    secret_label: 'Alternativamente, pode introduzir este código manualmente:'
    secret_toggle: Mostrar código (caso a digitalização QR não funcione)
    backup_codes:
      title: Guardar códigos de segurança
      label: 'Caso perca o acesso ao teu dispositivo de autenticação de dois fatores
        (perda/roubo/danos), pode utilizar os seguintes códigos de backup, cada um
        deles válido uma única vez:'
      info: Guarde estes códigos num local seguro. Qualquer pessoa que tenha 
        acesso a estes códigos e conheça a tua palavra-passe pode iniciar sessão
        na tua conta de utilização.
      save_instruction: Guarde esses códigos num local seguro (por exemplo, num 
        gestor de palavras-passe ou em papel).
      confirmation: Guardei os códigos de backup em local seguro
      must_confirm: Tens de confirmar que guardou os códigos de backup
    confirm:
      title: Confirmar ativação
      instruction: Para ativar a autenticação de dois fatores, insira aqui o 
        código gerado e a tua palavra-passe.
      test_instruction: Abra a tua aplicação de autenticação e introduza o 
        código de 6 dígitos atual para garantir que tudo está a funcionar 
        corretamente.
      logout_notice: 'Nota: Após ativar a autenticação de dois fatores, terá de iniciar
        o login novamente.'
    generated_code_label: Código gerado
    password_info: Para fazer alterações, é sempre necessário introduzir a tua 
      palavra-passe. Isto impede que outra pessoa que utilize o teu computador 
      ou smartphone possa alterar esta configuração crítica para a segurança.
    danger: 'Importante: caso perca o teu telemóvel ou ele seja roubado e não tenha
      acesso aos códigos de backup, não conseguirá iniciar sessão. Terá de contactar
      o suporte para recuperar o acesso à tua conta usuário.'
    activate: Ativar
    next: Continuar
    success: A autenticação de dois fatores foi ativada com sucesso.
    failed: Não foi possível ativar a autenticação de dois fatores, pois o 
      código ou a palavra-passe foram introduzidos incorretamente.
  two_fa_disable:
    title: Desativar a autenticação de dois fatores
    warning: Caso desative a autenticação de dois fatores, a tua conta usuário 
      ficará menos segura. Qualquer pessoa que conheça a tua palavra-passe ou 
      tenha acesso aos seus e-mails (palavra-chave «Esqueci a minha 
      palavra-passe») poderá aceder à tua conta usuário. Ao desativar a 
      autenticação, os seus códigos de backup também serão invalidados. Terá de 
      iniciar sessão novamente.

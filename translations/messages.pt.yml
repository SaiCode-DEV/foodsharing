help:
  key:
    publicEvent:
      md: "Os eventos podem ser registados como públicos pelos administradores de
        um grupo de trabalho ou pelos administradores do GOALS-AG Relações Públicas
        ou pelos embaixadores. Os eventos públicos são acessíveis a todos. Não é necessário
        estar registado na plataforma para ver o local do evento e as informações.
        No entanto, o mural e a lista de participantes só estão acessíveis aos utilizadores
        registados.\nRegiste um evento como público se quiser convidar pessoas de
        fora da tua comunidade local de foodsharing e se todos puderem participar.\n"
      title: 'Eventos públicos'
    reportReasons:
      title: Formulário de denúncias
      md: "Através do formulário de denúncias, os Foodsavers podem denunciar diretamente
        as violações das regras. Ao ativá-lo, as pessoas responsáveis pelas denúncias
        recebem notificações rápidas e fáceis sobre as notificações enviadas dessa
        forma.\n---\nO grupo de denúncias local do distrito pode definir quais motivos
        de notificação são exibidos no formulário de notificação.\nÉ possível escolher
        entre motivos de denúncia simplificados e detalhados. Os motivos de denúncia
        detalhados incluem todas as regras listadas [aqui no Wiki em B](https://wiki.foodsharing.de/Verhaltensregeln#B.29_Verhalten_bei_Abholungen)
        (Infelizmente, até agora só em alemão)\nAlém disso, é possível selecionar
        se a opção «Outros» deve ser listada como outro motivo de notificação.\n---\n\
        Recomendações sobre a configuração podem ser enviadas ao grupo de denúncias
        local. No entanto, a decisão e a responsabilidade sobre essa configuração
        são exclusivamente dos administradores do grupo de notificação local, que
        não são obrigados a seguir essas recomendações.\n"
    report:
      title: Processamento de denúncias
      md: "Aqui são mostradas notificações relativas a pessoas deste distrito principal.
        No entanto, nem todas as mensagens são exibidas:\n- Basicamente, não são exibidas
        mensagens nas quais tu ou os teus coadministradores do grupo local de denúncias
        ou da comissão de arbitragem estejam envolvidos.\n- Como administrador(a)
        da comissão de arbitragem, só tens acesso às mensagens nas quais os administradores
        do grupo local de denúncias estão envolvidos.\n---\nPodes ler aqui as instruções
        para editar uma mensagem: [Editar uma mensagem](https://wiki.foodsharing.de/Regelverletzungen_-_Konsequenzen_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)\n\
        (Infelizmente, até agora só em alemão)\n"
    achievementDuplicateMode:
      md: |
        Os selos podem servir como marcação em situações muito diferentes. Por isso, é possível definir se o selo pode ser atribuído várias vezes ao mesmo tempo à mesma pessoa.

        - **Sobrescrever:** Não é possível receber o selo várias vezes ao mesmo tempo. Se o selo for atribuído novamente, a atribuição atual substitui ou prolonga a anterior. Isto é utilizado, por exemplo, para a formação em higiene. Quem renova a formação, o teu selo é simplesmente prolongado. Selecione *Sobrescrever* se o selo tiver de marcar um estado atual e inequívoco.
        - **Atribuir várias vezes:** É possível atribuir várias vezes ao mesmo tempo. Os selos atribuídos várias vezes são apresentados agrupados no perfil, mas todas as informações correspondentes estão acessíveis. Isto pode ser utilizado, por exemplo, para documentar recolhas de amostras, das quais são necessárias várias. Selecione *Atribuir várias vezes* se cada atribuição individual for importante e tiver de permanecer rastreável.
      title: 'Atribuição múltipla de selos'
    hygieneRequirement:
      md: |
        Para trabalhar em algumas equipas, os Foodsavers devem ter formação em higiene alimentar. Quando esta função está ativada para uma equipa, tem as seguintes implicações:
        1. Os Foodsavers sem formação válida em higiene não podem candidatar-se à equipa da loja.
        2. Os Foodsavers que já fazem parte da equipa só podem inscrever-se em vagas cuja formação em higiene ainda seja válida.

        Em ambos os casos, é exibida uma nota explicando que falta a formação em higiene para esta ação. Além disso, a formação em higiene está diretamente ligada em cada caso.

        ---

        Importante: esta função baseia-se apenas nos selos de higiene próprios da foodsharing. Nem os certificados de higiene de fornecedores externos (como, por exemplo, Metro) carregados no perfil, nem os cursos de higiene adquiridos noutro local são tecnicamente considerados.
      title: 'Requisitos de higiene para lojas'
    achievementVisibility:
      md: |
        A visibilidade de um selo determina quem pode ver se o selo foi atribuído a alguém. Estão disponíveis as seguintes opções:

        - **Oculto:** o selo só é visível para utilizadores com direitos de organização.
        oculto: «Não é exibido a ninguém»
        - **Privado:** Apenas a própria pessoa em questão, bem como os administradores e embaixadores da área de validade especificada, podem ver o selo.
        - **Apenas responsáveis das cooperações:** O selo é exibido à própria pessoa, bem como a todos os responsáveis das cooperações na área selecionada.
        - **Na área de validade:** O selo é visível para todos os utilizadores que são membros do distrito especificado.
        - **Global:** O selo é visível para todos os utilizadores registados.

        Considere sempre até que ponto a visibilidade pode ser restringida para não tornar desnecessariamente visíveis informações pessoais. O nível de visibilidade pode ser ajustado posteriormente.
      title: 'Visibilidade de selos'
    commons_resources:
      title: 'Recursos comuns'
      md: 'Alguns recursos não pertencem a uma única pessoa, mas à comunidade.


        ##### Quais são alguns exemplos de recursos comunitários?

        Os recursos comunitários são geralmente **objetos**, **informações** ou **contatos**.
        Pode ser um banner do foodsharing do distrito, um arquivo de fotos na nuvem
        ou o contato de pessoas de contato externas. Como os recursos comunitários
        não são da responsabilidade de uma única pessoa, deve-se inserir um contato
        na descrição do recurso, se necessário.


        ##### Quem gere os recursos comunitários?

        Nos grupos de trabalho, todos os administradores podem criar, editar e apagar
        recursos comunitários. Nos distritos, os embaixadores têm inicialmente essa
        autorização. Se existir um grupo de trabalho de recursos, a autorização pertence
        aos administradores desse grupo de trabalho.

        '
    basket:
      title: 'Cabazes alimentares'
      md: 'Os cabazes alimentares são oferecidos por utilizadores que desejam distribuir
        alimentos (muitas vezes recuperados) **gratuitamente**. Os utilizadores registados
        podem solicitar um cabaz alimentar para o recolher.

        '
    storeLog:
      md: 'O registo de local é uma forma de acompanhar as atividades num local. Pode
        ajudar a resolver conflitos ou corrigir erros acidentais.

        ---

        ###### Exemplo

        Digamos que queiras saber quem foi adicionado à equipa nas últimas 3 semanas
        e por quem. Então, podes definir o período usando as datas de início e fim
        nos dois campos de data. Em seguida, podes selecionar todos os tipos de ações
        relevantes no menu suspenso. Neste caso, por exemplo, «*Fazer pedidos de adesão*»,
        «*Aceitar pedidos de adesão*» e «*Recusar pedidos de adesão*». Agora, se clicar
        no botão «*Mostrar ações selecionadas*», será exibido um histórico dos eventos
        selecionados.

        ---

        ###### Acesso

        Apenas quem também pode administrar o local tem acesso a isso. Para Foodsaver
        e substitutos normais, o registo de local não é visível.

        ---

        ###### Restrições

        São carregadas no máximo 100 entradas. Se necessário, pode ter de restringir
        o período de pesquisa ou os tipos de ação selecionados, caso nem todos os
        resultados sejam exibidos.

        '
      title: 'Registo de local'
    pickupOptions:
      title: 'Possibilidades de inscrição'
      md: 'A secção "vagas disponíveis" dá-lhe uma visão geral de todas as turnas
        vagas nos teus locais, para as quais ainda se procuram Foodsavers. Através
        do menu de opções, podes ajustar a visualização às tuas necessidades:


        **Vagas inscritas:** Para que possas planear melhor as tuas vagas, também
        podes visualizar as vagas em que já te inscreveste. Estas vagas são apresentadas
        em tons mais claros para que as possas identificar rapidamente.


        **Visualização para responsáveis por cooperações:** Os responsáveis por cooperações
        garantem que todas as vagas nos teus locais decorram de forma fiável. Se fores
        líder, podes restringir a visualização aos locais pelos quais és responsável.
        Assim, é mais fácil manter uma visão geral.

        **Agrupado por dias:** Nesta apresentação, as tuas opções de inscrição são
        agrupadas por dia e apresentadas de forma mais compacta. Isto facilita a obtenção
        de uma visão geral, especialmente quando há muitas opções de inscrição disponíveis
        por dia.

        '
    resource_mosaic:
      title: 'Mosaico de recursos'
      md: "A ideia\nAo salvar alimentos, todos nós partilhamos de forma muito eficaz
        o nosso tempo, capacidade de transporte e experiência. Mas, para dar novos
        impulsos a um sistema alimentar sustentável e fortalecer o movimento de foodsharing
        a longo prazo, é preciso mais do que apenas salvar. Cada um de nós traz recursos
        diferentes, ou seja, *habilidades*, *objetos* ou *contatos* que, por si só,
        muitas vezes ficam ocultos e sem uso. Juntos, porém, esses recursos podem
        se tornar visíveis e utilizáveis – como peças individuais de um mosaico que,
        juntas, formam uma grande imagem. O mosaico de recursos pode tornar essa diversidade
        visível. Assim, cria espaço para novas ideias de projetos, colaboração e apoio
        mútuo além da recuperação. \n\n##### A visão geral dos recursos\nO coração
        do mosaico de recursos é a visão geral de todos os recursos do distrito ou
        do grupo de trabalho. Pode simplesmente inspirar-se na diversidade do teu
        grupo ou pesquisar recursos específicos. Podes clicar em qualquer recurso
        para obter mais informações sobre ele. Também podes salvar recursos como favoritos
        para encontrá-los mais facilmente mais tarde. \nA cor de um recurso mostra
        o quanto a pessoa gosta de o partilhar: os recursos oferecidos com muito prazer
        aparecem em cores fortes e brilhantes, enquanto os recursos menos partilhados
        são apresentados em tons cinzentos.\n \n\n##### Pesquisar, filtrar e ordenar\n\
        Para encontrar rapidamente os recursos adequados, tens várias opções de filtragem
        à tua disposição.\n- Pode filtrar por **categorias** específicas ou pesquisar
        diretamente por determinados **termos**.\n- **Apenas utilizadores ativos**
        oculta os recursos de utilizadores que não iniciaram sessão nos últimos 30
        dias ou que estão atualmente dorminhocos.\n- No mosaico de recursos, são exibidos
        os recursos de todos os Foodsavers do grupo. Nos distritos, também podes restringir
        a visualização aos utilizadores cujo **distrito principal** é o distrito em
        questão.\n- Se tiver marcado recursos como **favoritos**, pode visualizar
        apenas esses recursos.\n\nAlém disso, pode **ordenar** os resultados, por
        exemplo, por «alegria com as solicitações», atualidade das entradas ou simplesmente
        aleatoriamente.\n"
    threadPriority:
      md: 'Os tópicos são listados por ordem de prioridade de exibição. Os tópicos
        com a mesma prioridade são ordenados pela data da última atividade.

        ---

        Os tópicos fixados têm prioridade 1, enquanto os tópicos normais têm prioridade
        0. Para ordenar os tópicos exibidos com mais precisão, também pode definir
        valores mais altos aqui, para que os tópicos fiquem sempre no topo, independentemente
        da data da alteração.

        Os tópicos com prioridade -1 são exibidos abaixo de todos os outros tópicos.

        '
      title: 'Prioridade de exibição nos fóruns'
    similar_resources:
      title: 'Recursos semelhantes'
      md: 'Como recursos semelhantes, serão apresentados até 10 recursos adicionais
        para os quais foram introduzidas as **mesmas categorias**.'
    profileCommitmentsStat:
      title: 'Atividade'
      md: 'é visível a partir da função de responsável por cooperações. É restrita
        ao distrito comum ou às locais comuns.'
    pollScopes:
      md: 'Ao criar uma votação, podes selecionar entre diferentes grupos de pessoas
        que terão direito a voto.

        Para todas as opções de votação, aplica-se o seguinte:

        - Não só todos os Foodsavers do distrito/grupo podem votar, mas também os
        subdistritos.

        - O número de Foodsavers com direito a voto está indicado entre parênteses
        atrás da opção de seleção.

        - Os eleitores serão determinados quando a votação for criada. Podem votar
        todos os que pertençam ao grupo correspondente nessa altura.

        '
      title: 'Direito de voto'
    polls:
      title: 'Votações'
      md: 'Com a ajuda do módulo de votação, é possível realizar eleições, sondagens
        e outras votações de forma anónima e simples diretamente na plataforma foodsharing.
        Encontra instruções detalhadas em https://wiki.foodsharing.de/Abstimmungs-Modul

        '
    achievementIcon:
      title: 'Icones para selos'
      md: 'Cada selo tem um ícone, ou seja, um pequeno gráfico que mostra à primeira
        vista do que se trata. Encontra uma lista dos ícones disponíveis em https://fontawesome.com/v5/search?o=r&m=free&s=solid.


        No campo de entrada, deve introduzir o nome do ícone que pretende utilizar,
        por exemplo, «*walking*» ou «*shopping-cart*».

        Pode verificar se a tua entrada está correta através da pré-visualização.

        Se não introduzir nenhum ícone, será utilizado automaticamente o ícone padrão
        para selos «*tag*».

        '
    moderatorForumHide:
      title: 'Ocultar em fóruns por os moderadores'
      md: '###### Quem é moderador?

        Os moderadores de um grupo ou distrito são normalmente os administradores
        ou embaixadores. Se houver um GOALS-AG *Moderação* num distrito, os administradores
        desse grupo assumem o papel de moderadores.

        ---

        ###### Ocultar em fóruns

        Quando esta opção está ativada, os moderadores podem ocultar todas as publicações
        no fórum, não apenas as suas próprias. Para isso, eles devem indicar o motivo
        pelo qual desejam ocultar uma publicação ou um tópico inteiro. Depois disso,
        a publicação permanece acessível aos moderadores por mais três meses e pode
        ser restaurada durante esse período. Outros utilizadores (sem direitos organizacionais)
        não terão mais acesso a ela. Após esses três meses, uma publicação ocultada
        não poderá mais ser restaurada e será definitivamente excluída do banco de
        dados.

        ---

        ###### Onde esta opção pode ser usada?

        Em grupos de denúncias locais e instâncias de arbitragem (GOALS AGs), esta
        função é necessária por motivos de proteção de dados.

        Outros grupos de trabalho podem votar internamente a favor da autorização
        dos administradores para ocultar publicações e enviar um link para a votação
        bem-sucedida para ags.bezirke@foodsharing.network. Esta opção não está prevista
        para distritos locais.

        '
    my_resources:
      title: 'Recursos próprios'
      md: 'Nesta secção, podes gerir os teus próprios recursos; criar novos recursos,
        editar, apagar ou simplesmente ver o que estás a partilhar atualmente.


        ##### O que é um recurso?

        Um recurso pode ser qualquer coisa que queiras contribuir para a comunidade
        foodsharing. Podem ser **habilidades**, como cozinhar ou programar, **objetos**
        que estarias disposto a emprestar, como uma bicicleta de carga ou uma estação
        de cozinha móvel, ou mesmo **contatos** com outras iniciativas, autoridades,
        meios de comunicação, etc.


        ##### Tudo pode, nada tem de ser

        Ninguém é obrigado a registar recursos, e só porque registaste um determinado
        recurso, isso não significa que *tenhas* de o disponibilizar para determinadas
        ações. Trata-se mais de partilhar aquilo com que *gostarias de contribuir*.


        ##### Quem vê os meus recursos?

        Os recursos ficam visíveis dentro dos teus distritos e grupos de trabalho.
        Mas isso não vale para distritos muito grandes, como estados ou províncias,
        onde não tem um mosaico de recursos disponível. Também podes limitar a visibilidade
        de cada recurso aos Foodsavers que conheces.

        '
    masterRegion:
      title: 'Distrito principal'
      md: 'Caso os distritos tenham um distrito mestre, todos os membros do distrito
        serão automaticamente incluídos no distrito mestre. Em muitos casos, faz sentido
        escolher o distrito pai como mestre, mas também são possíveis outras aplicações.
        Caso o distrito mestre não seja o distrito pai, os utilizadores do distrito
        **não** serão automaticamente incluídos no distrito pai.


        Caso não deseje que os utilizadores sejam automaticamente incluídos noutro
        distrito, defina o mestre como raiz.

        ---

        A inclusão no distrito mestre ocorre uma vez por noite. Portanto, as alterações
        não ocorrem imediatamente.

        '
    change_verified_data:
      title: 'Solicitar alteração de dados verificados'
      md: 'Para atuar como o Foodsaver, é importante que os dados no teu perfil estejam
        corretos. Antes de poder salvar alimentos, eles serão comparados com o teu
        documento de identidade pelos embaixadores. Portanto, não é possível alterar
        simplesmente o teu nome e data de nascimento.

        ---

        Caso seja necessário alterar um desses campos, pode entrar em contacto com
        um embaixador do teu distrito. Ele poderá fazer a alteração por si. Para saber
        quem é o embaixador do teu distrito, consulte o [fórum do distrito]({link})
        na barra lateral esquerda.

        '
    achievements:
      md: 'O sistema de selos pode ser utilizado para marcar características específicas
        do utilizador, como, por exemplo, a participação em determinados cursos de
        formação. Os selos podem ter uma validade ilimitada ou uma data de validade
        a partir da qual deixam de ser válidos.

        '
      title: 'Selos'
    store_chain_info:
      md: |
        Esta loja faz parte de uma [cadeia comercial](https://wiki.foodsharing.de/Betrieb#Betriebskette). Todas as cadeias comerciais têm [KAMs](https://wiki.foodsharing.de/Key_Account_Manager_(KAM)) responsáveis, que podem consultar a equipa, a carga de trabalho e o número de vagas disponíveis para recolha nesta loja.
      title: 'Filials de cadeias'

startpage:
  join_welcome: 'Que bom que queres participar no foodsharing!'
  near_you:
    text2:
      part2: 'Cabazes alimentares'
      part3: '– assim, podes oferecer os teus alimentos que sobraram e pegar alimentos
        de outras pessoas.'
      part1: 'Também há'
    text3:
      part1: 'A comunidade está organizada em distritos.'
      part2: 'Encontre distritos na tua área'
    text1:
      part2: 'mapa'
      part1: 'Na'
      part3: 'encontras'
      part5: ', são estantes ou frigoríficos onde podes recolher ou entregar alimentos
        gratuitamente.'
      part4: 'Cantinhos alimentares'
    title: 'Perto de ti'
  call_to_action:
    title: 'Participe'
    text: 'Começámos em 2012 e agora somos um movimento internacional com mais de
      500 000 utilizadores na Alemanha, Áustria, Suíça e outros países europeus.'
  how_we_work:
    title: 'assim funciona'
    text: 'Tudo isso é feito de forma voluntária e gratuita, independente e sem publicidade.
      A plataforma é o coração

      da nossa comunidade. Aqui, a gente se conecta e coordena localmente e em toda
      a Europa. O site e a aplicação beta são

      de código aberto e dependem do empenho e da paixão de muitas pessoas. Como pode
      participar na área de TI?

      '
  demands:
    title: 'Exigências'
    text: 'Para reduzir o desperdício de alimentos de forma eficaz, é preciso mais
      do que só salvar as sobras

      das lojas ou educar os consumidores. Em vez disso, é preciso que haja mudanças
      políticas:

      precisamos de metas de redução obrigatórias para o desperdício ao longo de toda
      a cadeia de valor.

      Também é preciso repensar e flexibilizar as normas comerciais atuais, além de
      fortalecer as organizações que

      resgatam alimentos ou oferecem educação sobre alimentação.

      '
    image_alt: 'Alimentos salvos, como pão, frutas e legumes, estão espalhados numa
      lona ao ar livre. No fundo, dá para ver pessoas e bicicletas.'
  member:
    text: 'Partilha a tua comida que sobra com a comunidade foodsharing ou salva comida
      de lojas.'
    title: 'Como um membro'
  welcome_text: 'Bem-vindo ao foodsharing'
  store:
    title: 'como a loja'
    text: 'Trabalhas num supermercado, restaurante, cantina, ...? Regista a tua loja
      e salvo alimentos.'
  slogan_2: 'coletivo, sustentável e valorizador'
  makeproposals: 'Dá sugestões'
  respect: 'Porque os alimentos mantêm-nos vivos, devemos tratá-los com respeito.
    Para que tudo funcione da melhor forma, ao longo dos anos definimos algumas regras
    de conduta. Partilhar alimentos com outras pessoas é algo muito humano, mas também
    de grande responsabilidade. Basicamente, vale sempre a regra: «Não partilhe com
    outros nada que você mesmo não comeria». Por favor, leia agora as regras de etiqueta
    do foodsharing!'
  join: 'Participar'
  etiquette: 'Etiqueta do foodsharing'
  donate:
    title: 'Fazer doações'
    link: 'Apoiar o foodsharing'
    text: "A gente tenta conseguir patrocínios para todas as despesas. Mas, às vezes,
      isso não dá certo ou não é suficiente,\n tipo nas despesas para financiar eventos,
      consultoria jurídica ou seguros.\nA gente agradece muito qualquer apoio.\n"
  slogan_1: 'Juntos, valorizando os alimentos'
  registernow: 'Regista-te agora'
  this_is_how_it_works: 'Como funciona'
  beresponsible: 'Seja responsável'
  telltruth: 'Todos nós que criámos o foodsharing e gerimos o site levamos o nosso
    trabalho muito a sério. Seguimos várias leis e regras. Por favor, sê sincero ao
    preencher os teus dados e em todas as outras contribuições que fizeres na plataforma,
    como cabazes alimentares e publicações no fórum.'
  more_infos: 'Saiba mais'
  slogan_3: 'O foodsharing é e vai continuar a ser de graça.'
  bedependable: 'Seja confiável'
  towns:
    text: "As cidades participantes diferem entre si, dependendo se ainda estão em
      fase de desenvolvimento ou se já\nforam distinguidas como a cidade de foodsharing.
      Este último é o caso quando, além de uma equipa local de foodsharing,\nexiste
      também uma declaração de motivação assinada pela administração municipal como
      símbolo da parceria entre \no foodsharing e as autoridades públicas.\n"
    title: 'Ciudades de foodsharing'
  dependability: 'Em muitos locais existem “cantinhos alimentares” onde a alimentos
    são partilhados. Podem encontrar-se aí ou noutros locais neutros para partilhar.
    Se quiser dar ou receber comida, por favor seja fiável e pontual, não abandonar
    ninguém.'
  call_to_action_button: 'Participar agora'
  forstores: 'Para empresas e lojas'
  honest: 'Sê sincero'
  vision:
    title: 'Visão'
    text: 'Somos um movimento ambiental e educativo que combate o uso descuidado dos
      recursos e promove um sistema alimentar sustentável. O nosso objetivo a longo
      prazo é pôr fim ao desperdício de alimentos ainda próprios para consumo. Para
      isso, atuamos a nível local: salvamos alimentos em residências particulares
      e lojas, dialogamos com decisores políticos e levamos a nossa visão à sociedade.'
  register: 'No final desta página, podes registar-te como Foodsharer.'
  private:
    title: 'em privado'
    text: 'Combate o desperdício alimentar na tua casa. Nós informamos em feiras e
      eventos.'
  proposals: 'Queremos evoluir, melhorar cada vez mais. Para isso, precisamos das
    vossas boas ideias e sugestões. Enviem-nas para [info@foodsharing.de](mailto:info@foodsharing.de)'
  together: 'Junto com foodsharing, podes ajudar a garantir que alimentos descartados
    e invendáveis tenham um uso útil, em vez de serem jogados fora. Mais informações
    sobre isso encontras [aqui](/fuer-unternehmen).'
  responsibility: 'Um terço de todos os alimentos acaba no lixo. Isso tem de acabar
    de uma vez por todas. Não queremos mais deitar nada fora! Queremos lidar com os
    alimentos de forma responsável e estamos felizes por te ter connosco.'
  notallowed: 'A partilha de medicamentos (incluindo remédios homeopáticos) não é
    permitida no foodsharing. Também não dá para trocar ou partilhar roupas, cosméticos,
    produtos químicos domésticos, brinquedos e outros produtos não alimentares através
    do foodsharing. A plataforma foodsharing reserva-se o direito de apagar essas
    ofertas.'
  join_rules: 'Participar – As nossas regras'
  followrules: 'Queremos deixar bem claro que, por motivos legais, só podemos oferecer
    e partilhar certos alimentos e outros produtos sob certas condições. Isso vale
    especialmente para alimentos que estragam fácil, como peixe cru, carne crua, pratos
    com ovos crus e alimentos preparados. Em geral, prestamos muita atenção para garantir
    que os alimentos ainda estejam bons para comer. Todos os detalhes podem ser encontrados
    nas [regras de higiene do foodsharing](https://wiki.foodsharing.de/Hygieneregeln).
    Também há informações no [guia](https://wiki.foodsharing.de/Hygiene-Ratgeber_für_Lebensmittel).

    '
  followrules_title: 'Respeite as regras e o guia para a partilha de alimentos'

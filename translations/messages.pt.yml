      **Mantenha os links do calendário em segredo.** Eles contêm um *token* que permite aceder aos dados dos tues assentos sem necessidade de palavra-passe. Pode apagar o teu token atual a qualquer momento, tornando inválidos os links do calendário criados anteriormente.


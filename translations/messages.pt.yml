  two_fa_enable:
    title: Ativar autenticação de dois fatores
    tutorial: A utilização da autenticação de dois fatores aumenta a segurança 
      da tua conta de usuário. Com a autenticação de dois fatores ativada, terás
      de introduzir um código adicional à tua palavra-passe sempre que iniciares
      um sessão. Podes obter esse código através de uma aplicação de 
      autenticação. Além disso, ser-te-ão apresentados os chamados «códigos de 
      backup», que deves guardar em local seguro para, em caso de emergência 
      (por exemplo, perda do smartphone), continuares a ter acesso à tua conta 
      de usuario.
    explanation: A autenticação de dois fatores é opcional, mas é recomendada 
      pelos principais especialistas em segurança sempre que possível.
    further_info: 'Mais informações sobre a autenticação de dois fatores podem encontrar-te,
      por exemplo, aqui: https://invoicexpress.com/blog/2fa-autenticacao-dois-fatores/
      .'

    generate_url:
      button: Gerar URL de calendário
    download: Descarregar calendário
    info: |
      Aqui podes associar os teus compromissos de foodsharing a um programa de calendário à tua escolha. Assim, todas as tuas recolhas e/ou compromissos podem ser automaticamente inseridos no teu calendário.

      **Mantenha os links do calendário em segredo.** Eles contêm um *token* que permite aceder aos dados das suas recolhas sem necessidade de palavra-passe. Pode eliminar o seu token atual a qualquer momento, tornando inválidos os links do calendário criados anteriormente.

      O teu programa de calendário deve **sincronizar** este calendário regularmente. Só assim os novos compromissos de recolha aparecerão e os compromissos cancelados deixarão de aparecer. Se, em vez disso, descarregares o teu calendário atual, este conterá apenas os teus compromissos atuais e não será atualizado automaticamente.


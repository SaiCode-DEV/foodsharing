    infos:
      unlimited_tries: Podes repetir este teste quantas vezes quiseres e nunca 
        serás desclassificado se falhares. No entanto, poderás ter de fazer uma 
        pausa para estudar entre tentativas.
      alone: O teste deve ser feito pelo próprio e sem ajuda externa. Se tiver 
        dificuldades linguísticas ou precisar de um assistente, outra pessoa 
        pode ajudá-lo a compreender as perguntas; no entanto, deverá ser capaz 
        de responder sozinho. Por isso, procure um local sossegado onde possa 
        fazer o teste sem ser incomodado.
      multiple_choice: Podem ser dadas várias respostas corretas por pergunta - 
        ou nenhuma. Por conseguinte, decida, para cada resposta, se está correta
        ou incorrecta.
      timed: O tempo para responder às perguntas é limitado. Não se preocupe com
        isso. O tempo é definido individualmente para cada pergunta, para que 
        tenha tempo suficiente para responder à pergunta em paz. Se o tempo se 
        esgotar, avise os administradores do quiz através de um comentário.
      real_life_examples: A maioria das perguntas é baseada em casos reais da 
        vida em Foodsharing.
      limited_tries: Não podes repetir o teste as vezes que quiser. Após três 
        tentativas, tens de fazer uma pausa de 30 dias para estudar, após o que 
        só tem mais duas tentativas. As perguntas que lhe são colocadas em cada 
        tentativa são diferentes.
      comment: Depois de responder a cada pergunta, verá uma avaliação 
        intermédia com explicações para cada uma das respostas possíveis. Isto 
        ajuda-o a compreender qual é a resposta correta ou incorrecta e porquê. 
        Se cometeres um erro, deves ler as explicações com atenção. Se algo lhe 
        parecer ilógico, incompreensível ou mesmo errado, deixe um comentário. 
        Os seus comentários podem ser atribuídos a si para lhe dar um feedback 
        personalizado.
      pause: Podes fazer uma pausa no teste a qualquer momento e continuar mais 
        tarde.
      feedback: No final do teste, receberá uma avaliação direta sobre se passou
        e quais os erros que cometeu. Aqui podes voltar a ler os motivos à 
        vontade.
      wiki: Por favor não inicies o teste à sorte Lê as páginas de informação 
        listadas com atenção antes de começares. Sem os conhecimentos da wiki, 
        não conseguirás passar no teste.
      read_carefully: Ler atentamente todas as perguntas e respostas.
    acceptPrivacyNotice: Concordo com isso.
    privacyNotice:
      hygiene: Se passar neste teste, ficará registado que o fez e ser-lhe-á 
        atribuído um selo de higiene. Os responsáveis pela higiene e os 
        responsáveis por cooperações podem verificar se tens um selo de higiene 

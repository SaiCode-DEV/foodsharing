help:
  key:
    publicEvent:
      md: "Os eventos podem ser registados como públicos pelos administradores de
        um grupo de trabalho ou pelos administradores do GOALS-AG Relações Públicas
        ou pelos embaixadores. Os eventos públicos são acessíveis a todos. Não é necessário
        estar registado na plataforma para ver o local do evento e as informações.
        No entanto, o mural e a lista de participantes só estão acessíveis aos utilizadores
        registados.\nRegiste um evento como público se quiser convidar pessoas de
        fora da sua comunidade local de foodsharing e se todos puderem participar.\n"
      title: ''
    reportReasons:
      title: Formulário de denúncias
      md: "Através do formulário de denúncias, os salvadores alimentares podem denunciar
        diretamente as violações das regras. Ao ativá-lo, as pessoas responsáveis
        pelas denúncias recebem notificações rápidas e fáceis sobre as notificações
        enviadas dessa forma.\n---\nO grupo de denúncias local do distrito pode definir
        quais motivos de notificação são exibidos no formulário de notificação.\n\
        É possível escolher entre motivos de denúncia simplificados e detalhados.
        Os motivos de denúncia detalhados incluem todas as regras listadas [aqui no
        Wiki em B](https://wiki.foodsharing.de/Verhaltensregeln#B.29_Verhalten_bei_Abholungen)
        (Infelizmente, até agora só em alemão)\nAlém disso, é possível selecionar
        se a opção «Outros» deve ser listada como outro motivo de notificação.\n---\n\
        Recomendações sobre a configuração podem ser enviadas ao grupo de denúncias
        local. No entanto, a decisão e a responsabilidade sobre essa configuração
        são exclusivamente dos administradores do grupo de notificação local, que
        não são obrigados a seguir essas recomendações.\n"
    report:
      title: Processamento de denúncias
      md: "pessoas com este distrito de origem. No entanto, nem todas as mensagens
        são exibidas:\n- Basicamente, não são exibidas mensagens nas quais você ou
        os seus coadministradores da grupo de denúncias local ou comissão de arbitragem
        estejam envolvidos.\n- Como administrador do comissão de arbitragem, só tem
        acesso às mensagens nas quais os administradores do grupo de denúncias local
        estão envolvidos.\n---\nPode ler aqui as instruções para editar uma mensagem:
        [Editar uma mensagem](https://wiki.foodsharing.de/Regelverletzungen_-_Konsequenzen_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)\n\
        (Infelizmente, até agora só em alemão)\n"
    achievementDuplicateMode:
      md: |
        Os stickers podem servir como marcação em situações muito diferentes. Por isso, é possível definir se o sticker pode ser atribuído várias vezes ao mesmo tempo à mesma pessoa.

        - **Sobrescrever:** Não é possível receber o autocolante várias vezes ao mesmo tempo. Se o autocolante for atribuído novamente, a atribuição atual substitui ou prolonga a anterior. Isto é utilizado, por exemplo, para a formação em higiene. Quem renova a formação, o seu autocolante é simplesmente prolongado. Selecione *Sobrescrever* se o autocolante tiver de marcar um estado atual e inequívoco.
        - **Atribuir várias vezes:** É possível atribuir várias vezes ao mesmo tempo. Os autocolantes atribuídos várias vezes são apresentados agrupados no perfil, mas todas as informações correspondentes estão acessíveis. Isto pode ser utilizado, por exemplo, para documentar recolhas de amostras, das quais são necessárias várias. Selecione *Atribuir várias vezes* se cada atribuição individual for importante e tiver de permanecer rastreável.
      title: ''
    hygieneRequirement:
      md: |
        Para trabalhar em algumas empresas, os salvadores alimentares devem ter formação em higiene alimentar. Quando esta função está ativada para uma empresa, tem as seguintes implicações:
        1. Os salvadores alimentar sem formação válida em higiene não podem candidatar-se à equipa da empresa.
        2. Os salvadores alimentar que já fazem parte da equipa só podem inscrever-se em assentos cuja formação em higiene ainda seja válida.

        Em ambos os casos, é exibida uma nota explicando que falta a formação em higiene para esta ação. Além disso, a formação em higiene está diretamente ligada em cada caso.

        ---

        Importante: esta função baseia-se apenas nos autocolantes de higiene próprios da foodsharing. Nem os certificados de higiene de fornecedores externos (como, por exemplo, Metro) carregados no perfil, nem os cursos de higiene adquiridos noutro local são tecnicamente considerados.
      title: ''
    achievementVisibility:
      md: |
        A visibilidade de um autocolante determina quem pode ver se o autocolante foi atribuído a alguém. Estão disponíveis as seguintes opções:

        - **Oculto:** o autocolante só é visível para utilizadores com direitos de organização.
        oculto: «Não é exibido a ninguém»
        - **Privado:** Apenas a própria pessoa em questão, bem como os administradores e embaixadores da área de validade especificada, podem ver o autocolante.
        - **Apenas lideres de equipas:** O autocolante é exibido à própria pessoa, bem como a todos os lideres de equipas na área selecionada.
        - **Na área de validade:** O autocolante é visível para todos os utilizadores que são membros do distrito especificado.
        - **Global:** O autocolante é visível para todos os utilizadores registados.

        Considere sempre até que ponto a visibilidade pode ser restringida para não tornar desnecessariamente visíveis informações pessoais. O nível de visibilidade pode ser ajustado posteriormente.
      title: ''
    commons_resources:
      title: ''
      md: ''
    basket:
      title: ''
      md: ''
    storeLog:
      md: ''
      title: ''
    pickupOptions:
      title: ''
      md: 'A secção *Possibilidades de inscrição* mostra-lhe uma visão geral de todos
        os turnos assentos nas tuas empresas, para os quais ainda se procuram salvadores
        alimentares. Através do menu de opções, pode ajustar a visualização às suas
        necessidades:


        **Assentos inscritos:** Para que possa planear melhor os teus turnos, também
        pode visualizar os turnos nos quais já se inscreveu. Esses turnos são apresentados
        em tons mais claros para que os possas identificar rapidamente.


        **Visualização para líderes de equipas:** Os lideres de equipas garantem que
        todos os assentos nas tuas empresas decorram de forma fiável. Se fores um
        lider, podes restringir a visualização às empresas pelas quais és responsável.
        Assim, é mais fácil manter uma visão geral.

        **Agrupado por dias:** Nesta apresentação, as suas opções de inscrição são
        agrupadas por dias e apresentadas de forma um pouco mais compacta. Especialmente
        quando tem muitas opções de inscrição disponíveis por dia, isso facilita a
        obtenção de uma visão geral.

        '
    resource_mosaic:
      title: ''
      md: "A ideia\nAo salvar alimentos, todos nós partilhamos de forma muito eficaz
        o nosso tempo, capacidade de transporte e experiência. Mas, para dar novos
        impulsos a um sistema alimentar sustentável e fortalecer o movimento de partilha
        de alimentos a longo prazo, é preciso mais do que apenas salvar. Cada um de
        nós traz recursos diferentes, ou seja, *habilidades*, *objetos* ou *contatos*
        que, por si só, muitas vezes ficam ocultos e sem uso. Juntos, porém, esses
        recursos podem se tornar visíveis e utilizáveis – como peças individuais de
        um mosaico que, juntas, formam uma grande imagem. O mosaico de recursos pode
        tornar essa diversidade visível. Assim, cria espaço para novas ideias de projetos,
        colaboração e apoio mútuo além da recuperação. \n\n##### A visão geral dos
        recursos\nO coração do mosaico de recursos é a visão geral de todos os recursos
        do distrito ou do grupo de trabalho. Pode simplesmente inspirar-se na diversidade
        do seu grupo ou procurar recursos específicos. Podes clicar em qualquer recurso
        para obter mais informações sobre ele. Também podes guardar recursos como
        favoritos para encontrá-los mais facilmente mais tarde. \nA cor de um recurso
        mostra o quanto a pessoa gosta de o partilhar: os recursos oferecidos com
        muito prazer aparecem em cores fortes e brilhantes, enquanto os recursos menos
        partilhados são apresentados em tons cinzentos.\n \n\n##### Pesquisar, filtrar
        e ordenar\nPara encontrar rapidamente os recursos adequados, tem várias opções
        de filtragem à sua disposição.\n- Pode filtrar por **categorias** específicas
        ou pesquisar diretamente por determinados **termos**.\n- **Apenas utilizadores
        ativos** oculta os recursos de utilizadores que não iniciaram sessão nos últimos
        30 dias ou que estão atualmente dorminhocos.\n- No mosaico de recursos, são
        exibidos os recursos de todos os salvadores alimentares do grupo. Nos distritos,
        também podes restringir a visualização aos utilizadores cujo **distrito principal**
        é o distrito em questão.\n- Se tiver marcado recursos como **favoritos**,
        pode visualizar apenas esses recursos.\n\nAlém disso, pode **ordenar** os
        resultados, por exemplo, por «alegria com as solicitações», atualidade das
        entradas ou simplesmente aleatoriamente.\n"
    threadPriority:

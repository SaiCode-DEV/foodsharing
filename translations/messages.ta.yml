  startmodal:
    title: நொடி வினா பற்றிய குறிப்புகள்
    infos:
      read_carefully: எல்லா கேள்விகளையும் பதில்களையும் கவனமாகப் படியுங்கள்.
      wiki: தயவுசெய்து நல்ல அதிர்ச்டத்தில் நொடி வினா தொடங்க வேண்டாம். 
        பட்டியலிடப்பட்ட செய்தி பக்கங்களை முன்கூட்டியே கவனமாகப் படியுங்கள். 
        விக்கியைப் பற்றிய அறிவு இல்லாமல் நீங்கள் இருக்க மாட்டீர்கள்.
      real_life_examples: பெரும்பாலான கேள்விகள் உணவு பகிர்வு வாழ்க்கையிலிருந்து 
        உண்மையான நிகழ்வுகளை அடிப்படையாகக் கொண்டவை.
      limited_tries: நீங்கள் விரும்பும் போது நொடி வினாவை மீண்டும் செய்ய 
        முடியாது. மூன்று முயற்சிகளுக்குப் பிறகு நீங்கள் 30 நாள் கற்றல் இடைவெளியை
        எடுக்க வேண்டும், அதன் பிறகு உங்களுக்கு இன்னும் இரண்டு முயற்சிகள் மட்டுமே
        உள்ளன. ஒவ்வொரு முயற்சியிலும் கேட்கப்படும் கேள்விகள் வேறுபடுகின்றன.
      unlimited_tries: நீங்கள் விரும்பும் போதெல்லாம் இந்த நொடி வினாவை மீண்டும் 
        செய்ய முடியும், தோல்வியுற்றதன் மூலம் நீங்கள் ஒருபோதும் தகுதி நீக்கம் 
        செய்யப்பட மாட்டீர்கள். இருப்பினும், நீங்கள் சோதனைகளுக்கு இடையில் ஒரு 
        கற்றல் இடைவெளி எடுக்க வேண்டும்.
      alone: நொடி வினா உங்களிடமிருந்தும் வெளிநாட்டு உதவி இல்லாமல் இருக்க 
        வேண்டும். மொழியியல் சிரமங்கள் ஏற்பட்டால் அல்லது நீங்கள் உதவியை 
        நம்பினால், மற்றொரு நபர் கேள்விகளைப் புரிந்துகொள்ள உங்களுக்கு உதவ 
        முடியும்; இருப்பினும், நீங்கள் அவர்களுக்கு தனியாக பதிலளிக்க முடியும். 
        எனவே, நீங்கள் நொடி வினாவை தடையின்றி செய்யக்கூடிய அமைதியான இடத்தைக் 
        கண்டறியவும்.
      multiple_choice: ஒரு கேள்விக்கு பல பதில்கள் சரியாக இருக்கலாம் - அல்லது 
        எதுவுமில்லை. எனவே ஒவ்வொரு பதிலையும் அது சரியானதா அல்லது தவறா என்பதை 
        தனித்தனியாக முடிவு செய்யுங்கள்.
      timed: கேள்விகளுக்கு பதிலளிக்கும் நேரம் குறைவாகவே உள்ளது. அதிலிருந்து 
        வலியுறுத்த வேண்டாம். ஒவ்வொரு கேள்விக்கும் நேரம் தனித்தனியாக 
        அமைக்கப்பட்டுள்ளது, இது கேள்விக்கு நிம்மதியாக பதிலளிக்க உங்களுக்கு 
        போதுமான நேரம் உள்ளது. நீங்கள் சரியான நேரத்தில் வந்தால், நொடி வினா 
        நிர்வாகிகள் ஒரு கருத்துடன் அதைத் தெரியப்படுத்துங்கள்.
      comment: ஒவ்வொரு கேள்விக்கும் பதிலளித்த பிறகு, ஒவ்வொரு பதில் 
        விருப்பங்களுக்கும் விளக்கங்களுடன் ஒரு இடைநிலை மதிப்பீட்டைக் காண்பீர்கள்.
        எந்த பதில் சரியானது அல்லது தவறு என்பதைப் புரிந்துகொள்ள இது உதவுகிறது. 
        ஒவ்வொரு தவறிலும் நீங்கள் விளக்கங்களை கவனமாக படிக்க வேண்டும். ஏதேனும் 
        உங்களுக்கு நியாயமற்றதாகத் தோன்றினால், புரிந்துகொள்ளக்கூடியதாகவோ அல்லது 
        தவறாகவோ கூட இல்லை என்றால், தயவுசெய்து ஒரு கருத்தை இடுங்கள். உங்களுக்கு 
        தனிப்பட்ட கருத்துக்களை வழங்க உங்கள் கருத்துகள் உங்களுக்கு 
        ஒதுக்கப்படலாம்.
      pause: எந்தவொரு கேள்விக்கும் பிறகு நீங்கள் நொடி வினாவை இடைநிறுத்தலாம் 
        மற்றும் பிற்காலத்தில் தொடரலாம்.
      feedback: குவிசாவின் முடிவில், நீங்கள் கடந்துவிட்டீர்களா, என்ன தவறுகளைச் 

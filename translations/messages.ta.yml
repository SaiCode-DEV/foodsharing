      part2: உணவு கூடை
      part3: '- இதன் மூலம் நீங்கள் உங்கள் சொந்த அதிகப்படியான உணவை வழங்கலாம் மற்றும்
        மற்றவர்களிடமிருந்து உணவை எடுக்கலாம்.'
  towns:
    title: உணவு பகிர்வு நகரங்கள்
    text: "பங்கேற்கும் நகரங்கள் அவை இன்னும் வழியில் அல்லது ஏற்கனவே உள்ளன என்பதில்
      வேறுபடுகின்றன\n உணவு பகிர்வு நகரமாக. தளத்தில் உணவு பகிர்வு குழு இருந்தால் பிந்தையது
      வழக்கு\n இடையிலான கூட்டாண்மையின் அடையாளமாக நகர நிர்வாகத்தால் கையெழுத்திட்ட உந்துதலின்
      அறிவிப்பு\n உணவு பகிர்வு மற்றும் பொதுத்துறை.\n"
  donate:
    title: நன்கொடை
    text: "ச்பான்சர்சிப்பிற்கான எந்தவொரு செலவுகளுக்கும் நாங்கள் பாடுபடுகிறோம். இருப்பினும்,
      சில சந்தர்ப்பங்களில், இது வேலை செய்யாது அல்லது இல்லை\n நிகழ்வுகள், சட்ட அறிவுரை
      அல்லது காப்பீட்டுக்கு நிதியளிப்பதற்கான செலவுகள் விசயத்தில் முழுமையானது.\n எந்தவொரு
      ஆதரவையும் எதிர்பார்க்கிறோம்.\n"
    link: உணவு பகிர்வை ஆதரிக்கவும்
  welcome_text: ஃபுட்சேரிங்கிற்கு வருக
  slogan_1: அதிக உணவு மதிப்பு மதிப்பீட்டிற்கு ஒன்றாக
  slogan_3: உணவு பகிர்வு மற்றும் இலவசமாக உள்ளது.
  join_rules: பங்கேற்க - எங்கள் விதிகள்
  join_welcome: உணவு பகிர்வில் நீங்கள் பங்கேற்க விரும்புவது நல்லது!
  respect: 'உணவு நம்மை உயிரோடு வைத்திருப்பதால், நாங்கள் அவர்களை மரியாதையுடன் சமாளிக்க
    விரும்புகிறோம். எனவே எல்லாம் எங்களுடன் உகந்ததாக இயங்குகிறது, பல ஆண்டுகளாக சில
    நடத்தை விதிகளை நாங்கள் வரையறுத்துள்ளோம். மற்றவர்களுக்கு உணவை அனுப்புவது மிகவும்
    மனித, ஆனால் பொறுப்பான சேதி. அடிப்படையில், பின்வருபவை எப்போதுமே பொருந்தும்: "நீங்கள்
    இனி நீங்களே சாப்பிட மாட்டீர்கள் என்று மற்றவர்களுக்கு எதுவும் அனுப்பப்படவில்லை".
    உணவு பகிர்வு லேபிளை ஒரு முறை படிக்கவும்!'
  register: 'இந்த பக்கத்தின் முடிவில் நீங்கள் ஒரு ஃபுட்சேராக இருக்கலாம்: பதிவேட்டில்.'
  forstores: நிறுவனங்கள் மற்றும் நிறுவனங்களுக்கு
  together: உணவு பகிர்வுடன் சேர்ந்து, வரிசைப்படுத்தப்பட்ட மற்றும் மறுக்கமுடியாத 
    உணவைப் பயன்படுத்தி தூக்கி எறியப்படுவதற்குப் பதிலாக விவேகமான பயன்பாட்டை 
    அனுபவிக்கலாம். இந்த [இங்கே] (/FUER நிறுவனம்) பற்றிய கூடுதல் தகவல்களை நீங்கள்
    காணலாம்.
  honest: நேர்மையாக இருங்கள்
  followrules_title: உணவு மாற்றுவதற்கான விதிகள் மற்றும் வழிகாட்டியைக் 
    கவனியுங்கள்
  followrules: "சட்ட காரணங்களுக்காக சில உணவுகளையும் பிற பொருட்களையும் வழங்கவும் பகிர்ந்து
    கொள்ளவும் மட்டுமே இதை அனுமதிக்கிறோம் என்பதை நாங்கள் வெளிப்படையாக சுட்டிக்காட்டுகிறோம்.
    மூல மீன், மூல இறைச்சி, மூல முட்டை உணவுகள் மற்றும் தயாரிக்கப்பட்ட உணவுகள் போன்ற
    அழிந்துபோகக்கூடிய உணவுகளுக்கு இது குறிப்பாக பொருந்தும். பொதுவாக, உணவு இன்னும்
    உண்ணக்கூடியது என்ற அனைத்து உணர்வுகளையும் நாங்கள் உறுதி செய்கிறோம். அனைத்து விவரங்களையும்
    [ஃபுட்சேரிங் சுகாதார விதிகள்] (https://wiki.foodsharing.de/hygieregeln) இல் காணலாம்.
    தகவல்களை [ஆலோசகர்] (https://wiki.foodsharing.de/hygiene-ratgeber_für_zeitsmittel)
    இல் காணலாம்.\n"
  telltruth: உணவு பகிர்வை உருவாக்கிய மற்றும் வலைத்தளத்தை இயக்கும் நாம் அனைவரும் 
    எங்கள் பணியை மிகவும் தீவிரமாக எடுத்துக்கொள்கிறோம். நாங்கள் பல சட்டங்களையும் 
    தேவைகளையும் பின்பற்றுகிறோம். உங்கள் தரவை நிரப்பும்போது தயவுசெய்து நேர்மையாக 
    இருங்கள் மற்றும் நீங்கள் மேடையில் செய்யும் மற்ற அனைத்து கட்டுரைகளுக்கும், 
    எ.கா. பி. உணவு கூடைகள் மற்றும் மன்ற பங்களிப்புகளுக்கு.
  bedependable: நம்பகமானதாக இருங்கள்
  notallowed: மருந்துகளின் பரிமாற்றம் (ஓமியோபதி வழிமுறைகள் உட்பட) உணவு 
    பகிர்விலிருந்து விலக்கப்பட்டுள்ளது. ஆடை, அழகுசாதனப் பொருட்கள், வீட்டு 
    வேதியியல், பொம்மைகள் மற்றும் பிற உணவு அல்லாத பொருட்களை உணவு பகிர்வு மூலம் 
    பரிமாறிக்கொள்ளவோ பகிரவோ முடியாது. அத்தகைய சலுகைகளை நீக்குவதற்கான உரிமையை 
    ஃபுட்சேரிங் தளம் கொண்டுள்ளது.
  responsibility: அனைத்து உணவுகளிலும் மூன்றில் ஒரு பங்கு குப்பையில் இறங்குகிறது.
    அது இறுதியாக முடிந்துவிட வேண்டும். இனி எதையும் தூக்கி எறிய நாங்கள் 
    விரும்பவில்லை! நாங்கள் உணவுடன் பொறுப்புடன் சமாளிக்க விரும்புகிறோம், மேலும் 
    பங்கேற்க எதிர்பார்க்கிறோம்.
  dependability: பல இடங்களில் உணவுகள் பகிரப்படும் நியாயமான வகுப்பாளர்கள் 
    உள்ளனர். பகிர்ந்து கொள்ள நீங்கள் அங்கு அல்லது பிற நடுநிலை இடங்களில் 
    சந்திக்கலாம். நீங்கள் உணவைக் கைவிடவோ அல்லது பாதுகாக்கவோ விரும்பினால், 
    தயவுசெய்து நம்பகத்தன்மையுடன் இருங்கள், சரியான நேரத்தில், யாரையும் "மழையில்" 
    விட்டுவிடாதீர்கள்.
  makeproposals: பரிந்துரைகளை உருவாக்குங்கள்
  proposals: 'நாங்கள் மேலும் வளர்த்துக் கொள்ள விரும்புகிறோம். உங்களுக்கு நிறைய நல்ல
    சிந்தனைகள் மற்றும் உதவிக்குறிப்புகள் தேவை. நீங்கள் அவற்றை [info@foodsharing.de]
    க்கு அனுப்புகிறீர்கள் (mailto: info@foodsharing.de)'
  registernow: இப்போது பதிவு செய்யுங்கள்
  more_infos: மேலும் பட்டறிவு
  vision:
    title: பார்வை
    text: 'வளங்களை கவனக்குறைவாக கையாளுவதற்கும், ஒரு நிலையான ஊட்டச்சத்து முறைக்கு எதிராகவும்
      பிரச்சாரம் செய்யும் சுற்றுச்சூழல் மற்றும் கல்வி கொள்கை இயக்கமாக நாங்கள் பார்க்கிறோம்.
      உண்ணக்கூடிய உணவின் கழிவுகளை முடிவுக்குக் கொண்டுவருவதே எங்கள் நீண்ட கால குறிக்கோள்.
      அதனால்தான் நாங்கள் தளத்தில் செயலில் இருக்கிறோம்: நாங்கள் தனியார் வீடுகளிலும்
      நிறுவனங்களிலும் உணவைச் சேமிக்கிறோம், அரசியலுடன் உரையாடுகிறோம், எங்கள் பார்வையை
      உலகிற்கு கொண்டு செல்கிறோம்.'
  call_to_action:
    title: உடன் எடுத்துக் கொள்ளுங்கள்
    text: 'நாங்கள் 2012 இல் உருவாக்கப்பட்டோம், இப்போது நாங்கள் 500,000 க்கும் மேற்பட்ட
      பயனர்களைக் கொண்ட ஒரு பன்னாட்டு இயக்கம்: செர்மனி, ஆச்திரியா, சுவிட்சர்லாந்து
      மற்றும் பிற ஐரோப்பிய நாடுகளில்.'
  member:
    title: உறுப்பினராக
    text: உங்கள் அதிகப்படியான உணவை உணவு பகிர்வு சமூகத்துடன் பகிர்ந்து 
      கொள்ளுங்கள் அல்லது நிறுவனங்களின் உணவை சேமிக்கவும்.
  private:
    title: தனிப்பட்ட முறையில்
    text: உங்கள் வீட்டில் உணவை வீணாக்க போராடுவதை எடுத்துக் கொள்ளுங்கள். வர்த்தக 
      கண்காட்சிகளிலும், போன்ற நிகழ்வுகளிலும் நாங்கள் தெரிவிக்கிறோம்.
  how_we_work:
    title: அது எப்படி செயல்படுகிறது
    text: "இவை அனைத்தும் தன்னார்வ அடிப்படையில் மற்றும் இலவசமாக, சுயாதீனமான மற்றும்
      விளம்பர -இலவசம். தளம் இதயத்தை உருவாக்குகிறது\n எங்கள் சமூகம். நாங்கள் இங்கு
      உள்நாட்டிலும் ஐரோப்பாவிலும் பிணையம் மற்றும் ஒருங்கிணைக்கிறோம். வலைத்தளம் மற்றும்
      பீட்டா பயன்பாடு\n திறந்த மூல மற்றும் பல மீதான அர்ப்பணிப்பு மற்றும் ஆர்வத்தை
      அடிப்படையாகக் கொண்டது. அதில் நீங்கள் எவ்வாறு பங்கேற்க முடியும்?\n"
  demands:
    title: கோரிக்கைகள்
    text: "உணவு கழிவுகளை திறம்பட கொண்டிருப்பதற்காக, மீதமுள்ள மீட்பை விட அதிகமாக தேவைப்படுகிறது\n\
      \ நிறுவனங்களிலிருந்து உணவு அல்லது நுகர்வோரின் தெளிவுபடுத்தல்: உள்ளே. அதற்கு
      பதிலாக, ஏதாவது அரசியல் ரீதியாக நகர வேண்டும்:\n முழு மதிப்பு சங்கிலியுடன் கழிவுகளுக்கான
      பிணைப்பு குறைப்பு இலக்குகள் நமக்குத் தேவை.\n கூடுதலாக, தற்போதுள்ள வர்த்தக தரநிலைகள்
      மறைக்கப்பட வேண்டும் மற்றும் நிதானமாக இருக்க வேண்டும், அத்துடன் நிறுவனங்கள்\n\
      \ ஊட்டச்சத்து என்ற தலைப்பைச் சுற்றி உணவு அல்லது கல்வியை அகற்றுவது பலப்படுத்தப்படுகிறது.\n"

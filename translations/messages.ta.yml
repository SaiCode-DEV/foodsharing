      மின்னஞ்சல் முகவரியில் உள்ளக மத்தியச்த பணிக்குழுவை நீங்கள் அடையலாம்:'
    no_group: துரதிர்ச்டவசமாக, உணவு சேமிப்பாளரின் STEM மாவட்டத்திற்கு இன்னும் 
      உள்ளக மத்தியச்த குழு இல்லை. ஒரு குழு கூட்டத்தில் அல்லது மன்றத்தில் நீங்கள்
      தலைப்பை உரையாற்றலாம், இதனால் உள்ளக மத்தியச்த குழு தேர்வு செய்யப்படுகிறது.
  cantdeleteall: எல்லா சந்திப்புகளையும் நீங்கள் நீக்க முடியாது!

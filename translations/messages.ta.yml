content:
  empty: இதுவரை எந்த பக்கமும் உள்ளிடப்படவில்லை.
  communities:
    text: உணவு பகிர்வு ஒவ்வொரு நாளும் வளர்கிறது. அனைத்து உணவு பகிர்வு சமூகங்கள் 
      மற்றும் மாவட்டங்களின் தற்போதைய பட்டியலை இங்கே நீங்கள் எப்போதும் காணலாம். 
      ஒவ்வொரு மாவட்டத்திற்கும் இணைக்கப்பட்ட பொது மாவட்டப் பக்கத்தைப் பற்றிய 
      கூடுதல் தகவல்களை நீங்கள் பெறலாம் அல்லது ஐகானைக் சொடுக்கு செய்வதன் மூலம் 
      இங்கிருந்து நேரடியாக ஒரு மின்னஞ்சலை இங்கிருந்து தொடர்புடைய மாவட்டத்திற்கு 
      அனுப்பலாம்.
    searchInfo: Ctrl+F உடன், இந்த பட்டியலை நாடுகள், நகரங்கள், கூட்டாட்சி 
      மாநிலங்கள் அல்லது மாவட்டங்களுக்கு பல உலாவிகளில் தேடலாம்.
    title: உள்ளக குழுக்கள்

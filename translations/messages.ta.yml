help:
  helpTitle: 'உதவி: {title}'
  tooltip: உதவியைக் காட்டு
  key:
    storeLog:
      title: இயக்க நெறிமுறை
      md: "இயக்க நெறிமுறை ஒரு நிறுவனத்தில் ** செயல்பாடுகளைப் புரிந்துகொள்வதற்கான ஒரு
        வழியாகும் **. இது மோதல்களைத் தீர்க்க அல்லது தற்செயலான தவறுகளை சரிசெய்ய உதவும்.\n\
        \ ---\n ###### எடுத்துக்காட்டு\n கடந்த 3 வாரங்களில் யாரால் யார் சேர்க்கப்பட்டிருக்கிறார்கள்
        என்பதை நீங்கள் அறிய விரும்புகிறீர்கள் என்று வைத்துக்கொள்வோம். தொடக்க மற்றும்
        இறுதி தேதியைப் பயன்படுத்தி இரண்டு தேதி புலங்கள் வழியாக காலத்தை அமைக்கலாம்.
        அடுத்து நீங்கள் கீழ்தோன்றலில் இருந்து தொடர்புடைய அனைத்து செயல் வகைகளையும்
        தேர்ந்தெடுக்கலாம். இந்த வழக்கில், எடுத்துக்காட்டாக, \"*அணுகல் விசாரணைகளை அமைக்கவும்*\"\
        , \"*அணுகல் விசாரணைகளை ஏற்றுக்கொள்ளுங்கள்*\" மற்றும் \"*பாகங்கள் நிராகரிக்கவும்*\"\
        . \"*தேர்ந்தெடுக்கப்பட்ட செயல்களைக் காட்டு*\" என்ற பொத்தானைக் சொடுக்கு செய்தால்,
        தேர்ந்தெடுக்கப்பட்ட நிகழ்வுகளின் வரலாற்றைக் காண்பீர்கள்.\n ---\n ####### அணுகல்\n\
        \ நிறுவனத்தை நிர்வகிக்கக்கூடியவர்களுக்கு மட்டுமே இதை அணுகலாம். சாதாரண உணவு
        மற்றும் சம்பருக்கு: இயக்க நெறிமுறை உள்ளே தெரியவில்லை.\n ---\n ###### கட்டுப்பாடுகள்\n\
        \ அதிகபட்சம் 100 உள்ளீடுகள் ஏற்றப்படுகின்றன. தேவைப்பட்டால், எல்லா முடிவுகளும்
        காட்டப்படாவிட்டால் தேடல் காலம் அல்லது தேர்ந்தெடுக்கப்பட்ட செயல் வகைகளை நீங்கள்
        கட்டுப்படுத்த வேண்டும்.\n"
    threadPriority:
      title: மன்றங்களில் முன்னுரிமையைக் காண்பி
      md: "தலைப்புகள் அவற்றின் காட்சி முன்னுரிமைக்கு ஏற்ப பட்டியலிடப்பட்டுள்ளன. அதே
        முன்னுரிமை கொண்ட தலைப்புகள் கடைசி செயல்பாட்டின் நேரத்தால் வரிசைப்படுத்தப்படுகின்றன.\n\
        \ ---\n கருத்தியல் நூல்கள் 1, சாதாரண நூல்களின் முன்னுரிமை 0 இன் முன்னுரிமையைக்
        கொண்டுள்ளன. காட்டப்படும் நூல்களை இன்னும் துல்லியமாக வரிசைப்படுத்த, நீங்கள்
        இங்கே அதிக மதிப்புகளை வரையறுக்கலாம், இதனால் மாற்ற தேதியைப் பொருட்படுத்தாமல்
        தலைப்புகள் எப்போதும் மேலே இருக்கும்.\n முன்னுரிமை -1 கொண்ட நூல்கள் மற்ற எல்லா
        நூல்களின் கீழும் காட்டப்படும்.\n"
    masterRegion:
      title: மாச்டர்பெசர்க்
      md: "மாவட்டங்களில் ஒரு முதன்மை மாவட்டம் இருந்தால், மாவட்டத்தின் அனைத்து உறுப்பினர்களும்
        தானாகவே மாச்டர் மாவட்டத்தில் சேர்க்கப்படுகிறார்கள். பல சந்தர்ப்பங்களில், பெற்றோர்
        மாவட்டத்தை ஒரு மாச்டராகத் தேர்ந்தெடுப்பது அர்த்தமுள்ளதாக இருக்கிறது, ஆனால்
        பிற பயன்பாடுகளும் சாத்தியமாகும். மாச்டர் மாவட்டம் பெற்றோர் மாவட்டமாக இல்லாவிட்டால்,
        பயனர்கள் மாவட்டத்தில் பயன்படுத்தப்படுவார்கள் ** அல்ல* ** தானாகவே பெற்றோர்
        மாவட்டத்தில்.\n\n நீங்கள் பயனர்களை விரும்பவில்லை என்றால்: உள்ளே இருக்கும்
        மற்றொரு மாவட்டத்தில் தானாகவே சேர்க்கப்பட வேண்டும் என்றால், மாச்டரை வேரில்
        வைக்கவும்.\n ---\n மாச்டர் மாவட்டத்தில் சேர்க்கை ஒவ்வொரு இரவுக்கும் ஒரு முறை
        நிகழ்கிறது. எனவே மாற்றங்கள் உடனடியாக ஏற்படாது.\n"
    profileCommitmentsStat:
      title: நிச்சயதார்த்த புள்ளிவிவரங்கள்
      md: நிறுவனத்திற்கு பொறுப்பான நபரின் பங்கிலிருந்து தெரியும். இது ஒரு 
        பொதுவான டிரங்க் மாவட்டம் அல்லது கூட்டு நிறுவனங்களுக்கு மட்டுமே.
    report:
      title: செய்தி செயலாக்கம்
      md: "இந்த STEM மாவட்டத்துடன் உள்ளவர்களைப் பற்றி எழுதப்பட்ட அறிக்கைகளுக்கு இங்கே
        நீங்கள் தெரிவிக்கப்படுவீர்கள். இருப்பினும், எல்லா செய்திகளும் உங்களுக்குக்
        காட்டப்படவில்லை:\n - அடிப்படையில், எல்.எம்.சி அல்லது எல்.எச்சிலிருந்து நீங்கள்
        அல்லது உங்கள் எம்ஐடி நிர்வாகிகள் சம்பந்தப்பட்ட எந்த செய்திகளும் காட்டப்படாது.\n\
        \ - எல்.எச்சின் நிர்வாகியாக, எல்.எம்.சி நிர்வாகிகள் சம்பந்தப்பட்ட செய்திகளை
        மட்டுமே நீங்கள் அணுகலாம்.\n ---\n ஒரு செய்தியை செயலாக்குவது குறித்த தகவல்களை
        இங்கே படிக்கலாம்: [ஒரு செய்தியைத் திருத்துதல்] (https://wiki.foodsharing.de/regel
        காயங்கள் _-_ KONESEMEN_UND_ செயலாக்கம் #.29_MANDELCHAFT_EINER_ME.\n"
    achievements:
      title: ச்டிக்கர்
      md: "சில பயிற்சிகளில் பங்கேற்பது போன்ற பயனர் -குறிப்பிட்ட பண்புகளைக் குறிக்க
        ச்டிக்கர் அமைப்பு பயன்படுத்தப்படலாம். ச்டிக்கர்கள் செல்லுபடியாகும் அல்லது
        அவை செல்லாத இறுதி தேதியைக் கொண்டிருக்கலாம்.\n"
    hygieneRequirement:
      title: நிறுவனங்களுக்கான சுகாதாரத் தேவை
      md: "சில நிறுவனங்களில் பணிபுரிய, Foodsavers உணவு சுகாதாரத்தில் பயிற்சி பெற்றிருக்க
        வேண்டும். ஒரு நிறுவனத்திற்கு இந்த செயல்பாடு செயல்படுத்தப்பட்டால், அது பின்வரும்
        விளைவுகளைக் கொண்டுள்ளது:\n1. சரியான சுகாதாரப் பயிற்சி இல்லாத உணவு சேமிப்பாளர்கள்
        செயல்பாட்டுக் குழுவிற்கு விண்ணப்பிக்க முடியாது. \n2. ஏற்கனவே குழுவில் உறுப்பு
        வகிக்கும் உணவு சேமிப்பாளர்கள் தங்கள் சுகாதாரப் பயிற்சி இன்னும் செல்லுபடியாகும்
        இடங்களில் மட்டுமே பதிவு செய்ய முடியும். \n\nஇரண்டு சந்தர்ப்பங்களிலும், இந்தச்
        செயலுக்கு சுகாதாரப் பயிற்சி இல்லை என்பதை விளக்கும் குறிப்பு காட்டப்படும்.
        கூடுதலாக, சுகாதார பயிற்சி நேரடியாக இணைக்கப்பட்டுள்ளது. \n\n---\n\nகவனிக்க
        வேண்டியது: இந்தச் செயல்பாடு உணவுப் பகிர்வின் சொந்த சுகாதார ச்டிக்கர்களை மட்டுமே
        அடிப்படையாகக் கொண்டது. சுயவிவரத்தில் பதிவேற்றப்பட்ட வெளிப்புற வழங்குநர்களின்
        (மெட்ரோ போன்றவை) சுகாதாரச் சான்றிதழ்கள் அல்லது வேறு இடங்களில் பெறப்பட்ட சுகாதாரப்
        பயிற்சி ஆகியவை தொழில்நுட்ப ரீதியாக கணக்கில் எடுத்துக்கொள்ளப்படுவதில்லை.\n"
    basket:
      title: உணவு கூடை
      md: "உணவு தளங்கள் பயனர்களால் வழங்கப்படுகின்றன: உள்ளே யார் (பெரும்பாலும் சேமிக்கப்படுகிறார்கள்)
        உணவை இலவசமாக கடந்து செல்ல விரும்புகிறார்கள் **. பதிவுசெய்யப்பட்ட பயனர்கள்:
        உள்ளே, அதை எடுக்க ஒரு உணவு கூடை பற்றி விசாரிக்கலாம்.\n"
    moderatorForumHide:
      title: 'மதிப்பீட்டாளரின் மன்றங்களில் மறைக்க: உள்ளே'
      md: "######## மதிப்பீட்டாளர் யார்: இல்?\n மதிப்பீட்டாளர்கள்: ஒரு குழு அல்லது
        மாவட்டத்திற்குள் பொதுவாக நிர்வாகி: உள்ளே அல்லது போட்ச். ஒரு மாவட்டத்தில் ஒரு
        இலக்குகள்-ஏசி * மிதமான * இருந்தால், நிர்வாகி: இந்த குழுவிற்குள், மதிப்பீட்டாளரின்
        பங்கு: உள்ளே.\n ---\n ####### மன்றங்களில் காட்டு\n இந்த விருப்பம் செயல்படுத்தப்பட்டால்,
        மதிப்பீட்டாளர்: உங்கள் சொந்தமாக மட்டுமல்லாமல், மன்றத்தில் உள்ள அனைத்து இடுகைகளையும்
        மறைக்கவும். இதைச் செய்ய, நீங்கள் ஒரு இடுகை அல்லது முழு நூலையும் மறைக்க விரும்புவதற்கான
        காரணத்தை நீங்கள் கொடுக்க வேண்டும். அதன்பிறகு, ஒரு இடுகை இன்னும் மூன்று மாதங்களுக்கு
        மதிப்பீட்டாளருக்கு அணுகக்கூடியது: உள்ளே அணுகக்கூடியது, மேலும் இந்த நேரத்தில்
        மீட்டெடுக்கலாம். பிற பயனர்கள்: உள்ளே (சொற்பொழிவு உரிமைகள் இல்லாமல்) இனி இதைப்
        பார்க்கவில்லை. இந்த மூன்று மாதங்களுக்குப் பிறகு, ஒரு மறைக்கப்பட்ட இடுகையை
        இனி மீட்டெடுக்க முடியாது, இறுதியாக தரவுத்தளத்திலிருந்து நீக்கப்படும்.\n ---\n\
        \ ###### இந்த விருப்பத்தை எங்கே பயன்படுத்த முடியும்?\n உள்ளக பதிவு குழுக்கள்
        மற்றும் நடுவர் வாரியங்களில் (இலக்குகள் AG கள்), தரவு பாதுகாப்பு காரணங்களுக்காக
        இந்த செயல்பாடு அவசியம்.\n பிற பணிக்குழுக்கள் தப்பிக்க, இடுகைகளை மறைக்க முடியும்,
        மேலும் Ags.zirke@foodsharing.network க்கு வெற்றிகரமான ஒருங்கிணைப்புக்கான இணைப்பை
        நிர்வாகிகளின் அங்கீகாரத்திற்கான உள் ஒருங்கிணைப்புடன் அனுப்பலாம். இந்த விருப்பம்
        உள்ளக மாவட்டங்களுக்கு நோக்கமாக இல்லை.\n"
    reportReasons:
      title: செய்தி படிவம்
      md: "ஃபுட்சேவர்: செய்தி படிவத்தை நேரடியாகப் பயன்படுத்தி வழக்கமான மீறல்களை உள்ளே
        தெரிவிக்க முடியும். செயல்படுத்துவதன் மூலம், அறிக்கைகளுக்கு பொறுப்பான நபர்கள்
        விரைவாகவும் எளிதாகவும் இந்த வழியில் செய்யப்பட்ட அறிக்கைகளுக்கான அறிவிப்புகளைப்
        பெறுகிறார்கள்.\n ---\n மாவட்டத்தின் எல்.எம்.சி எந்த அறிக்கையிடல் காரணங்கள்
        செய்தி படிவத்தில் காட்டப்படுகின்றன என்பதை பணியமர்த்த முடியும்.\n எளிமைப்படுத்தப்பட்ட
        மற்றும் விரிவான அறிக்கையிடல் காரணங்களுக்கிடையில் நீங்கள் தேர்வு செய்யலாம்.
        விரிவான அறிக்கையிடல் காரணங்களைப் பொறுத்தவரை, அனைத்தும் [இங்கே b இன் கீழ் விக்கியில்]
        (https://wiki.foodsharing.de/ நடத்தை விதிகள் #.29_vereichen_beiholungen) பட்டியலிடப்பட்ட
        விதிகள் உள்ளன.\n கூடுதலாக, \"பிற\" விருப்பத்தை மேலும் செய்தியின் செய்தியாக
        பட்டியலிட வேண்டுமா என்பதைத் தேர்ந்தெடுக்கலாம்.\n ---\n அமைப்பதற்கான பரிந்துரைகளை
        எல்.எம்.சி. இந்த அணுகுமுறையின் முடிவும் பொறுப்பும் நிர்வாகியால் மட்டுமே உள்ளது:
        உள்ளக செய்திக் குழுவிற்குள், இந்த பரிந்துரைகளைப் பின்பற்ற வேண்டியதில்லை *.\n"
    achievementIcon:
      title: ச்டிக்கர்களுக்கான சின்னங்கள்
      md: "ஒவ்வொரு ச்டிக்கருக்கும் ஒரு படவுரு உள்ளது, ஒரு சிறிய கிராஃபிக், அது எதைப்
        பற்றி முதல் பார்வையில் காட்ட வேண்டும். கிடைக்கக்கூடிய ஐகான்களின் பட்டியலை
        https://fontawesome.com/v5/search?o=r&m=free&s=solid இல் காணலாம்.\n\n நீங்கள்
        பயன்படுத்த விரும்பும் உள்ளீட்டு புலத்தில் ஐகானின் பெயரை உள்ளிட வேண்டும், எ.கா.\n\
        \ உங்கள் உள்ளீடு செயல்படுகிறதா என்பதை நீங்கள் சரிபார்க்கலாம்.\n நீங்கள் ஒரு
        ஐகானை உள்ளிடவில்லை என்றால், ச்டிக்கர்களுக்கான நிலையான படவுரு \"*நாள்*\" தானாகவே
        பயன்படுத்தப்படுகிறது.\n"
    polls:
      title: வாக்களிப்பு
      md: "ஒருங்கிணைப்பு தொகுதியின் உதவியுடன், தேர்தல்கள், கணக்கெடுப்புகள் மற்றும்
        பிற ஒருங்கிணைப்பு ஆகியவை அநாமதேயமாகவும் நேரடியாகவும் உணவு பகிர்வு தளத்தில்
        மேற்கொள்ளப்படலாம். விரிவான வழிமுறைகளை https://wiki.foodsharing.de/abstimmungsmodul
        இல் காணலாம்\n"
    pollScopes:
      title: வாக்களிக்கும் உரிமை
      md: "வாக்கெடுப்பை உருவாக்கும்போது, வாக்களிக்க உரிமை உள்ள பல்வேறு குழுக்களிடமிருந்து
        நீங்கள் தேர்வு செய்யலாம்.\n அனைத்து விருப்பங்களுக்கும் பின்வருபவை பொருந்தும்:\n\
        \ .\n - வாக்களிக்க உரிமை பெற்ற உணவுப் பயணியின் எண்ணிக்கை: உள்ளே தேர்வுக்குப்
        பின்னால் உள்ள அடைப்புக்குறிக்குள் உள்ளது.\n - வாக்குகள் உருவாக்கப்பட்டவுடன்,
        வாக்காளர்கள் தீர்மானிக்கப்படுகிறார்கள். வாக்கெடுப்பு வரையப்படும் நேரத்தில்
        நீங்கள் தொடர்புடைய நபர்களின் குழுவில் விழுந்தால்.\n"
    publicEvent:
      title: பொது நிகழ்வுகள்
      md: "நிகழ்வுகளை ஒரு பணிக்குழுவின் நிர்வாகிகள் அல்லது கோல்ச் ஏசிக் பொது உறவுகள்
        அல்லது தூதர்: இன்சைட் அச் பப்ளிக். பொது நிகழ்வுகள் அனைவருக்கும் அணுகக்கூடியவை.
        இடம் மற்றும் தகவல்களைக் காண நீங்கள் மேடையில் பதிவு செய்ய வேண்டியதில்லை. முள்
        சுவர் மற்றும் பங்கேற்பாளர்: இருப்பினும், பதிவுசெய்யப்பட்ட பயனர்களுக்கு மட்டுமே
        உள் பட்டியல் அணுக முடியும்: உள்ளே அணுகலாம். \nஉங்கள் உள்ளக உணவு பகிர்வு சமூகத்திற்கு
        வெளியே உங்களை அழைக்க விரும்பினால், ஒரு நிகழ்வை பொதுவில் உள்ளிடவும், எல்லோரும்
        வரலாம்.\n"
    change_verified_data:
      title: சரிபார்க்கப்பட்ட தரவின் மாற்றத்திற்கு விண்ணப்பிக்கவும்
      md: "உணவு சேவையகமாக பணியாற்ற, உங்கள் சுயவிவரத்தில் உள்ள தரவு சரியானது என்பது
        முதன்மை. நீங்கள் உணவைச் சேமிப்பதற்கு முன், நீங்கள் தூதரால் ஒப்பிடப்படுகிறீர்கள்:
        உங்கள் ஐடியுடன் உள்ளே. எனவே, உங்கள் பெயரையும் பிறந்த தேதியையும் மாற்ற முடியாது.\
        \ \n---\nஇந்த துறைகளில் ஒன்றை மாற்ற வேண்டும் என்றால், நீங்கள் ஒரு தூதரை தொடர்பு
        கொள்ளலாம்: உங்கள் முதன்மையான மாவட்டத்தில். உங்களுக்காக தொடர்புடைய மாற்றத்தை
        நீங்கள் செய்யலாம். நீங்கள் உங்கள் தண்டு மாவட்டத்தில் இருந்தால், இடது பக்கப்பட்டியில்
        [மாவட்டத்தின் மன்றம்] ({link}) இல் காண்பீர்கள்.\n"
    pickupOptions:
      title: பதிவு விருப்பங்கள்
      md: "*நுழைவு விருப்பங்கள்* பகுதியானது, உங்கள் நிறுவனங்களில் உணவு சேமிப்பாளர்கள்
        இன்னும் தேடப்பட்டு வரும் அனைத்து வரவிருக்கும் ச்லாட்டுகளின் மேலோட்டத்தைக்
        காட்டுகிறது. விருப்பங்கள் மெனுவைப் பயன்படுத்தி உங்கள் தேவைகளுக்குப் பார்வையை
        நீங்கள் சரிசெய்யலாம்:\n\n**பதிவுசெய்யப்பட்ட ச்லாட்டுகள்:** உங்கள் ச்லாட்டுகளை
        சிறப்பாக திட்டமிட முடியும், நீங்கள் ஏற்கனவே பதிவு செய்துள்ள ச்லாட்டுகளையும்
        காட்டலாம். இந்த ச்லாட்டுகள் சற்று மங்கலான நிறத்தில் காட்டப்படுவதால், அவற்றை
        நீங்கள் ஒரு பார்வையில் பார்க்கலாம். \n\n**BV பார்வை:** செயல்பாடுகளுக்கு பொறுப்பானவர்கள்
        (BV) அனைத்து இடங்களும் தங்கள் நிறுவனங்களில் நம்பகத்தன்மையுடன் நடைபெறுவதை உறுதி
        செய்கின்றனர். நீங்கள் BV ஆக இருந்தால், நீங்கள் பொறுப்பான நிறுவனங்களுக்கு மட்டுமே
        பார்வையை வரம்பிடலாம். இது விசயங்களைக் கண்காணிப்பதை எளிதாக்குகிறது. \n**நாட்கள்
        வாரியாக:** இந்தக் காட்சியில், உங்கள் நுழைவு விருப்பங்கள் நாள் வாரியாகத் தொகுக்கப்பட்டு
        மிகவும் கச்சிதமான முறையில் வழங்கப்படுகின்றன. இது மேலோட்டத்தைப் பெறுவதை எளிதாக்குகிறது,
        குறிப்பாக ஒவ்வொரு நாளும் உங்களுக்கு பல நுழைவு விருப்பங்கள் இருந்தால்.\n"
    commons_resources:
      title: 'சமூக வளங்கள்'
      md: "சில வளங்கள் ஒரு நபருக்கு சொந்தமானது அல்ல, ஆனால் சமூகத்திற்கு சொந்தமானது.\
        \ \n\n##### சமூக வளங்களின் எடுத்துக்காட்டுகள் என்ன? \nசமூக ஆதாரங்கள் பொதுவாக
        **பொருட்கள்**, **தகவல்** அல்லது **தொடர்புகள்**. இது மாவட்ட உணவுப் பகிர்வு
        பேனராக இருக்கலாம், மேகக்கட்டத்தில் புகைப்படக் காப்பகமாக இருக்கலாம் அல்லது
        வெளிப்புறத் தொடர்புகளுடன் தொடர்பு கொள்ளலாம். சமூக வளங்களுக்கு எந்த ஒரு நபரும்
        பொறுப்பேற்காததால், தேவைப்பட்டால், ஆதார விவரத்தில் ஒரு தொடர்பு விருப்பம் சேர்க்கப்பட
        வேண்டும். \n\n##### சமூக வளங்களை யார் நிர்வகிக்கிறார்கள்? \nபணிக்குழுக்களில்,
        அனைத்து நிர்வாகிகளும் சமூக ஆதாரங்களை உருவாக்கலாம், திருத்தலாம் மற்றும் நீக்கலாம்.
        மாவட்டங்களில், தூதர்களுக்கு ஆரம்பத்தில் இந்த ஏற்பு உள்ளது. ஆதார் ஏசி இருந்தால்,
        அதற்குப் பதிலாக இந்த ஏசியின் நிர்வாகிகளிடம்தான் ஏற்பு இருக்கும்.\n"
    resource_mosaic:
      title: 'வள மொசைக்'
      md: "##### யோசனை\nஉணவைச் சேமிப்பது என்று வரும்போது, நாம் அனைவரும் நமது நேரம்,
        போக்குவரத்து திறன் மற்றும் அனுபவத்தை மிகவும் திறம்பட பகிர்ந்து கொள்கிறோம்.
        ஆனால் ஒரு நிலையான உணவு முறைக்கு புதிய உத்வேகத்தை வழங்குவதற்கும், நீண்ட காலத்திற்கு
        உணவுப் பகிர்வு இயக்கத்தை வலுப்படுத்துவதற்கும், சேமிப்பதை விட அதிகம் தேவைப்படுகிறது.
        நாம் ஒவ்வொருவரும் எங்களுடன் வெவ்வேறு ஆதாரங்களைக் கொண்டு வருகிறோம், அதாவது
        *திறன்கள்*, *பொருட்கள்* அல்லது *தொடர்புகள்*, அவை பெரும்பாலும் மறைக்கப்பட்டு
        பயன்படுத்தப்படாமல் இருக்கும். ஆனால் ஒன்றாக, இந்த வளங்கள் காணக்கூடியதாகவும்
        பயன்படுத்தக்கூடியதாகவும் மாறும் - மொசைக்கின் தனிப்பட்ட பகுதிகள் ஒன்றாக சேர்ந்து
        ஒரு பெரிய படத்தை உருவாக்குகின்றன. வள மொசைக் இந்த பன்முகத்தன்மையைக் காணக்கூடியதாக
        இருக்கும். இது புதிய திட்ட சிந்தனைகள், ஒத்துழைப்பு மற்றும் மீட்புக்கு அப்பாற்பட்ட
        பரச்பர ஆதரவிற்கான இடத்தை உருவாக்குகிறது. \n\n##### வள மேலோட்டம்\nரிசோர்ச்
        மொசைக்கின் இதயம் மாவட்டம் அல்லது பணிக்குழுவில் உள்ள அனைத்து வளங்களின் மேலோட்டமாகும்.
        உங்கள் குழுவின் பன்முகத்தன்மையால் நீங்கள் ஈர்க்கப்படலாம் அல்லது குறிப்பிட்ட
        ஆதாரங்களை நீங்கள் தேடலாம். ஒவ்வொரு ஆதாரத்தையும் சொடுக்கு செய்து அதைப் பற்றிய
        கூடுதல் தகவல்களைப் பெறலாம். பின்னர் எளிதாகக் கண்டறிய, ஆதாரங்களை பிடித்தவைகளாகவும்
        சேமிக்கலாம். \n\nஒரு ஆதாரத்தைப் பகிர்வதில் ஒருவர் எவ்வளவு மகிழ்ச்சியடைகிறார்
        என்பதை அதன் நிறத்தின் மூலம் நீங்கள் அறியலாம்: வழங்கப்படுவதை அனுபவிக்கும் ஆதாரங்கள்
        தடிமனான, பிரகாசமான வண்ணங்களில் தோன்றும், அதே சமயம் பகிரப்படுவதற்கான வாய்ப்புகள்
        குறைவாக இருக்கும் ஆதாரங்கள் சாம்பல் நிறத்தில் காட்டப்படுகின்றன. \n\n#####
        தேடவும், வடிகட்டி & வரிசைப்படுத்தவும்\nபொருத்தமான ஆதாரங்களை விரைவாகக் கண்டறிய,
        பல்வேறு வடிகட்டி விருப்பங்கள் உள்ளன. \n- நீங்கள் குறிப்பாக **வகைகள்** மூலம்
        வடிகட்டலாம் அல்லது குறிப்பிட்ட ** விதிமுறைகளை** நேரடியாக தேடலாம். \n- **செயலில்
        உள்ள பயனர்கள் மட்டும்** கடந்த 30 நாட்களில் உள்நுழையாத அல்லது தற்போது ச்லீப்பிஎட்
        அணிந்துள்ள பயனர்களிடமிருந்து ஆதாரங்களை மறைக்கும். \n- குழுவில் உள்ள அனைத்து
        உணவு சேமிப்பாளர்களின் வளங்களும் வள மொசைக்கில் காட்டப்படும். மாவட்டங்களில்,
        **சொந்த மாவட்டம்** அந்தந்த மாவட்டமாக இருக்கும் பயனர்களுக்கும் பார்வையை வரம்பிடலாம்.\
        \ \n- நீங்கள் ஆதாரங்களை **பிடித்தவை** எனக் குறிப்பிட்டிருந்தால், அவற்றை மட்டும்
        நீங்கள் குறிப்பாகக் காட்ட முடியும். \n\nகூடுதலாக, நீங்கள் முடிவுகளை ** வரிசைப்படுத்தலாம்\n"
    similar_resources:
      title: 'ஒத்த வளங்கள்'
      md: '**அதே வகைகள்** உள்ளிடப்பட்ட 10 பிற ஆதாரங்கள் வரை ஒத்த ஆதாரங்களாகக் காட்டப்படும்.'
    my_resources:
      title: 'சொந்த வளங்கள்'
      md: "இந்த பிரிவில் நீங்கள் உங்கள் சொந்த வளங்களை நிர்வகிக்கலாம்; புதிய ஆதாரங்களை
        உருவாக்கவும், திருத்தவும், நீக்கவும் அல்லது நீங்கள் தற்போது பகிர்வதை பார்க்கவும்.\
        \ \n\n##### வளம் என்றால் என்ன? \nஉணவுப் பகிர்வு சமூகத்திற்கு நீங்கள் பங்களிக்க
        விரும்பும் எதுவும் ஆதாரமாக இருக்கலாம். இவை **திறன்கள்**, எடுத்துக்காட்டாக
        சமையல் அல்லது நிரலாக்கம், **பொருட்கள்**, கார்கோ பைக் அல்லது மொபைல் சமையல்
        நிலையம் அல்லது பிற முயற்சிகள், அதிகாரிகள், ஊடகங்கள் போன்றவற்றுக்கு **தொடர்புகள்**
        போன்றவை.\n\n##### எல்லாம் முடியும், எதுவும் செய்ய வேண்டியதில்லை\nஆதாரங்களை
        யாரும் பட்டியலிட வேண்டியதில்லை, மேலும் குறிப்பிட்ட ஆதாரத்தை நீங்கள் பட்டியலிட்டுள்ளதால்,
        சில செயல்களுக்கு நீங்கள் அதை *கிடைக்க வேண்டும்* என்று அர்த்தமல்ல. நீங்கள்
        *பங்களிக்க விரும்புவதை* பகிர்வதே அதிகம். \n\n##### என் வளங்களை யார் பார்க்கிறார்கள்?\
        \ \nஉங்கள் மாவட்டங்கள் மற்றும் பணிக்குழுக்களுக்குள் ஆதாரங்கள் தெரியும். இருப்பினும்,
        இது நாட்டின் மிகப் பெரிய மாவட்டங்கள் அல்லது கூட்டாட்சி மாநில வகைகளை விலக்குகிறது,
        இதில் வள மொசைக் இல்லை. உங்களுக்குத் தெரிந்த ஃபுட்சேவர்சுக்கு ஒவ்வொரு தனிப்பட்ட
        வளத்தின் தெரிவுநிலையையும் நீங்கள் கட்டுப்படுத்தலாம்.\n"
    achievementDuplicateMode:
      title: 'ச்டிக்கர்களின் பல ஒதுக்கீடு'
      md: "ச்டிக்கர்கள் மிகவும் மாறுபட்ட சூழ்நிலைகளில் குறிப்பான்களாக செயல்பட முடியும்.
        எனவே ஒரே நேரத்தில் ஒரே நபருக்கு பலமுறை ச்டிக்கரை வழங்க முடியுமா என்பதை நீங்கள்
        அமைக்கலாம். \n\n- **ஓவர்ரைட்:** ஒரே நேரத்தில் பலமுறை ச்டிக்கரைப் பெற முடியாது.
        ச்டிக்கர் மீண்டும் வழங்கப்பட்டால், தற்போதைய பட்டம் முந்தையதை மாற்றும் அல்லது
        நீட்டிக்கும். உதாரணமாக, இது சுகாதார பயிற்சிக்கு பயன்படுத்தப்படுகிறது. நீங்கள்
        வளையத்தை புதுப்பித்தால், ச்டிக்கர் வெறுமனே நீட்டிக்கப்படும். ச்டிக்கர் தற்போதைய,
        தனித்துவமான நிலையைக் குறிக்க வேண்டுமெனில் *மேலெழுத* என்பதைத் தேர்ந்தெடுக்கவும்.\
        \ \n- **பல முறை வழங்கப்பட்டது:** ஒரே நேரத்தில் பல விருதுகள் சாத்தியமாகும்.
        பலமுறை ஒதுக்கப்பட்ட ச்டிக்கர்கள் சுயவிவரத்தில் குழுவாகக் காட்டப்படும், ஆனால்
        தொடர்புடைய அனைத்து தகவல்களும் அணுகக்கூடியவை. எடுத்துக்காட்டாக, மாதிரி சேகரிப்புகளை
        ஆவணப்படுத்த இது பயன்படுத்தப்படலாம், அவற்றில் பல தேவைப்படுகின்றன. ஒவ்வொரு தனிப்பட்ட
        விருதும் முக்கியமானது மற்றும் புரிந்துகொள்ளக்கூடியதாக இருக்க வேண்டும் எனில்
        *பல முறை வழங்கப்பட்டது* என்பதைத் தேர்ந்தெடுக்கவும்.\n"
    achievementVisibility:
      title: 'ச்டிக்கர் தெரிவுநிலை'
      md: "ச்டிக்கரின் தெரிவுநிலை, அந்த ச்டிக்கர் யாருக்காவது கொடுக்கப்பட்டதா என்பதை
        யார் பார்க்கலாம் என்பதை தீர்மானிக்கிறது. பின்வரும் விருப்பங்கள் உள்ளன:\n\n\
        - **மறைக்கப்பட்டவை:** நிறுவன உரிமைகள் உள்ள பயனர்களுக்கு மட்டுமே ச்டிக்கர்
        தெரியும். \nமறைக்கப்பட்டவை: \"யாருக்கும் காட்டப்படவில்லை\"\n- **தனிப்பட்டவர்:**
        குறிப்பிட்ட நோக்கத்தில் உள்ள நிர்வாகிகள் மற்றும் தூதர்கள் மட்டுமே ச்டிக்கரைப்
        பார்ப்பார்கள். \n- **செயல்பாடுகளுக்குப் பொறுப்பானவர்கள் மட்டுமே:** ச்டிக்கர்
        நபர் மற்றும் தேர்ந்தெடுக்கப்பட்ட பகுதியில் செயல்பாடுகளுக்குப் பொறுப்பான அனைவருக்கும்
        காட்டப்படும். \n- **நோக்கத்தில்:** ச்டிக்கர் குறிப்பிட்ட மாவட்டத்தில் உறுப்பினர்களாக
        இருக்கும் அனைத்து பயனர்களுக்கும் தெரியும். \n- **குளோபல்:** ச்டிக்கர் பதிவுசெய்யப்பட்ட
        அனைத்து பயனர்களுக்கும் தெரியும். \n\nதனிப்பட்ட தகவல்களைத் தேவையில்லாமல் பார்ப்பதைத்
        தவிர்க்க, எந்த அளவுக்குத் தெரிவுநிலையை மட்டுப்படுத்தலாம் என்பதை எப்போதும்
        கருத்தில் கொள்ளவும். பார்வை நிலை பின்னர் சரிசெய்யப்படலாம்.\n"
    store_chain_info:
      md: 'இந்த நிறுவனம் [வணிகச் சங்கிலி] (https://wiki.foodsharing.de/Betrieb#Betriebskette)
        சேர்ந்தது. இந்த நிறுவனத்தில் உள்ள குழுவைப் பார்க்கும் வாய்ப்பு மற்றும் சேகரிப்பு
        ச்லாட்டுகளின் எண்ணிக்கையைப் பார்க்கும் வாய்ப்புள்ள அனைத்து நிறுவனச் சங்கிலிகளுக்கும்
        [KAMs] (https://wiki.foodsharing.de/Key_Account_Manager_(KAM)) பொறுப்பு உள்ளது.

        '

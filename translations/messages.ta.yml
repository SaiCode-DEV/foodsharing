    text: "உணவு பகிர்வு வாரியம் இ. வி. நூல்களை ஒன்றாக வைத்திருக்கிறார், செர்மனி, ஆச்திரியா
      மற்றும் சுவிட்சர்லாந்தை பயனர்களாக பிணையம் செய்துள்ளார்: ஃபுட்சேரிங்.டே இயங்குதளத்தின்
      உள்ளே மற்றும் தேசிய விவகாரங்களுக்கு பொறுப்பாகும். பெரிய உணவு பகிர்வு சமூகத்தின்
      அனைத்து கவலைகளையும் கவனித்துக்கொள்வதற்காக இயக்குநர்கள் குழு குழுவில் நெருக்கமான
      ஒப்பந்தங்களில் மற்றும் முக்கியமாக ஆன்லைனில் நிறைய வேலை செய்கிறது. கூடுதலாக,
      வாரியம் நிறுவன மேம்பாடு மற்றும் உணவு கழிவுகளின் அரசியல் பரிமாணத்துடன் விரிவாகக்
      கையாள்கிறது.\n"
  it_member:
    title: அது-அணி
    text: "உணவு பகிர்வு ஆயிரக்கணக்கான தன்னார்வலர்களின் உறுதிப்பாட்டிற்கு மட்டுமே சாத்தியமாகும்!
      தேசிய பணிக்குழுக்களை ஒருங்கிணைக்கும், வலைத்தளத்தை உருவாக்கும் அல்லது உணவு பகிர்வு
      அனைத்திற்கும் பிற முக்கியமான பணிகளை மேற்கொள்வது இங்கே:\n"
  alumni_member:
    title: முன்னாள்
    text: "ஃபுட்சேரிங் தோற்றத்தின் வெற்றிகரமான வரலாற்றை நாம் ஒன்றாக திரும்பிப் பார்க்க
      முடியும். இந்த கட்டத்தில், நிறுவனக் குழு அல்லது இயக்குநர்கள் குழுவிற்கு ஓரளவு
      சுறுசுறுப்பாக இதில் பங்கேற்ற அனைவருக்கும் நன்றி தெரிவிக்க விரும்புகிறோம்!\n"

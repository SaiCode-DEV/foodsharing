    info: "இதனால் உங்கள் செய்தியைத் திருத்த முடியும், முடிந்தவரை, அதில் பின்வரும்
      தகவல்களைக் கொண்டிருக்க வேண்டும்:\n - சம்பவத்தின் தேதி, நேரம் மற்றும் இடம்,\n\
      \ - நீங்கள் ஏற்கனவே செய்தவை, எ.கா. பி. நீங்கள் ஏற்கனவே அந்த நபருடன் நேரடியாக
      பேசியிருந்தாலும், உண்மைகளை தெளிவுபடுத்தியிருந்தாலும்,\n - கேள்விகளை எவ்வாறு
      அடைவது.\n\n இங்கே நீங்கள் [விக்கியில் நடத்தை விதிகளை] (https://wiki.foodsharing.de/
      நடத்தை விதிகள்) காண்பீர்கள்.\n"

      எந்த நேரத்திலும் நீக்கலாம், இது முன்பு உருவாக்கப்பட்ட கேலெண்டர் இணைப்புகளை செல்லாததாக்கும்.\
      \ \n\nஉங்கள் காலெண்டர் நிரல் இந்த காலெண்டரை தொடர்ந்து **ஒத்திசைக்க வேண்டும்**.

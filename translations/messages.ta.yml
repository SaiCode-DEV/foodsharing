    is_big_city_2: தயவுசெய்து ஒரு நகரம், ஒரு பகுதி அல்லது மாவட்டத்தைத் 
      தேர்ந்தெடுக்கவும்!
  description: 'உங்கள் மாவட்டத்தைத் தொடங்குவதற்கு உங்கள் கண்டத்தை சொடுக்கு செய்வதன்
    மூலம் உங்கள் முதல் மாவட்டத்தில் சேரலாம். உங்களுக்காக ஒரு மாவட்டத்தை நீங்கள் காணவில்லை
    என்றால், ஒரு நிலையைத் தேர்ந்தெடுக்கவும் அல்லது அருகிலுள்ள மாவட்டத்தில் சேரவும்.
    இப்பகுதியில் நீங்களே இருக்க உங்களுக்கு வழி இல்லை என்றால்: உணவுப் பயணத்தில் பயிற்சி
    பெற வேண்டும்: உங்கள் சொந்த மாவட்டத்தை நிறுவுவதை நீங்கள் பரிசீலிக்கலாம். இந்த வழக்கில்,
    தயவுசெய்து விக்கியைப் படியுங்கள், குறிப்பாக [மாவட்டங்களை நிறுவுதல் அல்லது செயல்படுத்துவதற்கான
    கட்டுரை] ({href}) நன்றாகப் படியுங்கள். நீங்கள் மாவட்டத்தை உள்ளிட விரும்பினால்
    அல்லது விக்கி பதிலளிக்காத குறிப்பிட்ட கேள்விகள் இருந்தால், எங்களுக்கு [ஒரு மின்னஞ்சல்]
    ({mail}) எழுதுங்கள். நாங்கள் பொதுவான கேள்விகளுக்கான தொடர்புகளின் மையப் புள்ளி
    அல்ல, ஆனால் மாவட்டங்களைப் பற்றிய எந்த கேள்விகளுக்கும் உங்களுக்கு உதவ முடியும்.'

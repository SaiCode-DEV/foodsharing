    பயன்படுத்தப்பட வேண்டும் என்பதை நினைவில் கொள்க. சுகாதாரப் பயிற்சியை செயல்படுத்துவது
    போன்ற சுயவிவரத்தைப் பற்றிய கூடுதல் தகவல்களை வழங்க தயவுசெய்து இந்தத் துறையைப் பயன்படுத்த
    வேண்டாம். அதற்கு பதிலாக, சுயவிவரங்களைப் பற்றிய கூடுதல் தகவல்களைச் சேமிக்க பணிக்குழுக்கள்

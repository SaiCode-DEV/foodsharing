    title: 'Присоединяйтесь'
  how_we_work:
    title: 'Как мы работаем'
    text: 'Всё это создаётся добровольно и бесплатно, независимо и без рекламы. Платформа
      — сердце нашего сообщества. Здесь мы координируемся локально и по всей Европе.
      Веб-сайт и бета-приложение — open source и основаны на энтузиазме многих. Как
      вы можете помочь в разработке?

      '

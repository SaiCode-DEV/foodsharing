      part3: '— здесь вы можете предложить свои излишки и забрать продукты у других.'
      part1: 'Кроме того есть'
    title: 'Рядом с вами'
    text3:
      part1: 'Сообщество организовано по районам.'
      part2: 'Найдите районы в вашем окружении'
  this_is_how_it_works: 'Как это работает'
  private:
    text: 'Боритесь с пищевыми отходами у себя дома. Мы информируем на ярмарках и
      мероприятиях.'
    title: 'В частном порядке'
  join: 'Присоединиться'
  dependability: 'Во многих местах есть фэйртейлеры — полки или холодильники, где
    продукты можно бесплатно взять или принести. Если вы отдаёте или получаете продукты,
    будьте надёжны и пунктуальны, не подводите людей.'
  towns:
    title: 'Города фудшеринг'
    text: 'Участие городов различается в том, находятся ли они ещё в процессе подготовки
      или уже получили статус города фудшеринг. Статус присваивается, если помимо
      команды фудшеринг на месте есть подписанное муниципалитетом заявление о сотрудничестве
      как символ партнёрства между фудшеринг и государственными органами.

      '
  slogan_1: 'Вместе за повышение ценности продуктов'
  store:
    text: 'Вы работаете в супермаркете, ресторане, столовой и т.п.? Зарегистрируйте
      своё предприятие и спасайте продукты.'
    title: 'Как предприятие'
  more_infos: 'Узнать больше'
  donate:
    link: 'Поддержать фудшеринг'
    title: 'Пожертвования'
    text: 'Мы стараемся покрывать расходы за счёт спонсорства. В некоторых случаях
      нам это не удаётся полностью, например для финансирования мероприятий, юридической
      помощи или страховок. Мы будем благодарны за любую поддержку.

      '
  welcome_text: 'Добро пожаловать на фудшеринг'
  beresponsible: 'Будьте ответственны'
  member:
    title: 'Как участник'
    text: 'Делитесь своими излишками с сообществом фудшеринг или спасайте продукты
      у предприятий.'
  demands:
    title: 'Требования'
    text: 'Чтобы эффективно снизить пищевые отходы, нужно больше, чем просто спасение
      оставшихся продуктов у предприятий или просветительская работа с потребителями.
      Необходимо политическое движение: нужны обязательные цели по сокращению отходов
      вдоль всей цепочки создания стоимости. Также необходимо пересмотреть действующие
      торговые нормы и поддержать организации, которые спасают продукты или предлагают
      образование по питанию.

      '
    image_alt: ''
  vision:
    title: 'Миссия'
    text: 'Мы — экологическое и просветительское движение, которое выступает против
      расточительного обращения с ресурсами и за устойчивую систему питания. Наша
      долгосрочная цель — положить конец трате съедобных продуктов. Поэтому мы действуем
      локально: спасаем продукты из домашних хозяйств и от предприятий, ведём диалог
      с политиками и распространяем нашу идею.'
  forstores: 'Для предприятий и организаций'
  call_to_action_button: 'Присоединиться сейчас'
  registernow: 'Зарегистрироваться сейчас'
  join_welcome: 'Рады, что вы хотите участвовать в фудшеринге!'
  telltruth: 'Мы, кто развивает и поддерживает фудшеринг, относимся к обязанностям
    серьезно. Мы соблюдаем ряд законов и требований. Пожалуйста, будьте честны при
    заполнении данных и в других сообщениях на платформе, например в корзинах еды
    и сообщениях на форуме.'
  register: 'В конце этой страницы вы можете зарегистрироваться как фудшерер.'
  honest: 'Будьте честны'
  together: 'Вместе с фудшеринг вы можете обеспечить, чтобы отсортированные и непроданные
    продукты находили полезное применение, а не выбрасывались. Больше информации вы
    найдёте [здесь](/fuer-unternehmen).'
  responsibility: 'Одна треть всех продуктов оказывается в мусоре. С этим нужно покончить.
    Мы не хотим больше ничего выбрасывать! Мы хотим обращаться с продуктами ответственно
    и рады, что вы присоединяетесь.'
  proposals: 'Мы хотим развиваться и становиться лучше. Для этого нам нужны ваши идеи
    и советы. Отправляйте их на [info@foodsharing.de](mailto:info@foodsharing.de)'
  notallowed: 'Передача лекарств (включая гомеопатические средства) на фудшеринг запрещена.
    Одежда, косметика, бытовая химия, игрушки и другие не пищевые товары также нельзя
    обменивать или передавать через фудшеринг. Платформа фудшеринг оставляет за собой
    право удалять такие предложения.'
  slogan_3: 'фудшеринг остаётся бесплатным.'
  slogan_2: 'сообщество, устойчивость и уважение'
  etiquette: 'Этикет фудшеринг'

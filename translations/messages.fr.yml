team_page:
  alumni_member:
    title: Anciennes
    text: "Ensemble, nous pouvons jeter un regard sur l’histoire de la création de
      foodsharing. Nous souhaitons remercier ici toutes les personnes qui y ont contribué,
      parfois en travaillant à plein temps comme bénévoles ou en étant très actives
      au sein de l’équipe organisatrice ou du conseil d’administration !\n"
  it_member:
    title: Équipe informatique
    text: "foodsharing n’est possible que grâce à l’engagement de milliers de bénévoles !
      Voici quelques personnes qui coordonnent des groupes de travail interrégionaux,
      développent le site web ou assument d’autres tâches importantes pour foodsharing :\n"
  board_member:
    title: Comité d’association
    text: "Le conseil d’administration de foodsharing e. V. tient les rênes, met en
      réseau l’Allemagne, l’Autriche et la Suisse en tant qu’utilisateurs de la plateforme
      foodsharing.de et est responsable des questions interrégionales. Le conseil
      d’administration travaille beaucoup en équipe, en étroite concertation les uns
      avec les autres et principalement en ligne, pour répondre à toutes les demandes
      de la grande communauté de foodsharing et de l’extérieur. En outre, le conseil
      d’administration s’occupe beaucoup du développement de l’organisation et de
      la dimension politique du gaspillage alimentaire.\n"

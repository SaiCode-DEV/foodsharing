  startmodal:
    title: Notes du quiz
    infos:
      real_life_examples: La plupart des questions sont basées sur des cas réels
        de foodsharing.
      alone: Le quiz doit être réussi par toi-même et sans aide extérieure pour 
        le contenu. En cas de difficultés linguistiques ou si tu as besoin d’une
        assistance, une autre personne peut bien sûr t’aider à comprendre les 
        questions, mais tu dois pouvoir y répondre seul. C’est pourquoi tu dois 
        trouver un endroit calme où tu pourras faire le quiz sans être dérangé.
      read_carefully: Lis attentivement toutes les questions et réponses.
      wiki: Ne commence pas le quiz au hasard. Lis attentivement les pages 
        d’information répertoriées au préalable. Sans les connaissances du wiki,
        tu ne réussiras pas le quiz.
      multiple_choice: Plusieurs réponses peuvent être correctes par question – 
        ou aucune. Décide donc pour chaque réponse si elle est juste ou fausse.
      pause: Tu peux mettre le quiz en pause après chaque question et le 
        reprendre plus tard.
      feedback: À la fin du quiz, tu reçois directement une évaluation qui te 
        dit si tu as réussi ou non et quelles erreurs tu as commises. Ici, tu 
        peux encore une fois lire tranquillement les justifications.
      limited_tries: Tu ne peux pas refaire le quiz autant de fois que tu le 
        souhaites. Après trois tentatives, tu dois faire une pause de 30 jours 
        pour étudier à nouveau, après quoi tu n’as droit qu’à deux tentatives 
        supplémentaires. Les questions qui te sont posées à chaque tentative 
        sont différentes.
      comment: Après avoir répondu à chaque question, tu vois une évaluation 
        intermédiaire avec des explications pour chacune des possibilités de 
        réponse. Cela aide à comprendre quelle réponse est correcte ou 
        incorrecte et pourquoi. Pour chaque erreur, tu dois lire attentivement 
        les explications. Si quelque chose te semble illogique, incompréhensible
        ou même faux, n’hésite pas à laisser un commentaire. Tes commentaires 
        peuvent t’être attribués afin de te donner un feedback individuel.
      unlimited_tries: Tu peux refaire ce quiz autant de fois que tu le 
        souhaites et tu ne seras jamais disqualifié en cas d’échec. Toutefois, 
        tu dois parfois faire une pause entre les essais.
      timed: Le temps pour répondre aux questions est limité. Ne le laisse pas 
        te stresser. Le temps est réglé individuellement pour chaque question de
        manière à ce que tu aies suffisamment de temps pour y répondre 
        tranquillement. Si tu es à court de temps, fais-le savoir aux 
        administrateurs du quiz par un commentaire.
    acceptPrivacyNotice: Je suis d’accord.

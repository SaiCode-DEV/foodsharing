help:
  tooltip: Afficher l’aide
  helpTitle: 'Aide : {title}'
  key:
    storeLog:
      title: Journal des opérations
      md: "Le protocole d’exploitation est un moyen de **tracer les activités dans
        une entreprise**. Il peut aider à résoudre des conflits ou à corriger des
        erreurs commises par inadvertance.\n---\n###### Exemple\nSupposons que tu
        veuilles savoir qui a été intégré dans l’équipe et par qui au cours des trois
        dernières semaines. Tu peux alors définir la période au moyen de la date de
        début et de la date de fin via les deux champs de date. Ensuite, tu peux sélectionner
        dans le menu déroulant tous les types d’action pertinents. Dans ce cas, par
        exemple « Demander l’adhésion », « Accepter les demandes d’adhésion » et « Refuser
        les demandes d’adhésion ». Si tu cliques maintenant sur le bouton « Afficher
        les actions sélectionnées », l’historique des événements sélectionnés s’affiche.\n\
        \ ---\n###### Accès\nSeules les personnes qui peuvent administrer l’entreprise
        y ont accès. Les foodsavers et les sauteurs ne peuvent pas consulter le journal
        de fonctionnement.\n---\n###### Restrictions\nUn maximum de 100 entrées est
        chargé. Le cas échéant, tu dois limiter la période de recherche ou les types
        d’action sélectionnés si tous les résultats ne sont pas affichés.\n"
    threadPriority:
      title: Priorité d’affichage dans les forums
      md: "Les sujets sont classés en fonction de leur priorité d’affichage. Les sujets
        ayant la même priorité sont classés en fonction de la date de la dernière
        activité.\n---\nLes fils de discussion épinglés ont une priorité de 1, les
        fils de discussion normaux une priorité de 0. Pour trier les fils de discussion
        affichés de manière plus précise, tu peux définir ici des valeurs plus élevées,
        de sorte que les thèmes soient toujours en tête, indépendamment de la date
        de modification.\nLes fils de priorité -1 sont affichés sous tous les autres
        fils.\n"
    profileCommitmentsStat:
      title: Statistique d’engagement
      md: est visible depuis le rôle d’une personne responsable de la 
        coopération. Il est limité aux districts principaux communs ou aux 
        coopérations communes.
    basket:
      title: Paniers alimentaires
      md: "Des paniers alimentaires sont proposés par les utilisateurs qui souhaitent
        transmettre de la nourriture (souvent sauvée) **gratuitement**. Les utilisateurs
        enregistrés peuvent demander un panier alimentaire à récupérer.\n"
    report:
      title: Gestion des plaintes
      md: "Tu trouveras ici les plaintes qui ont été déposées contre des personnes
        appartenant à ce district. Tu ne peux pas voir toutes les plaintes :\n- En
        principe, tu ne verras pas les plaintes auxquelles toi ou tes co-admin du
        service local des plaintes ou du service local d’arbitrage participent.\n\
        - En tant qu’administrateur·rice de la commission locale d’arbitrage, tu n’as
        accès qu’aux plaintes dans lesquelles les administrateur·rice·s de la commission
        locale des plaintes sont impliqués.\n---\nTu peux trouver ici des informations
        sur le traitement d’une plainte : [Traitement d’un message (en allemand)](https://wiki.foodsharing.de/Regelverletzungen_-_Konsequenzen_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)\n"
    reportReasons:
      title: Formulaire de plainte
      md: "Le formulaire de plainte permet aux Foodsavers de signaler directement
        les infractions aux règles. En l’activant, les personnes responsables des
        plaintes recevront rapidement et facilement des notifications pour les signalements
        effectués de cette manière.\n---\nLe groupe de plaintes local du district
        peut définir quels motifs de plainte possibles sont affichés dans le formulaire
        de plainte.\nIl peut choisir entre les motifs simplifiés et les motifs détaillés.
        Pour les motifs détaillés, toutes les règles listées [ici dans le wiki sous
        B](https://wiki.foodsharing.de/Verhaltensregeln#B.29_Verhalten_bei_Abholungen)
        sont incluses.\nEn outre, il est possible de choisir si l’option « Autre »
        doit être listée comme option supplémentaire.\n---\nDes recommandations concernant
        l’embauche peuvent être faites au groupe de plainte local. La décision et
        la responsabilité de ce réglage incombent toutefois uniquement aux administrateur·rice·s
        du groupe local de réclamation, qui ne sont pas *obligés* de suivre ces recommandations.\n"
    achievementIcon:
      title: Icônes pour les vignettes
      md: "Chaque autocollant a une icône, c’est-à-dire un petit graphique qui permet
        de comprendre au premier coup d’œil de quoi il s’agit. Tu trouveras une liste
        des icônes disponibles sur https://fontawesome.com/v5/search?o=r&m=free&s=solid.\n\
        \ \nDans le champ de saisie, tu dois entrer le nom de l’icône que tu souhaites
        utiliser, par exemple « *walking* » ou « *shopping-cart* ».\nTu peux vérifier
        si ta saisie fonctionne en consultant l’aperçu.\nSi tu ne saisis pas d’icône,
        l’icône standard pour les autocollants, « *tag* », est automatiquement utilisée.\n"
    achievements:
      title: Vignettes
      md: "Le système d’autocollants peut être utilisé pour marquer des caractéristiques
        spécifiques à l’utilisateur, comme la participation à certaines formations.
        Les autocollants peuvent être valables pour n’importe quelle durée ou avoir
        une date de fin à partir de laquelle ils ne sont plus valides.\n"
    masterRegion:
      title: District maître
      md: "Lorsque les districts ont un district maître, tous les membres du district
        sont aussi automatiquement inclus dans le district maître. Dans de nombreux
        cas, il est judicieux de choisir le district parental comme district maître,
        mais d’autres applications sont également possibles. Si le district maître
        n’est pas le district parental, les utilisateurs du district **non** seront
        automatiquement inclus dans le district parental.\n\nSi tu ne veux pas que
        les utilisateurs soient automatiquement inclus dans un autre district, définis
        le maître comme racine.\n---\nL’admission dans le district maître se fait
        une fois par nuit. Les changements ne sont donc pas immédiats.\n"
    hygieneRequirement:
      title: Exigence d’hygiène pour les établissements
      md: "Pour la collecte dans certains établissements, les collecteur·ice·s doivent
        être formés à l’hygiène alimentaire. Si cette fonction est activée pour un
        établissement, cela a les conséquences suivantes :\n1. les collecteur·ice·s
        qui n’ont pas reçu de formation valable en matière d’hygiène ne peuvent pas
        postuler pour faire partie de l’équipe de l’établissement.\n2. les collecteur·ice·s
        qui font déjà partie de l’équipe ne peuvent s’inscrire que dans les créneaux
        où leur formation en hygiène est encore valable.\n\nDans les deux cas, une
        remarque s’affiche, expliquant que la formation en hygiène manque pour cette
        action. En outre, la formation à l’hygiène est à chaque fois directement reliée.\n\
        \ \n---\n\nIl est important de noter que : Cette fonction est uniquement basée
        sur les autocollants d’hygiène propres à foodsharing. Ni les certificats d’hygiène
        téléchargés dans le profil de fournisseurs externes, ni les formations en
        hygiène acquises d’une autre manière ne sont techniquement pris en compte.\n"
    moderatorForumHide:
      title: Masquage par les modérateurs dans les forums
      md: "###### Qui est modérateur·rice ?\nLes modérateur·rice·s d’un groupe ou
        d’un district sont généralement les administrateur·rice·s ou les ambassadeur·rice·s.
        S’il existe un groupe de travail GOALS *modération* dans un district, le rôle
        de modérateur revient aux administrateur·rice·s de ce groupe.\n---\n######
        Masquer dans les forums\nSi cette option est activée, les modérateur·rice·s
        peuvent masquer tous les messages du forum, et pas seulement les leurs. Pour
        ce faire, ils doivent indiquer les raisons pour lesquelles ils souhaitent
        masquer un message ou un fil de discussion entier. Un message reste ensuite
        accessible aux modérateur·rice·s pendant trois mois supplémentaires et peut
        être restauré pendant cette période. Les autres utilisateurs (sans droit d’organisation)
        n’y ont plus accès. Après ces trois mois, un message masqué ne peut plus être
        restauré et est définitivement supprimé de la base de données.\n---\n######
        Où cette option peut-elle être utilisée ?\nDans les groupes de signalement
        locaux et les centres d’arbitrage (GOALS), cette fonction est nécessaire pour
        des raisons de protection des données.\nD’autres groupes de travail peuvent
        se prononcer par un vote interne pour l’autorisation des admins de pouvoir
        masquer des posts et envoyer un lien vers le vote réussi à ags.bezirke@foodsharing.network.
        Cette option n’est pas prévue pour les districts locaux.\n"
    polls:
      title: Votes
      md: "Le module de vote permet d’organiser des élections, des sondages et autres
        votes de manière anonyme et simple directement sur la plateforme foodsharing.
        Tu trouveras des instructions détaillées sur https://wiki.foodsharing.de/Abstimmungs-Modul\n"
    pollScopes:
      title: Droit de vote
      md: "Lors de la création d’un vote, tu peux choisir parmi différents groupes
        de personnes qui doivent avoir le droit de vote.\nToutes les possibilités
        de vote sont valables :\n- Non seulement tous les collecteur·ice·s du district/groupe
        peuvent voter, mais aussi ceux des sous-districts.\n- Le nombre de collecteur·ice·s
        ayant le droit de vote est indiqué entre parenthèses après le choix.\n- Dès
        que le vote est créé, les personnes ayant le droit de vote sont connues. Les
        personnes ayant le droit de vote sont celles qui font partie de ce groupe
        au moment où le vote est créé.\n"
    change_verified_data:
      title: Demander la modification des données vérifiées
      md: "Pour pouvoir être actif en tant que collecteur de denrées alimentaires,
        il est important que les données de ton profil soient correctes. Avant que
        tu puisses aller chercher des denrées alimentaires dans des entreprises, les
        ambassadeur·rice·s les comparent à ta carte d’identité. Tu ne peux donc pas
        modifier ton nom et ta date de naissance.\n---\nSi tu as besoin de modifier
        l’un de ces champs, tu peux t’adresser à un(e) ambassadeur·rice de ton quartier.
        Tu peux faire la modification pour toi. Tu peux voir qui est ambassadeur·rice
        dans ton district d’origine dans le [forum du district]({link}) dans la barre
        latérale gauche.\n"
    publicEvent:
      title: Événements publics
      md: "Les événements peuvent être enregistrés comme publics par les administrateur·rice·s
        d’un groupe de travail, les administrateur·rice·s du groupe de travail GOALS
        Relations publiques ou les ambassadeur·rice·s. Les événements publics sont
        accessibles à tous. Il n’est pas nécessaire d’être connecté à la plateforme
        pour voir le lieu de l’événement et les informations. Toutefois, le tableau
        d’affichage et la liste des participants ne sont accessibles qu’aux utilisateurs
        inscrits.\nInscris un événement comme public si tu veux inviter des personnes
        extérieures à ta communauté foodsharing locale et que tout le monde peut venir.\n"
    pickupOptions:
      title: Possibilités de collecte
      md: "Le domaine *Possibilités de collecte* te donne un aperçu de tous les collectes
        à venir dans tes établissements, pour lesquels des ramasseur·euse·s sont encore
        recherchés. Tu peux adapter l’affichage à tes besoins via le menu d’options :\n\
        \n**Collectes inscrites:** Pour que tu puisses mieux planifier tes collectes,
        tu peux aussi afficher les collectes pour lesquelles tu es déjà inscrit. Ces
        enlèvements sont affichés en couleur plus pâle, afin que tu puisses les reconnaître
        d’un coup d’œil.\n\n**Vue RC:** Les responsables des coopérations (RC) veillent
        à ce que tous les ramassages aient lieu de manière fiable dans leurs entreprises.
        Si tu es RC, tu peux limiter la vue aux établissements dont tu es responsable.
        Tu garderas ainsi plus facilement une vue d’ensemble.\n\n**Groupé par jour:**
        Dans cette représentation, tes possibilités de collecte sont regroupées par
        jour et présentées de manière un peu plus compacte. Si tu as beaucoup de possibilités
        de ramassage par jour, il est plus facile d’avoir une vue d’ensemble.\n"

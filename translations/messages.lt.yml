  plural: Viktorinos
  button:
    pause: Tęsti vėliau
    finish: Užpildykite testą
  title:
    start: '{name} – Atlikite testą dabar!'
    continue: '{name} – Tęskite testą!'
    pause: Mokymosi pertrauka ({name})
    finished: '{name} – Išlaikėte!'
    disqualified: '{name} – Deja, diskvalifikuotas.'
  startmodal:
    title: Pastabos apie testą
    infos:
      pause: Testą galite pristabdyti po kiekvieno klausimo ir tęsti vėliau.
      feedback: Testo pabaigoje gausite iš karto įvertinimą, kuriame bus nurodyta,
        ar išlaikėte ir kokias klaidas padarėte. Čia galite dar kartą perskaityti
        priežastis, kada jums patogu.
      limited_tries: Testo negalima kartoti tiek kartų, kiek norite. Po trijų bandymų
        turite padaryti 30 dienų mokymosi pertrauką, po kurios galite bandyti tik
        dar du kartus. Kiekviename teste užduodami skirtingi klausimai.
      alone: Testą turite atlikti patys ir be jokios pašalinės pagalbos. Jei turite
        kalbos sunkumų arba jums reikia pagalbos, kitas asmuo, žinoma, gali padėti
        jums suprasti klausimus, Tačiau jūs turite mokėti į juos atsakyti patys. Todėl
        susiraskite ramią vietą, kurioje galėtumėte netrukdomi atlikti testą.
      multiple_choice: Į kiekvieną klausimą gali būti keli teisingi atsakymai arba
        nė vieno. Todėl kiekvieną atsakymą atskirai nuspręskite, ar jis teisingas,
        ar neteisingas.
      unlimited_tries: Šį testą galite kartoti tiek kartų, kiek norite, ir niekada
        nebūsite diskvalifikuoti už nesėkmingus bandymus. Tačiau tarp bandymų gali
        tekti padaryti mokymosi pertrauką .
      read_carefully: Atidžiai perskaitykite visus klausimus ir atsakymus.
      comment: Atsakę į kiekvieną klausimą, pamatysite tarpinį vertinimą su kiekvieno
        atsakymo varianto paaiškinimais. Tai padeda suprasti, kuris atsakymas yra
        teisingas, o kuris – neteisingas ir kodėl. Prie kiekvienos klaidos reikia
        atidžiai perskaityti paaiškinimus. Jei kas nors jums atrodo nelogiška, nesuprantama
        ar net neteisinga, palikite komentarą. Jūsų komentarai gali būti priskirti
        jums, kad galėtumėte gauti individualų atsiliepimą.
      wiki: Prašau nepradėti testo spontaniškai. Prieš tai atidžiai perskaitykite
        informacinius puslapius. Be žinių iš Wiki neišlaikysite testo.
      real_life_examples: Dauguma klausimų yra pagrįsti tikrais atvejais iš gyvenimo
        dalijantis maistu.
      timed: Laikas atsakyti į klausimus yra ribotas. Neleisk, kad taikeltų tau stresą.
        Laikas kiekvienam klausimui skiriamas individualiai, kad turėtumėte pakankamai
        laiko ramiai į jį atsakyti. Jei kada nors pritrūksite laiko, praneškite apie
        tai testo administratoriams komentare.
    privacyNotice:
      hygiene: Jei išlaikysite šį testą, bus užfiksuotas Jūsų sėkmės laikas ir Jums
        bus įteiktas higienos lipdukas. Higienos ir operacijų vadovai gali patikrinti,
        ar turite galiojantį higienos lipduką.
    acceptPrivacyNotice: Sutinku.
  stateBasedInfo:
    pauseElapsed: Jūsų mokymosi pertrauka baigėsi. Dabar galite vėl dalyvauti teste.
      Tikimės, kad per šį laiką gerai susipažinote su turiniu.
    neverTried: Šio testo dar nesate užbaigę. Skirkite šiek tiek laiko atidžiai perskaityti
      visus pateiktus informacinius straipsnius, kad gerai pasiruoštum atsakyti į
      klausimus.
    waitAfter: Jei kitą kartą neišlaikysite, turėsite daryti {waitTimeAfterFailure}
      dienų pertrauką mokymuisi. Būtinai peržiūrėkite atitinkamus informacinius straipsnius,
      kad galėtumėte išlaikyti testą.
    running: Jūs jau pradėjotei testą ir iki šiol atsakėteį {questionsAnswered} iš
      {questionCount} klausimų.
    disqualifiedAfter: Jums liko tik paskutinis bandymas išlaikyti šį testą! Jei dabar
      neišlaikysite, būsite visam laikui diskvalifikuotas iš šio testo. Prašome dalyvauti
      tik tada, kai išsamiai susipažinote su visais informacijos šaltiniais Wiki.
    disqualified: Deja, Jūs esate diskvalifikuotas iš šio testo, nes per daug kartų
      jo neišlaikėte.
    passedBefore: Šį testą Jūs jau esate išlaikęs.
    willExpire: Tačiau Jūsų išlaikyto testo galiojimas baigsis po {expirationTime}
      dienų. Todėl jau dabar galite atnaujinti savo žinias šioje srityje ir vėl dalyvauti
      šiame teste.
    expired: Tačiau Jūsų paskutinis testo bandymas nebegalioja.
    pause: Šio testo Jūs jau kelis kartus neišlaikėte. Patikimumas, taisyklių tvirtas
      išmanymas ir profesionalus elgesys foodsharing platformoje yra būtini. Deja,
      Jūsų atsakymai šiuo metu to neparodo. Todėl gaunate mokymosi pertrauką, kol
      vėl galėsite mėginti išlaikyti testą. Jūsų pertrauka baigsis po {currentWaitTime}
      dienų.
    passed: Jūs išlaikėte šį testą.
    failed: Paskutiniu bandymu, deja, šio testo neišlaikėte.
    noWaitAfter: Dar kartą peržiūrėkite atitinkamus informacinius straipsnius ir pabandykte
      dar kartą.

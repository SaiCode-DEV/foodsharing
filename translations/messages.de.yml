    title: "Zwei-Faktor-Authentisierung aktivieren"
    tutorial: "Die Verwendung von Zwei-Faktor-Authentisierung erhöht die Sicherheit deines Accounts. Du wirst mit aktivierter Zwei-Faktor-Authentisierung bei jedem Login zusätzlich zur Eingabe deines Passworts einen Code eingeben müssen. Diesen kannst du über eine Authentisierungs-App erhalten. Zusätzlich werden dir sogenannte \"Backup-Codes\" angezeigt, die du sicher aufbewahren solltest, um im Notfall (z.B. bei Verlust des Smartphones) dennoch Zugriff auf deinen Account zu erhalten."
    explanation: "Die Zwei-Faktor-Authentisierung ist optional, wird aber von führenden Sicherheitsexperten sowie dem Bundesamt für Sicherheit in der Informationstechnik (BSI) wo immer möglich empfohlen."
    further_info: "Weitere Informationen zur Zwei-Faktor-Authentisierung sowie ein kurzes Erklärvideo findest du z.B. [auf der Webseite des BSI](https://www.bsi.bund.de/dok/509176)."

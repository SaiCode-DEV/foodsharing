    export_tooltip: "Du kannst deine Abholtermine mit einem Kalenderprogramm deiner Wahl abonnieren."

    delete_token:
      button: Token löschen
      message: Alle bislang erzeugten Kalender-Links werden hierdurch ungültig. Möchtest du das Token wirklich löschen?

help:
  helpTitle: "Hilfe: {title}"
  tooltip: "Hilfe anzeigen"
  key:
    storeLog:
      title: "Betriebsprotokoll"
      md: |
        Das Betriebsprotokoll ist eine Möglichkeit, die **Aktivitäten in einem Betrieb nachzuvollziehen**. Es kann dabei helfen, Konflikte zu lösen oder versehentliche Fehler zu korrigieren.
        ---
        ###### Beispiel
        Angenommen, du willst wissen, wer in den letzten 3 Wochen von wem ins Team aufgenommen wurde. Dann kannst du den Zeitraum mittels Start- und Enddatum über die beiden Datums-Felder festlegen. Als nächstes kannst du aus dem Dropdown alle relevanten Aktionstypen auswählen. In diesem Fall zum Beispiel "*Beitrittsanfragen stellen*", "*Beitrittsanfragen annehmen*" und "*Beitrittsanfragen ablehnen*". Wenn du nun auf den Button "*Ausgewählte Aktionen anzeigen*" klickst, wird dir eine Historie der ausgewählten Ereignisse angezeigt.
        ---
        ###### Zugriff
        Zugriff darauf hat nur, wer auch den Betrieb administrieren kann. Für normale Foodsaver und Springer:innen ist das Betriebsprotokoll nicht einsehbar.
        ---
        ###### Einschränkungen
        Es werden maximal 100 Einträge geladen. Ggf. musst du den Suchzeitraum oder die ausgewählten Aktionstypen einschränken, wenn nicht alle Ergebnisse angezeigt werden.
    threadPriority:
      title: "Anzeigepriorität in Foren"
      md: |
        Themen werden sortiert nach ihrer Anzeigepriorität aufgelistet. Themen mit gleicher Priorität werden nach dem Zeitpunkt der letzten Aktivität sortiert.
        ---
        Angepinnte Threads haben eine Priorität von 1, normale Threads die Priorität 0. Um die angezeigten Threads genauer sortieren zu können, kannst du hier aber auch höhere Werte festlegen, sodass Themen unabhängig vom Änderungsdatum immer ganz oben stehen.
        Threads mit Priorität -1 werden unter allen anderen Threads angezeigt.
    basket:
      title: "Essenskörbe"
      md: |
        Essenskörbe werden von Nutzer:innen angeboten, die (oftmals gerettete) Lebensmittel **kostenlos** weitergeben möchten. Angemeldete Nutzer:innen können einen Essenskorb anfragen, um diesen abzuholen.
    masterRegion:
      title: "Masterbezirk"
      md: |
        Wenn Bezirke einen Masterbezirk haben, werden alle Mitglieder des Bezirks automatisch auch in den Masterbezirk aufgenommen. In vielen Fällen ist es sinnvoll, den Elternbezirk als Master zu wählen, aber auch andere Anwendungen sind möglich. Ist der Masterbezirk nicht der Elternbezirk, werden Nutzer:innen im Bezirk **nicht** automatisch in den Elternbezirk aufgenommen.

        Wenn du nicht möchtest, dass Nutzer:innen automatisch in einen anderen Bezirk aufgenommen werden, setze den Master auf Root.
        ---
        Die Aufnahme in den Master-Bezirk passiert einmalig jede Nacht. Änderungen treten hier also nicht sofort ein.
    profileCommitmentsStat:
      title: "Engagementstatistik"
      md: ist sichtbar ab der Rolle des Betriebsverantwortlichen. Sie wird eingeschränkt auf gemeinsamen Stammbezirk oder gemeinsame Betriebe.
    moderatorForumHide:
      title:  Ausblenden in Foren durch Moderator:innen
      md: |
        ###### Wer ist Moderator:in?
        Die Moderator:innen einer Gruppe bzw. eines Bezirks sind üblicherweise die Administrator:innen bzw. BOTs. Sollte es in einem Bezirk eine GOALS-AG *Moderation* geben, kommt den Administrator:innen dieser Gruppe die Rolle der Moderator:innen zu.
        ---
        ###### Ausblenden in Foren
        Wenn diese Option aktiviert ist, können die Moderator:innen alle Posts im Forum ausblenden, nicht nur ihre eigenen. Dazu müssen sie eine Begründung angeben, warum sie einen Post bzw. ganzen Thread ausblenden möchten. Danach bleibt ein Post für drei weitere Monate für die Moderator:innen zugänglich und kann in dieser Zeit auch wiederhergestellt werden. Andere Nutzer:innen (ohne Orgarechte) haben keinen Zuriff mehr darauf. Nach diesen drei Monaten kann ein ausgeblendeter Post nicht mehr wiederhergestellt werden und wird endgültig aus der Datenbank gelöscht.
        ---
        ###### Wo kann diese Option genutzt werden?
        In lokalen Meldegruppen und Schiedsstellen (GOALS AGs) ist diese Funktion aus Datenschutzgründen notwendig.
        Andere Arbeitsgruppen können sich mit einer internen Abstimmung für die Berechtigung der Admins ausspechen, Posts ausblenden zu können, und einen Link zur erfolgreichen Abstimmung an ags.bezirke@foodsharing.network senden. Für lokale Bezirke ist diese Option nicht vorgesehen.
    reportReasons:
      title: Meldungsformular
      md: |
        Über das Meldungsformular können Foodsaver:innen Regelverletzungen direkt melden. Durch die Aktivierung erhalten die für Meldungen verantwortlichen Personen schnell und einfach Benachrichtigungen für auf diese Weise abgegebene Meldungen.
        ---
        Die LMG des Bezirks kann einstellen, welche Meldungsgründe im Meldungsformular angezeigt werden.
        Dabei kann zwischen vereinfachten und ausführlichen Meldungsgründen gewählt werden. Bei den ausführlichen Meldungsgründen sind alle [hier im Wiki unter B](https://wiki.foodsharing.de/Verhaltensregeln#B.29_Verhalten_bei_Abholungen) aufgelisteten Regeln enthalten.
        Darüber hinaus kann ausgewählt werden, ob die Option „Sonstiges“ als weiterer Meldungsgrund aufgelistet werden soll.
        ---
        Empfehlungen zur Einstellung können an die LMG gegeben werden. Die Entscheidung sowie die Verantwortung über diese Einstellung liegt aber allein bei den Administrator:innen der lokalen Meldungsgruppe, die diesen Empfehlungen nicht folgen *muss*.
    report:
      title: "Meldungsbearbeitung"
      md: |
        Hier werden dir Meldungen angezeigt, die über Personen mit diesem Stammbezirk verfasst wurden. Dabei werden dir allerdings nicht alle Meldungen angezeigt:
        - Grundsätzlich werden dir keine Meldungen angezeigt, an denen du oder deine Mit-Admins aus LMG oder LS beteiligt sind.
        - Als Admin der LS hast du nur Zugriff auf Meldungen, an denen die Admins der LMG beteiligt sind.
        ---
        Hinweise zur Bearbeitung einer Meldung könnt ihr hier nachlesen: [Bearbeitung einer Meldung](https://wiki.foodsharing.de/Regelverletzungen_-_Konsequenzen_und_Bearbeitung#D.29_Bearbeitung_einer_Meldung)
    achievements:
      title: "Sticker"
      md: |
        Das Stickersystem kann genutzt werden, um nutzerspezifische Eigenschaften zu markieren, wie beispielsweise die Teilnahme an bestimmten Schulungen. Sticker können beliebig lange gültig sein, oder ein Enddatum haben, ab dem sie ungültig sind.
    achievementIcon:
      title: "Icons für Sticker"
      md: |
        Jeder Sticker hat ein Icon, also eine kleine Grafik, die auf den ersten Blick zeigen soll, worum es geht. Eine Liste der verfügbaren Icons findest du unter https://fontawesome.com/v5/search?o=r&m=free&s=solid.

        In das Eingabefeld musst du den Namen des Icons eingeben, das du nutzen möchtest, also bspw. „*walking*“ oder „*shopping-cart*“.
        Ob deine Eingabe funktioniert, kannst du anhand der Vorschau überprüfen.
        Wenn du kein Icon eingibst, wird automatisch das Standard-Icon für Sticker „*tag*“ genutzt.
    achievementVisibility:
      title: "Sichtbarkeit von Stickern"
      md: |
        Die Sichtbarkeit eines Stickers bestimmt, wer sehen kann, ob der Sticker an jemanden vergeben wurde. Folgende Optionen stehen zur Verfügung:

        - **Versteckt:** Der Sticker ist nur für Nutzer:innen mit Orga-Rechten sichtbar.
        hidden: "Wird niemandem angezeigt"
        - **Privat:** Nur die betreffende Person selbst sowie Admins und Botschafter:innen des angegebenen Geltungsbereichs sehen den Sticker.
        - **Nur Betriebsverantwortliche:** Der Sticker wird der Person selbst sowie allen Betriebsverantwortlichen im gewählten Bereich angezeigt.
        - **Im Gültigkeitsbereich:** Der Sticker ist für alle Nutzer:innen sichtbar, die Mitglied des angegebenen Bezirks sind.
        - **Global:** Der Sticker ist für alle registrierten Nutzer:innen sichtbar.

        Überlege bitte immer, wie weit die Sichtbarkeit eingeschränkt werden kann, um personenbezogene Informationen nicht unnötig sichtbar zu machen. Die Sichtbarkeitsstufe kann nachträglich angepasst werden.
    achievementDuplicateMode:
      title: "Mehrfachvergabe von Stickern"
      md: |
        Sticker können als Markierung in sehr unterschiedlichen Sachverhalten dienen. Daher kann eingestellt werden, ob der Sticker mehrfach gleichzeitig an die selbe Person vergeben werden kann.
        
        - **Überschreiben:** Man kann den Sticker nicht mehrfach gleichzeitig erhalten. Wenn der Sticker erneut vergeben wird, ersetzt bzw. verlängert die aktuelle Vergabe die vorherige. Dies wird bspw. für die Hygieneschulung genutzt. Wer die Schlung erneuert, deren Sticker wird einfach nur verlängert. Wähle *Überschreiben*, wenn der Sticker einen aktuellen, eindeutigen Zustand markieren soll.
        - **Mehrfach vergeben:** Mehrere Vergaben sind gleichzeitig möglich. Mehrfach vergebene Sticker werden im Profil gruppiert angezeigt, alle entsprechenden Infos sind aber zugänglich. Hiermit könnten bspw. Probeabholungen dokumentiert werden, von denen mehrere nötig sind. Wähle *Mehrfach vergeben*, wenn jede einzelne Vergabe wichtig ist und nachvollziehbar bleiben muss.

    polls:
      title: "Abstimmungen"
      md: |
        Mithilfe des Abstimmungsmoduls können Wahlen, Umfragen und andere Abstimmungen anonym und einfach direkt auf der foodsharing-Plattform durchgeführt werden. Eine detaillierte Anleitung findest du unter https://wiki.foodsharing.de/Abstimmungs-Modul
    pollScopes:
      title: Wahlberechtigung
      md: |
        Bei der Erstellung einer Abstimmung kannst du aus verschiedenen Personengruppen auswählen, die stimmberechtigt sein sollen.
        Bei allen Wahlmöglichkeiten gilt:
        - Es dürfen nicht nur alle Foodsaver:innen des Bezirks / der Gruppe abstimmen, sondern auch der Unterbezirke.
        - Die Anzahl der stimmberechtigten Foodsaver:innen steht in Klammern hinter der Auswahlmöglichkeit.
        - Sobald die Abstimmung erstellt ist, stehen die Stimmberechtigten fest. Stimmberechtigt ist, wer zum Zeitpunkt, zu dem die Abstimmung erstellt wird, in den entsprechenden Personenkreis fällt.
    hygieneRequirement:
      title: "Hygieneanforderung für Betriebe"
      md: |
        Für die Mitarbeit in manchen Betrieben müssen Foodsaver:innen in Lebensmittelhygiene geschult sein. Wenn diese Funktion für einen Betrieb aktiviert ist, hat das folgende Auswirkungen:
        1. Foodsaver:innen ohne gültige Hygieneschulung können sich nicht für das Betriebsteam bewerben.
        2. Foodsaver:innen, die bereits Teil des Teams sind, können sich nur in Slots eintragen, zu deren Zeitpunkt ihre Hygieneschulung noch gültig ist.

        In beiden Fällen wird ein Hinweis angezeigt, der erklärt, dass für diese Aktion die Hygieneschulung fehlt. Außerdem ist die Hygieneschulung jeweils direkt verlinkt.

        ---

        Wichtig zu beachten: Diese Funktion basiert nur auf den foodsharing-eigenen Hygiene-Stickern. Weder im Profil hochgeladene Hygienezertifikate externer Anbieter (wie bspw. Metro), noch anderweitig erworbene Hygieneschulungen werden technisch berücksichtigt.
    publicEvent:
      title: "Öffentliche Veranstaltungen"
      md: |
        Veranstaltungen können von Admins einer Arbeitsgruppe oder den Admins der GOALS-AG Öffentlichkeitsarbeit bzw. den Botschafter:innen als öffentlich eingetragen werden. Öffentliche Veranstaltungen sind für alle zugänglich. Man muss nicht auf der Plattform angemeldet sein, um den Veranstaltungsort und die Informationen einzusehen. Pinnwand und Teilnehmer:innenliste sind allerdings nur für angemeldete Nutzer:innen zugänglich.
        Trage eine Veranstaltung als öffentlich ein, wenn du auch außerhalb deiner lokalen foodsharing Community dazu einladen möchtest, und alle kommen dürfen.
    change_verified_data:
      title: Änderung verifizierter Daten beantragen
      md: |
        Um als Foodsaver tätig zu sein, ist es wichtig, dass die Daten in deinem Profil korrekt sind. Bevor du Lebensmittel retten darfst, werden sie dazu von den Botschafter:innen mit deinem Ausweis abgeglichen. Daher kannst du deinen Namen und dein Geburtsdatum nicht einfach ändern.
        ---
        Sollte es doch mal vorkommen, dass eines dieser Felder geändert werden muss, kannst du dich hierzu an eine:n Botschafter:in aus deinem Stammbezirk wenden. Sie können die entsprechende Änderung für dich durchführen. Wer Botschafter:in in deinem Stammbezirk ist, siehst du im [Forum des Bezirks]({link}) in der linken Seitenleiste.
    pickupOptions:
      title: "Eintragungsmöglichkeiten"
      md: |
        Der Bereich *Eintragungsmöglichkeiten* zeigt dir eine Übersicht über alle kommenden Slots in deinen Betrieben, bei denen noch Foodsaver:innen gesucht werden. Über das Optionsmenü kannst du die Ansicht an deine Bedürfnisse anpassen:

        **Eingetragene Slots:** Damit du deine Slots besser planen kannst, kannst du dir auch die Slots anzeigen lassen, bei denen du selbst bereits eingetragen bist. Diese Slots werden etwas blasser dargestellt, damit du sie auf einen Blick erkennen kannst.

        **BV-Ansicht:** Betriebsverantwortliche (BV) kümmern sich darum, dass in ihren Betrieben alle Slots zuverlässig stattfinden. Wenn du BV bist, kannst du die Ansicht auf die Betriebe einschränken, für die du zuständig bist. So behältst du leichter den Überblick.
        **Gruppiert nach Tagen:** In dieser Darstellung werden deine Eintragungsmöglichkeiten nach Tagen zusammengefasst und etwas kompakter dargestellt. Gerade, wenn dir pro Tag viele Eintragungsmöglichkeiten zur Verfügung stehen, macht es das leichter, einen Überblick zu bekommen.
    resource_mosaic:
      title: "Ressourcen-Mosaik"
      md: |
        ##### Die Idee
        Beim Retten von Lebensmitteln teilen wir alle sehr effektiv unsere Zeit, Transportkapazitäten und Erfahrung. Doch um neue Impulse für ein nachhaltiges Ernährungssystem zu setzen und die foodsharing-Bewegung langfristig zu stärken, braucht es mehr als nur das Retten. Jede:r von uns bringt unterschiedliche Ressourcen, also *Fähigkeiten*, *Gegenstände* oder *Kontakte* mit, die allein oft verborgen und ungenutzt bleiben. Gemeinsam aber können diese Ressourcen sichtbar und nutzbar werden – wie einzelne Teile eines Mosaiks, die zusammen ein großes Bild ergeben. Das Ressourcen-Mosaik kann diese Vielfalt sichtbar machen. Damit schafft es Raum für neue Projektideen, Zusammenarbeit und gegenseitige Unterstützung über das Retten hinaus.

        ##### Die Ressourcenübersicht
        Das Herzstück des Ressourcen-Mosaiks ist die Übersicht über alle Ressourcen des Bezirks bzw. der Arbeitsgruppe. Du kannst dich entweder einfach von der Vielfalt deiner Gruppe inspirieren lassen, oder nach bestimmten Ressourcen suchen. Du kannst jede Ressource anklicken, um weitere Infos darüber zu erhalten. Du kannst Ressourcen auch als Favorit zu speichern, um sie später leicher wiederzufinden.

        An der Farbe einer Ressource kannst du erkennen, wie gerne die Person sie teilt: Ressourcen, die mit viel Freude angeboten werden, erscheinen in kräftigen, leuchtenden Farben, während weniger gern geteilte Ressourcen eher grau dargestellt sind.

        ##### Suchen, Filtern & Sortieren
        Um schnell passende Ressourcen zu finden, stehen dir verschiedene Filtermöglichkeiten zur Verfügung.
        - Du kannst gezielt nach **Kategorien** filtern oder direkt nach bestimmten **Begriffen suchen**.
        - **Nur aktive Nutzer:innen** blendet Ressourcen von Nutzer:innen aus, die sich in den letzten 30 Tagen nicht eingeloggt haben oder aktuell eine Schlafmütze aufhaben.
        - Im Ressourcen-Mosaik werden die Ressourcen aller Foodsaver:innen der Gruppe angezeigt. In Bezirken kannst du die Ansicht aber auch auf Nutzer:innen einschränken, deren **Stammbezirk** der jeweilige Bezirk ist.
        - Wenn du Ressourcen als **Favorit** markiert hast, kannst du dir gezielt nur diese anzeigen lassen.

        Zusätzlich kannst du die Ergebnisse **sortieren**, etwa nach „Freude über Anfragen“, Aktualität der Einträge oder einfach zufällig.

    my_resources:
      title: "Eigene Ressourcen"
      md: |
        In diesem Abschnitt kannst du deine eigenen Ressourcen verwalten; Neue Ressourcen anlegen, bearbeiten, löschen oder einfach nur einsehen, was du aktuell teilst.

        ##### Was ist eine Ressource?
        Eine Ressource kann alles sein, was du in der foodsharing-Community beitragen möchtest. Das können **Fähigkeiten** sein, zum Beispiel Kochen oder Programmieren, **Gegenstände** die du bereit wärst zu verleihen, wie ein Lastenrad oder eine mobile Kochstation, oder auch **Kontakte** zu anderen Initiativen, Behörden, Medien usw.

        ##### Alles kann, nichts muss
        Niemand muss Ressourcen eintragen, und nur weil du eine bestimmte Ressource eingetragen hast, heißt das nicht, dass du diese für bestimmte Aktionen zur Verfügung stellen *musst*. Viel mehr geht es darum, das zu teilen, womit du *gerne beitragen möchtest*.

        ##### Wer sieht meine Ressourcen?
        Ressourcen werden innerhalb deiner Bezirke und Arbeitsgruppen sichtbar. Ausgenommen sind davon aber die sehr großen Bezirke vom Typ Land oder Bundesland, in denen kein Ressourcen-Mosaik verfügbar ist. Du kannst die Sichtbarkeit jeder einzelnen Ressource aber auch auf die Foodsaver:innen beschränken, die du kennst.
    commons_resources:
      title: "Gemeinschaftsressourcen"
      md: |
        Manche Ressourcen gehören nicht einer einzelnen Person, sondern der Gemeinschaft.

        ##### Was sind Beispiele für Gemeinschaftsressourcen?
        Bei Gemeinschaftsressourcen handelt es sich meist um **Gegenstände**, **Informationen** oder **Kontakte**. Das könnte ein foodsharing Banner des Bezirks sein, ein Foto-Archiv in der Cloud oder der Kontakt zu externen Ansprechpersonen. Da für Gemeinschaftsressourcen nicht eine einzelne Person verantwortlich ist, sollte ggf. eine Kontaktmöglichkeit in der Beschreibung der Ressource eingetragen werden.

        ##### Wer verwaltet Gemeinschaftsressourcen?
        In Arbeitsgruppen können alle Admins Gemeinschaftsressourcen anlegen, bearbeiten und löschen. In Bezirken haben erstmal die Botschafter:innen diese Berechtigung. Falls es eine Ressourcen-AG gibt, liegt die Berechtigung stattdessen bei den Admins dieser AG.
    similar_resources:
      title: "Ähnliche Ressourcen"
      md: "Als ähnliche Ressourcen werden dir bis zu 10 weitere Ressourcen angezeigt, für welche die **gleichen Kategorien** eingetragen sind."
    store_chain_info:
      title: "Kettenbetriebe"
      md: |
        Dieser Betrieb gehört zu einer [Betriebskette](https://wiki.foodsharing.de/Betrieb#Betriebskette). Für alle Betriebsketten gibt es verantwortliche [KAMs](https://wiki.foodsharing.de/Key_Account_Manager_(KAM)), die die Möglichkeit haben in diesem Betrieb das Team sowie die Auslastung und Anzahl der Abholslots einzusehen.

team_page:
  board_member:
    title: "Vorstand"
    text: |
      Der Vorstand des foodsharing e. V. hält die Fäden zusammen, vernetzt Deutschland, Österreich und die Schweiz als Nutzer:innen der Plattform foodsharing.de und ist für überregionale Angelegenheiten zuständig. Der Vorstand arbeitet im Team sehr viel in engen Absprachen miteinander und hauptsächlich online zusammen, um alle Anliegen der großen foodsharing-Community und von Extern zu bekümmern. Darüber hinaus beschäftigt sich der Vorstand ausgiebig mit der Organisationsentwicklung und der politischen Dimension der Lebensmittelverschwendung.
  it_member:
    title: "IT-Team"
    text: |
      foodsharing ist nur dank dem Engagement tausender Ehrenamtlicher möglich! Hier stellen sich einige Menschen vor, die überregionale Arbeitsgruppen koordinieren, die Webseite entwickeln oder andere wichtige Aufgaben für ganz foodsharing übernehmen:
  alumni_member:
    title: "Ehemalige"
    text: |
      Gemeinsam blicken wir auf eine erfolgreiche Entstehungsgeschichte von foodsharing zurück. Wir möchten an dieser Stelle all den Menschen danken, die daran mitwirkten, indem sie zum Teil vollzeitehrenamtlich oder in einem sehr hohen Maße für das Orgateam oder den Vorstand aktiv waren!


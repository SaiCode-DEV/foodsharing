quiz:
  question: "Frage"
  plural: "Quizze"
  continuenow: "Quiz jetzt weiter beantworten!"
  timedstart: "Quiz mit Zeitlimit und {count} Fragen starten"
  regstart: "Quiz ohne Zeitlimit und {count} Fragen starten"
  button:
    pause: Später weitermachen
    finish: Quiz abschließen
  title:
    start: "{name} – Jetzt das Quiz durchführen!"
    continue: "{name} – Quiz fortführen!"
    pause: "Lernpause ({name})"
    disqualified: "{name} – Leider disqualifiziert."
    finished: "{name} – Du hast bestanden!"
  startmodal:
    title: "Hinweise zum Quiz"
    infos:
      wiki: Bitte starte das Quiz nicht auf gut Glück. Lies vorab die aufgeführten Info-Seiten aufmerksam durch. Ohne das Wissen aus dem Wiki wirst du das Quiz nicht bestehen.
      real_life_examples: Die meisten Fragen basieren auf echten Fällen aus dem foodsharing-Leben.
      limited_tries: Du kannst das Quiz nicht beliebig oft wiederholen. Nach drei Versuchen musst du eine 30-tägige Lernpause einlegen, danach hast du nur noch zwei weitere Versuche. Die Fragen, die dir in jedem Versuch gestellt werden, unterscheiden sich.
      unlimited_tries: Du kannst dieses Quiz beliebig oft wiederholen und wirst durch Fehlversuche nie disqualifiziert. Allerdings musst du zwischen Versuchen teilweise eine Lernpause einlegen.
      alone: Das Quiz ist von dir selbst und ohne fremde inhaltliche Hilfe zu bestehen. Bei sprachlichen Schwierigkeiten oder wenn du auf eine Assistenz angewiesen bist, kann dir eine andere Person natürlich helfen, die Fragen zu verstehen; beantworten können musst du sie allerdings alleine. Suche dir deswegen einen ruhigen Ort, an dem du ungestört das Quiz durchführen kannst.
      read_carefully: Lies dir alle Fragen und Antworten sorfältig durch.
      multiple_choice: Es können mehrere Antworten pro Frage richtig sein – oder auch keine. Entscheide daher für jede Antwort einzeln, ob sie richtig oder falsch ist.
      timed: Die Zeit zur Beantwortung der Fragen ist begrenzt. Lass dich davon nicht stressen. Die Zeit ist für jede Frage einzeln so eingestellt, dass du genug Zeit hast, die Frage in Ruhe zu beantworten. Solltest du doch mal in Zeitnot kommen, lass die Quiz-Admins das mit einem Kommentar wissen.
      comment: Nach dem Beantworten jeder Frage siehst du eine Zwischenauswertung mit Erklärungen zu jeder der Antwortmöglichkeiten. Das hilft zu verstehen, welche Antwort warum richtig oder falsch ist. Bei jedem Fehler solltest du dir die Erklärungen sorgfältig durchlesen. Wenn dir etwas unlogisch erscheint, nicht verständlich oder gar falsch ist, hinterlasse bitte einen Kommentar. Deine Kommentare können dir zugeordnet werden, um dir individuelle Rückmeldung zu geben.
      pause: Du kannst das Quiz nach jeder Frage pausieren und zu einem späteren Zeitpunkt fortsetzen.
      feedback: Am Ende des Quizzes bekommst du direkt eine Auswertung, ob du bestanden hast und welche Fehler du wo gemacht hast. Hier kannst du noch einmal in Ruhe die Begründungen durchlesen.
    privacyNotice:
      hygiene: Wenn du dieses Quiz bestehst, wird gespeichert, wann dir das gelungen ist, und dir wird ein Hygiene-Sticker vergeben. Hygiene- und Betriebsverantwortliche können sehen, ob du einen gültigen Hygiene-Sticker hast.
    acceptPrivacyNotice: Ich bin einverstanden.
  infomodal:
    title: "Frage {index} von {questions}"
  comment:
    toggle: Kommentar schreiben
    placeholder: Kommentar eingeben …
    send: Kommentar abschicken
    sent: Kommentar abgeschickt.
    info: Gib uns Feedback zu dieser Frage. War sie zu leicht, zu schwer, unverständlich? Oder sind einzelne Antworten beziehungsweise Erklärungen nicht richtig? # TODO use this
    wallTitle: "Kommentare zu Frage #{id}"
    label: Frage kommentieren
  answers:
    name: Antworten
    none_correct: Keine Antwort ist korrekt.
    neutral: Neutrale Antwort – wird nicht gewertet.
    false_false: Diese Antwort war falsch. Das hast du richtig erkannt.
    false_true: Diese Antwort wäre richtig gewesen.
    true_false: Falsch! Diese Antwort stimmt nicht.
    true_true: Richtig! Diese Antwort stimmt.
    timedOut:
      0: Diese Antwort wäre falsch gewesen.
      1: Diese Antwort wäre richtig gewesen.
      2: Diese Antwort wäre neutral gewesen.
    short:
      0: Falsch
      1: Richtig
      2: Neutral
  stateBasedInfo:
    neverTried: Dieses Quiz hast du noch nie absolviert. Nimm dir Zeit, alle aufgeführten Info-Artikel aufmerksam durchzulesen, damit du auf die Fragen vorbereitet bist.
    running: Du hast das Quiz bereits gestartet und bislang {questionsAnswered} von {questionCount} Fragen beantwortet.
    passed: Dieses Quiz hast du bestanden.
    failed: Beim letzten Versuch hast du dieses Quiz leider nicht bestanden.
    noWaitAfter: Schau dir nochmal die entsprechenden Info-Artikel an und versuche es noch einmal.
    waitAfter: Wenn du im nächsten Versuch nicht bestehst, musst du für {waitTimeAfterFailure} Tage eine Lernpause einlegen. Schau dir unbedingt die entsprechenden Info-Artikel an, damit du das Quiz bestehen kannst.
    pause: Du hast dieses Quiz mehrfach nicht bestanden. Zuverlässigkeit, sicheres Beherrschen der Regeln und professionelles Auftreten sind bei foodsharing unverzichtbar. Mit deinen Antworten vermittelst du das zum jetzigen Zeitpunkt leider nicht. Daher bekommst du eine Lernpause, bevor du erneut versuchen darfst, das Quiz zu bestehen. Deine Lernpause endet in {currentWaitTime} Tagen.
    pauseElapsed: Deine Lernpause ist um. Daher darfst du jetzt erneut am Quiz teilnehmen. Hoffentlich hast du die Zeit genutzt, um dich besser mit den Inhalten vertraut zu machen.
    disqualifiedAfter: Du hast nur noch einen letzten Versuch, dieses Quiz zu bestehen! Wenn du jetzt durchfällst, wirst du dauerhaft für dieses Quiz disqualifiziert. Bitte nimm nur teil, wenn du dich ausführlich mit den Inhalten aus dem Wiki beschäftigt hast.
    disqualified: Leider bist du für dieses Quiz disqualifiziert, da du zu oft nicht bestanden hast.
    passedBefore: Dieses Quiz hast du schon mal bestanden.
    willExpire: Allerdings endet die Gültigkeit deines bestandenen Quizversuchs in {expirationTime} Tagen. Du kannst daher schon jetzt dein Wissen in diesem Themenfeld auffrischen und erneut an diesem Quiz teinehmen.
    expired: Allerdings ist dein letzter Quizversuch nicht mehr gültig.
  results:
    title:
      1: "Herzlichen Glückwunsch!"
      2: "Du hast leider nicht bestanden."
    points:

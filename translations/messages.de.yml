    menu: "Kalender"
    export: "Kalender exportieren"
    export_tooltip: "Du kannst deine Abholtermine mit einem Kalenderprogramm deiner Wahl abonnieren."

    delete_token:
      button: Token löschen
      message: Alle bislang erzeugten Kalender-Links werden hierdurch ungültig. Möchtest du das Token wirklich löschen?
    generate_url:
      button: Kalender-URL generieren
    download: Kalender herunterladen

    info: |
      Hier kannst du deine foodsharing Termine mit einem Kalenderprogramm deiner Wahl verknüpfen. Damit können automatisch all deine Abholungen und/oder Termine in deinem Kalender eingetragen werden.

      **Halte Kalender-Links unbedingt geheim.** Sie enthalten ein *Token*, mit dem ohne Passwort auf die Daten deiner Abholungen zugegriffen werden kann. Du kannst dein aktuelles Token jederzeit löschen, womit früher erstellte Kalender-Links ungültig werden.

      Dein Kalenderprogramm muss diesen Kalender regelmäßig **synchronisieren**. Nur dann tauchen neue Abholtermine auf und abgesagte Termine nicht mehr. Wenn du stattdessen deinen aktuellen Kalender herunterlädst, enthält dieser nur deine jetzigen Termine und wird nicht automatisch aktualisiert.

      Weitere Informationen findest du [hier im Wiki]({calendarUrl})

startpage:
  welcome_text: "Willkommen bei foodsharing"
  slogan_1: "Gemeinsam für mehr Lebensmittelwertschätzung"
  slogan_2: "gemeinschaftlich, nachhaltig & wertschätzend"
  slogan_3: "foodsharing ist und bleibt kostenfrei."
  join: "Mitmachen"
  join_rules: "Mitmachen – Unsere Regeln"
  join_welcome: "Schön, dass du bei foodsharing mitmachen willst!" #ContentView
  respect: "Da Lebensmittel uns am Leben halten, wollen wir auch respektvoll mit ihnen umgehen. Damit bei uns alles optimal läuft, haben wir im Laufe der Jahre einige Verhaltensregeln definiert. Lebensmittel an andere weiterzugeben, ist eine sehr menschliche, aber auch verantwortungsvolle Sache. Grundsätzlich gilt immer: „Nichts an andere weitergeben, was man selbst nicht mehr essen würde“. Bitte lies nun die foodsharing-Etikette einmal durch!" #ContentView
  register: "Am Ende dieser Seite kannst du dich als Foodsharer:in registrieren." #ContentView
  forstores: "Für Unternehmen und Betriebe" #ContentView
  together: "Gemeinsam mit foodsharing können Sie sich dafür einsetzen, dass aussortierte und unverkäufliche Lebensmittel eine sinnvolle Verwendung erfahren, statt weggeworfen zu werden. Mehr Information dazu finden Sie [hier](/fuer-unternehmen)."
  honest: "Sei ehrlich" #ContentView
  telltruth: "Wir alle, die foodsharing entwickelt haben und die Webseite betreiben, nehmen unsere Aufgabe sehr ernst. Wir befolgen eine Reihe von Gesetzen und Auflagen. Sei auch du bitte ehrlich beim Ausfüllen deiner Daten und bei allen anderen Beiträgen, die du auf der Plattform machst, z. B. bei Essenskörben und Forumsbeiträgen." #ContentView
  followrules_title: "Beachte die Regeln und den Ratgeber für die Weitergabe von Lebensmitteln"
  followrules: |
    Wir weisen ausdrücklich darauf hin, dass wir das Anbieten und Teilen bestimmter Lebensmittel und anderer Waren aus
    rechtlichen Gründen nur unter bestimmten Auflagen gestatten. Das betrifft insbesondere leicht verderbliche Lebensmittel wie rohen Fisch, rohes Fleisch, rohe Eierspeisen und zubereitete Lebensmittel. Generell achten wir mit allen Sinnen darauf, dass die Lebensmittel noch genießbar sind. Alle Details dazu finden sich in den [foodsharing-Hygieneregeln](https://wiki.foodsharing.de/Hygieneregeln). Hinweise finden sich auch im [Ratgeber](https://wiki.foodsharing.de/Hygiene-Ratgeber_für_Lebensmittel).
  notallowed: "Die Weitergabe von Medikamenten (auch homöopathischen Mitteln) ist bei foodsharing ausgeschlossen. Auch Kleidung, Kosmetika, Haushaltschemie, Spielzeug und andere Non-Food-Produkte können über foodsharing nicht getauscht oder geteilt werden. Die Plattform foodsharing behält sich vor, derartige Angebote zu löschen." #ContentView
  beresponsible: "Sei verantwortungsvoll" #ContentView
  responsibility: "aller Lebensmittel landen im Müll. Damit soll nun endlich Schluss sein. Wir möchten nichts mehr wegwerfen! Wir wollen verantwortungsvoll mit Lebensmitteln umgehen und freuen uns, dass du mitmachst." #ContentView. Line starts with hardcoded: "30% " #ContentView
  bedependable: "Sei zuverlässig" #ContentView
  dependability: "Vielerorts gibt es Fairteiler, an denen Lebensmittel geteilt werden. Ihr könnt euch dort oder an anderen neutralen Orten zum Teilen treffen. Wenn ihr Lebensmittel abgeben oder erhalten wollt, seid bitte zuverlässig und pünktlich, lasst niemanden im „Regen“ stehen." #ContentView
  makeproposals: "Mach Vorschläge" #ContentView
  proposals: "Wir wollen uns weiterentwickeln, immer besser werden. Dazu brauchen wir euch mit vielen guten Ideen und Tipps. Die schickt ihr an [info@foodsharing.de](mailto:info@foodsharing.de)"
  etiquette: "foodsharing-Etikette"
  call_to_action_button: "Jetzt mitmachen"
  registernow: "Jetzt registrieren"
  more_infos: Erfahre mehr
  this_is_how_it_works: So funktioniert’s
  vision:
    title: "Vision"
    text: "Wir verstehen uns als umwelt- und bildungspolitische Bewegung, die sich gegen den achtlosen Umgang mit
     Ressourcen und für ein nachhaltiges Ernährungssystem einsetzt. Unser langfristiges Ziel ist es, die Verschwendung
     von genießbaren Lebensmitteln zu beenden. Darum werden wir vor Ort aktiv: Wir retten Lebensmittel in privaten
     Haushalten sowie von Betrieben, stehen im Dialog mit der Politik und tragen unsere Vision in die Welt hinaus."
  call_to_action:
    title: "Mach mit"
    text: "Wir entstanden 2012, mittlerweile sind wir eine internationale Bewegung mit über 500.000 Nutzer:innen
      in Deutschland, Österreich, der Schweiz und weiteren europäischen Ländern."
  member:
    title: "als Mitglied"
    text: "Teile deine überschüssigen Lebensmittel mit der foodsharing-Community oder rette Lebensmittel von Betrieben."
  private:
    title: "im Privaten"
    text: "Sag der Lebensmittelverschwendung in deinem Haushalt den Kampf an. Wir informieren auf Messen und bei Veranstaltungen wie."
  store:
    title: "als Betrieb"
    text: "Du arbeitest in einem Supermarkt, Restaurant, Kantine, …? Registriere deinen Betrieb und rette Lebensmittel."
  how_we_work:
    title: "So läuft’s"
    text: |
      Das alles entsteht ehrenamtlich und unentgeltlich, unabhängig und werbefrei. Die Plattform bildet das Herz
      unserer Gemeinschaft. Hier vernetzen und koordinieren wir uns lokal und europaweit. Die Website und Beta-App ist
      open source und basiert auf dem Engagement und Herzblut vieler. Wie du bei der IT mitmachen kannst?
  near_you:
    title: "In deiner Nähe"
    text1:
      part1: 'Auf der'
      part2: 'Karte'
      part3: 'findest du'
      part4: 'Fairteiler'
      part5: ', das sind Regale oder Kühlschränke, an denen du Lebensmittel kostenfrei abholen oder vorbeibringen kannst.'
    text2:
      part1: 'Außerdem gibt es'
      part2: 'Essenskörbe'
      part3: '– hiermit kannst du deine eigenen überschüssigen Lebensmittel anbieten und Lebensmittel bei anderen abholen.'
    text3:
      part1: 'Die Community ist in Bezirken organisiert.'
      part2: 'Finde Bezirke in deiner Umgebung'
  demands:
    title: Forderungen
    text: |
      Um die Lebensmittelverschwendung effektiv einzudämmen, braucht es mehr als das bloße Retten von übriggebliebenen
      Lebensmitteln aus Betrieben oder die Aufklärung von Konsument:innen. Stattdessen muss sich politisch etwas bewegen:
      Wir benötigen verbindliche Reduktionsziele für die Verschwendung entlang der gesamten Wertschöpfungskette.
      Außerdem müssen aktuell bestehende Handelsnormen überdacht und gelockert werden sowie Organisationen, die
      Lebensmittel retten oder Bildung rund um das Thema Ernährung anbieten, gestärkt werden.
  towns:
    title: foodsharing-Städte
    text: |
      Teilnehmende Städte unterscheiden sich dahingehend, ob sich diese noch auf dem Weg befinden oder bereits
      als foodsharing-Stadt ausgezeichnet wurden. Letzteres ist der Fall, wenn es neben einem foodsharing-Team vor Ort
      auch eine von der Stadtverwaltung unterschriebene Motivationserklärung als Symbol der Partnerschaft zwischen
      foodsharing und der öffentlichen Hand gibt.
  donate:
    title: Spenden
    text: |
      Wir bemühen uns für jegliche Ausgaben um Sponsoring. In manchen Fällen gelingt dies jedoch nicht oder nicht
      vollständig, etwa bei Ausgaben für die Finanzierung von Veranstaltungen, Rechtsberatung oder Versicherungen.
      Wir freuen uns über jede Unterstützung.
    link: foodsharing unterstützen


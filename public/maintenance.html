        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f6f5f4;
        }

        .container {
            max-width: 800px;
            color: #28460e;
            font-family: "Alfa Slab One", arial, sans-serif;
            width: 100%;
            margin: 0 auto;
            display: flow;
        }

        a {
            color: #28460e;
        }

        .image img {
            margin: 0 auto;
            display: block;
        }

        .message {
            text-align: center;
            padding: 80px 40px 0 20px;
        }

        @media (max-width: 600px) {
            .container {
                display: block;
            }

            .image img {
                width: 70%;
            }

            .message {
                padding-top: 20px;
            }
        }

        .message h2 {
            font-size: 36px;
            font-weight: normal;
        }

        .message h3 {
            font-size: 22px;
            font-weight: normal;
        }

        .rounded-box {
            border: 2px solid #333;
            padding: 20px;
            margin-top: 15px;
        }

    </style>

# expose, ports are additive, means each environment requires a own port mapping instead of a global one.
services:
  nginx:
    container_name: foodsharing_test_nginx
    ports:
      - "28080:8080"

  # Customized PHP
  #------------------------------------
  app:
    container_name: foodsharing_test_app
    environment:
      FS_ENV: test
    ports:
      - "29000:9000"

  # Webpack client
  #------------------------------------
  client:
    container_name: foodsharing_test_client
    command: sh -c "yarn && yarn dev"
    ports:
      - "28090:8082"

  # PHP mail queue runner
  #------------------------------------
  mailqueuerunner:
    container_name: foodsharing_test_mailqueuerunner
    environment:
      FS_ENV: test

  # Socket.io server
  #------------------------------------
  websocket:
    container_name: foodsharing_test_websocket
    ports:
      - "21337:1337"
      - "21338:1338"

  # mysql
  #------------------------------------
  db:
    container_name: foodsharing_test_db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "23306:3306"

  redis:
    container_name: foodsharing_test_redis

  phpmyadmin:
    container_name: foodsharing_test_phpmyadmin
    ports:
      - "28081:80"
      
  maildev:
    container_name: foodsharing_test_maildev
    ports:
      - "28084:1080"

  # docs
  # A plattform for the developer documentations
  #------------------------------------
  docs:
    container_name: foodsharing_test_docs
    command: sh -c "yarn && yarn docs:build && yarn docs:preview"
    ports:
      - "26000:3000"

  # selenium
  # for running browser-based tests
  #------------------------------------
  selenium:
    user: ${CURRENT_USER}
    container_name: foodsharing_test_selenium
    image: registry.gitlab.com/foodsharing-dev/images/selenium:latest
    shm_size: 2gb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - nginx
    volumes:
      - selenium_downloads:/home/seluser/Downloads:cached

  # E2E Tests with Playwright (Test Environment)
  #------------------------------------
  e2e:
    user: ${CURRENT_USER}
    container_name: foodsharing_test_e2e
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    working_dir: /app/tests/e2e
    # Keep container running for on-demand test execution via docker-compose exec
    command: sh -c "mkdir -p /app/cache/e2e-home && tail -f /dev/null"
    depends_on:
      - nginx
      - db
      - websocket
    volumes:
      - ../:/app:delegated
    environment:
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - HOME=/app/cache/e2e-home
      - YARN_CACHE_FOLDER=/app/cache/yarn
    ports:
      - "29323:9323"
      - "23008:3008"

# Volumes for test environment
volumes:
  selenium_downloads:

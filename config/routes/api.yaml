messages:
  type: attribute
  prefix: /api
  resource:
    path: ../../src/RestApi/
    namespace: Foodsharing\RestApi
  defaults: {_format: json}

app.swagger_ui:
  path: /api/doc
  methods: GET
  defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

app.swagger:
  path: /api/doc.json
  methods: GET
  defaults: { _controller: nelmio_api_doc.controller.swagger }

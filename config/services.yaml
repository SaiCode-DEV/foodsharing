# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: true
        bind:
          string $siteEnvironment: !php/const SITE_ENVIRONMENT

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name

    Foodsharing\Modules\Unit\CurrentUserUnitsInterface:  '@Foodsharing\Modules\Unit\CurrentUserUnitsSessionTransactions'

    Foodsharing\:
        resource: '../src/*'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Lib/{Caching.php,View/v*}'
            - '../src/Dev'
            - '../src/Kernel.php'
            - '../src/Modules/{PushNotification/Notification,Foodsaver/Profile.php,Message/Message.php}'
            - '../src/RestApi/Models/'
            - '../src/Modules/Foodsaver/UnitMember.php'
            - '../src/Modules/Foodsaver/UnitMemberForAdmin.php'
            - '../src/Modules/OAuth/Grant/'
            - '../src/Modules/OAuth/Entity/'
            - '../src/Modules/OAuth/OIDCBearerTokenResponse.php'
            - '../src/**/DTO/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # still needed for RenderControllerSetupSubscriber
    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'

    Foodsharing\Lib\Session:
        calls:
        - [initIfCookieExists]

    markdown.nohtml:
        class: Parsedown
        calls:
            - ['setSafeMode', [true]]
            - ['setMarkupEscaped', [false]]
            - ['setBreaksEnabled', [true]]

    Parsedown: '@markdown.nohtml'

    HTMLPurifier: '@exercise_html_purifier.default'

    BounceMailHandler\BounceMailHandler:
        properties:
            mailhost: !php/const BOUNCE_IMAP_HOST
            mailboxUserName: !php/const BOUNCE_IMAP_USER
            mailboxPassword: !php/const BOUNCE_IMAP_PASS
            port: !php/const BOUNCE_IMAP_PORT
            service: 'imap'
            serviceOption: !php/const BOUNCE_IMAP_SERVICE_OPTION
            boxname: 'INBOX'
            unprocessedBox: !php/const BOUNCE_IMAP_UNPROCESSED_BOX
            maxMessages: 10000
            verbose: 0

    Twig\Extra\Intl\IntlExtension: ~

    GuzzleHttp\Client:

    Foodsharing\Lib\BigBlueButton:
        bind:
            $url: !php/const BBB_DOMAIN
            $secret: !php/const BBB_SECRET
            $dialin: !php/const BBB_DIALIN

    Foodsharing\RestApi\StoreRestController:
        arguments:
            $locationChangeLimiterFactory: '@limiter.storeLocationChange'

    # PSR-7 HTTP Message Bridge for OAuth
    Symfony\Bridge\PsrHttpMessage\HttpMessageFactoryInterface:
        class: Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory
        arguments:
            - '@Psr\Http\Message\ServerRequestFactoryInterface'
            - '@Psr\Http\Message\StreamFactoryInterface'
            - '@Psr\Http\Message\UploadedFileFactoryInterface'
            - '@Psr\Http\Message\ResponseFactoryInterface'

    Symfony\Bridge\PsrHttpMessage\HttpFoundationFactoryInterface:
        class: Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory

    Psr\Http\Message\ServerRequestFactoryInterface:
        class: Laminas\Diactoros\ServerRequestFactory

    Psr\Http\Message\StreamFactoryInterface:
        class: Laminas\Diactoros\StreamFactory

    Psr\Http\Message\UploadedFileFactoryInterface:
        class: Laminas\Diactoros\UploadedFileFactory

    Psr\Http\Message\ResponseFactoryInterface:
        class: Laminas\Diactoros\ResponseFactory
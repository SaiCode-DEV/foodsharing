# this must come before the variables section,
# so variables specified there can override defaults specified in the template
include:
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  PHPCS_VERSION: "8.3"
  DS_EXCLUDED_ANALYZERS: "gemnasium-maven, gemnasium-python"

stages:
  - gemnasium-dependency_scanning
  - outdated
  - update-dependencies
  - build
  - test
  - deploy

.defaults:
  image: registry.gitlab.com/foodsharing-dev/images/ci/php:latest
  tags:
    - saas-linux-medium-amd64

.ssh:
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$DEPLOY_SSH_KEY")
    - mkdir -p ~/.ssh
    # For Docker builds disable host key checking. Be aware that by adding that
    # you are suspectible to man-in-the-middle attacks.
    # WARNING: Use this only with the Docker executor, if you use it with shell
    # you will overwrite your user's SSH config.
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'

.deploy:
  extends:
    - .defaults
    - .ssh
  stage: deploy
  tags:
    - foodsharing-deploy
  script:
    - chmod -R 750 ./
    - (cd deployer && composer install)
    - deployer/vendor/bin/dep deploy $CI_ENVIRONMENT_NAME --revision $CI_COMMIT_SHA
    - ./scripts/deploy-restart-services
    - ./scripts/deploy-notify-slack

.deploy-app:
  extends:
    - .deploy
  needs:
    - build:frontend
    - build:backend
    - build:websocket
    - job: test:backend-unit
      artifacts: false
    - job: test:backend-api
      artifacts: false
    - job: test:websocket
      artifacts: false
    - job: test:playwright
      artifacts: false

# rule definitions
.rule-skip-on-draft: &rule-skip-on-draft
  if: $CI_MERGE_REQUEST_DRAFT == 'true' && $CI_PIPELINE_SOURCE != 'web'
  when: never

.rule-gemnasium-dependency-scanning: &rule-gemnasium-dependency-scanning
  - *rule-skip-on-draft
  - if: $CI_COMMIT_BRANCH == 'production' && $SKIP_CI_TESTS == 'true'
    when: never
  - if: $CI_COMMIT_BRANCH == 'master' || $CI_COMMIT_BRANCH == 'production'
  - if: $CI_MERGE_REQUEST_ID
    changes:
      - composer.lock
      - deployer/composer.lock
      - client/yarn.lock
      - websocket/yarn.lock
      - docs/yarn.lock
      - tests/e2e/yarn.lock

.rule-skip-on-production-skip-ci: &rule-skip-on-production-skip-ci
  if: $CI_COMMIT_BRANCH == 'production' && $SKIP_CI_TESTS == 'true'
  when: never

.rule-skip-on-schedule: &rule-skip-on-schedule
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

.rule-main-branches: &rule-main-branches
  if: $CI_COMMIT_BRANCH == 'master' || $CI_COMMIT_BRANCH == 'production'

.rule-mr-app-changes: &rule-mr-app-changes
  if: $CI_MERGE_REQUEST_ID
  changes:
    - css/**/*
    - docker/**/*
    - img/**/*
    - lib/**/*
    - migrations/**/*
    - public/**/*
    - scripts/**/*
    - templates/**/*
    - tests/**/*
    - translations/**/*
    - .gitlab-ci.yml
    - .php-cs-fixer.php
    - codeception.dist.yml
    - composer.json
    - composer.lock
    - config.inc.*
    - deploy.php
    - jsconfig.json
    - phinx.php
    - phpstan.neon
    - run.php

.rule-mr-backend-changes: &rule-mr-backend-changes
  if: $CI_MERGE_REQUEST_ID
  changes:
    - src/**/*
    - config/**/*

.rule-mr-frontend-changes: &rule-mr-frontend-changes
  if: $CI_MERGE_REQUEST_ID
  changes:
    - client/**/*

.rule-mr-websocket-changes: &rule-mr-websocket-changes
  if: $CI_MERGE_REQUEST_ID
  changes:
    - websocket/**/*

.rule-mr-docs-changes: &rule-mr-docs-changes
  if: $CI_MERGE_REQUEST_ID
  changes:
    - docs/**/*
    - scripts/**/*
    - src/RestApi/**/*

.rule-mr-playwright-changes: &rule-mr-playwright-changes
  if: $CI_MERGE_REQUEST_ID
  changes:
    - tests/e2e/package.json
    - tests/e2e/yarn.lock
    - tests/e2e/playwright.config.ts
    - tests/e2e/specs/**/*

# Shared artifact definitions
.build-artifacts: &build-artifacts
  expire_in: 1 day

.test-artifacts: &test-artifacts
  expire_in: 2 weeks
  when: always
  paths:
    - tests/_output
  reports:
    junit: tests/_output/report-*.xml

# Shared cache definitions
.cache-backend-build: &cache-backend-build
  cache:
    key: backend:build:cache
    paths:
      - .php-cs-fixer.cache

.cache-frontend-build: &cache-frontend-build
  cache:
    key: frontend:build:cache
    paths:
      - client/node_modules

# Shared service definitions for backend tests
.services-backend-test: &services-backend-test
  services:
    - name: registry.gitlab.com/foodsharing-dev/images/redis:latest
      alias: redis
    - name: registry.gitlab.com/foodsharing-dev/images/mariadb:latest
      alias: db
    - name: registry.gitlab.com/foodsharing-dev/images/selenium:latest
      alias: selenium
    - name: registry.gitlab.com/foodsharing-dev/images/maildev:latest
      alias: maildev
      command: ["bin/maildev", "--web", "1080", "--smtp", "1025"]
    - name: registry.gitlab.com/foodsharing-dev/images/node:latest
      alias: websocket
      command: ["/bin/sh", "-c", 'if [ -e "$CI_PROJECT_DIR/code_updated" ]; then rm "$CI_PROJECT_DIR/code_updated"; fi; while [ ! -e "$CI_PROJECT_DIR/code_updated" ]; do sleep 1; done; cd /builds/foodsharing-dev/foodsharing/websocket && yarn tsx src/index.ts 0.0.0.0']
    - name: registry.gitlab.com/foodsharing-dev/images/ci/nginx:latest
      alias: nginx

# Shared variables for backend tests
.vars-backend-test: &vars-backend-test
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_INITDB_SKIP_TZINFO: 1
    TZ: Europe/Berlin
    FF_NETWORK_PER_BUILD: 1
    REDIS_HOST: redis
    FS_ENV: test

gemnasium-dependency_scanning:
  rules: *rule-gemnasium-dependency-scanning

secret_detection:
  rules:
    - *rule-skip-on-production-skip-ci
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
    - *rule-mr-frontend-changes


outdated:
  extends:
    - .defaults
  stage: outdated
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "outdated"
      when: always
  script:
    - ./scripts/ci-notify-outdated
  cache:
    key: outdated:cache
    paths:
      - vendor

build:backend-dev:
  extends:
    - .defaults
  stage: build
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-production-skip-ci
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
    - *rule-mr-frontend-changes
    - *rule-mr-playwright-changes
    - *rule-mr-websocket-changes
    - *rule-mr-docs-changes
  image: registry.gitlab.com/foodsharing-dev/images/php:latest
  script:
    - ./scripts/ci-backend-build-dev
  <<: *cache-backend-build
  artifacts:
    <<: *build-artifacts
    paths:
      - assets
      - vendor
      - docs/data/api_dump.json
    reports:
      codequality: gitlab-ci-cs-report.json

build:websocket:
  extends:
    - .defaults
  stage: build
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
    - *rule-mr-frontend-changes
    - *rule-mr-websocket-changes
  image: registry.gitlab.com/foodsharing-dev/images/node:latest
  script:
    - (cd websocket && yarn && yarn lint)
  artifacts:
    <<: *build-artifacts
    paths:
      - websocket/node_modules

build:frontend:
  extends:
    - .defaults
  stage: build
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
    - *rule-mr-frontend-changes
    - *rule-mr-websocket-changes
  image: registry.gitlab.com/foodsharing-dev/images/node:latest
  script:
    # webpack's filesystem cache travels in the CI cache (client/node_modules) and can
    # leave stale CSS contenthashes in the runtime chunk - lazily loaded chunks then 404
    # and every page stays blank (second occurrence 2026-08-05, chunk 9099 again)
    - (cd client && yarn && yarn lint && yarn prettier:e2e && rm -rf node_modules/.cache && yarn build)
  <<: *cache-frontend-build
  artifacts:
    <<: *build-artifacts
    paths:
      - assets
      - public/sw.js

build:backend:
  extends:
    - .defaults
  stage: build
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
    - *rule-mr-frontend-changes
    - *rule-mr-websocket-changes
  image: registry.gitlab.com/foodsharing-dev/images/php:latest
  script:
    - ./scripts/ci-backend-build
  <<: *cache-backend-build
  artifacts:
    <<: *build-artifacts
    paths:
      - assets
      - vendor

build:docs:
  extends:
    - .defaults
  stage: build
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-schedule
    - if: $CI_COMMIT_BRANCH == 'master'
    - *rule-mr-docs-changes
  image: registry.gitlab.com/foodsharing-dev/images/docs:latest
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_INITDB_SKIP_TZINFO: 1
  services:
    - name: registry.gitlab.com/foodsharing-dev/images/mariadb:latest
      alias: db
  script:
    - ./scripts/ci-docs-build
  needs:
    - build:backend-dev
  artifacts:
    <<: *build-artifacts
    paths:
      - docs/.vitepress/dist
      - docs/data/api_dump.json

test:php-compatibility-check:
  stage: test
  extends:
    - .defaults
  interruptible: true
  needs:
    - build:backend-dev
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-schedule
    - *rule-mr-app-changes
  script:
    - vendor/bin/phpcs src --standard=PHPCompatibility --report=junit --report-file=compatibility-report.xml --runtime-set testVersion $PHPCS_VERSION || true
    - echo "==== PHPCompatibility Summary Output ===="
    - vendor/bin/phpcs src --standard=PHPCompatibility --report=summary --runtime-set testVersion $PHPCS_VERSION || true
  <<: *cache-backend-build
  artifacts:
    expire_in: 2 weeks
    paths:
      - compatibility-report.xml
    reports:
      junit: compatibility-report.xml

.test-backend:
  stage: test
  interruptible: true
  # The maildev service container sometimes never comes up, which makes every
  # mail-dependent test error with "Could not resolve host: maildev" (0 assertions).
  # Fail fast in before_script when that happens and let GitLab retry the job with
  # fresh service containers instead of masking a real regression.
  retry:
    max: 1
    when:
      - runner_system_failure
      - script_failure
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-production-skip-ci
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
  image: registry.gitlab.com/foodsharing-dev/images/php:latest
  <<: *vars-backend-test
  <<: *services-backend-test
  before_script:
    # Wait for the maildev service container to become reachable before running tests.
    # Its DNS alias can lag behind the job start, which otherwise makes mail-dependent
    # tests error with "cURL error 6: Could not resolve host: maildev". If it never
    # comes up within ~60s, fail the job here (cheap) so the retry above re-runs it
    # with fresh containers instead of running the whole suite for ~30 min first.
    - php -r 'for ($i = 0; $i < 30; $i++) { if (@fsockopen("maildev", 1080)) { echo "maildev ready\n"; exit(0); } echo "waiting for maildev...\n"; sleep(2); } fwrite(STDERR, "maildev never became reachable\n"); exit(1);'
  needs:
    - build:frontend
    - build:backend-dev
  <<: *cache-backend-build
  artifacts: *test-artifacts

test:backend-api:
  extends:
    - .test-backend
  parallel:
    matrix:
      - GROUP: [api-group-1, api-group-2, api-group-3]
  script:
    - touch $CI_PROJECT_DIR/code_updated
    - ./scripts/ci-backend-test Api 1 $GROUP

test:backend-unit:
  extends:
    - .test-backend
  script:
    - touch $CI_PROJECT_DIR/code_updated
    - ./scripts/ci-backend-test Unit

test:playwright:
  extends:
    - .defaults
  stage: test
  parallel:
    matrix:
      - PROJECT: ["Desktop Chrome", "Desktop dark mode", "Desktop Firefox", "Mobile Chrome"]
  environment:
    name: playwright
    url: http://nginx:8080/
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-frontend-changes
    - *rule-mr-backend-changes
    - *rule-mr-playwright-changes
    - *rule-skip-on-production-skip-ci
  image: registry.gitlab.com/foodsharing-dev/images/playwright:latest
  <<: *vars-backend-test
  services:
    - name: registry.gitlab.com/foodsharing-dev/images/redis:latest
      alias: redis
    - name: registry.gitlab.com/foodsharing-dev/images/mariadb:latest
      alias: db
    - name: registry.gitlab.com/foodsharing-dev/images/maildev:latest
      alias: maildev
      command: ["bin/maildev", "--web", "1080", "--smtp", "1025"]
    - name: registry.gitlab.com/foodsharing-dev/images/node:latest
      alias: websocket
      command: ["/bin/sh", "-c", 'if [ -e "$CI_PROJECT_DIR/code_updated" ]; then rm "$CI_PROJECT_DIR/code_updated"; fi; while [ ! -e "$CI_PROJECT_DIR/code_updated" ]; do sleep 1; done; cd /builds/foodsharing-dev/foodsharing/websocket && yarn tsx src/index.ts 0.0.0.0']
    - name: registry.gitlab.com/foodsharing-dev/images/ci/nginx:22
      alias: nginx
  script:
    - touch $CI_PROJECT_DIR/code_updated
    - ./scripts/ci-frontend-test-playwright
  after_script:
    - echo "📊 View Playwright HTML Report at https://foodsharing-dev.gitlab.io/-/foodsharing/-/jobs/${CI_JOB_ID}/artifacts/tests/_output/html-report/index.html"
  needs:
    - build:backend-dev
    - build:frontend
    - build:websocket
  cache:
    - key: frontend:build:cache
      paths:
        - client/node_modules
    - key: playwright:e2e:cache
      paths:
        - tests/e2e/node_modules
  artifacts: *test-artifacts

test:websocket:
  extends:
    - .defaults
  stage: test
  interruptible: true
  rules:
    - *rule-skip-on-draft
    - *rule-skip-on-production-skip-ci
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-websocket-changes
  image: registry.gitlab.com/foodsharing-dev/images/node:latest
  variables:
    REDIS_HOST: redis
  services:
    - name: registry.gitlab.com/foodsharing-dev/images/redis:latest
      alias: redis
  needs:
    - build:websocket
  script:
    - (cd websocket && yarn test)

test:openapi-types:
  extends:
    - .defaults
  stage: test
  interruptible: true
  rules:
    - *rule-skip-on-production-skip-ci
    - *rule-skip-on-schedule
    - *rule-main-branches
    - *rule-mr-app-changes
    - *rule-mr-backend-changes
    - *rule-mr-frontend-changes
  image: registry.gitlab.com/foodsharing-dev/images/node:latest
  needs:
    - build:backend-dev
  script:
    - cd client
    - yarn
    - cp src/api/generated/openapi-types.d.ts src/api/generated/openapi-types.d.ts.bak
    - yarn generate-openapi-types
    - |
      if ! diff -u src/api/generated/openapi-types.d.ts.bak src/api/generated/openapi-types.d.ts; then
        echo "============================================================"
        echo "Error: openapi-types.d.ts is outdated."
        echo "Please run 'scripts/openapi-type-generation' locally and commit the changes."
        echo ""
        echo "NOTE: If running the script locally produces no changes, your branch might be out of date."
        echo "GitLab CI tests the result of merging your branch into master."
        echo "Please merge or rebase master into your branch, then run the script again."
        echo "============================================================"
        exit 1
      fi
  <<: *cache-frontend-build

deploy:beta:
  extends:
    - .deploy-app
  rules:
    - *rule-skip-on-schedule
    - if: $CI_COMMIT_BRANCH == 'master'
  environment:
    name: beta
    url: https://beta.foodsharing.de

deploy:production:
  extends:
    - .deploy-app
  rules:
    - if: $CI_COMMIT_BRANCH == 'production'
    - *rule-skip-on-schedule
  environment:
    name: production
    url: https://foodsharing.de

deploy:docs:
  extends:
    - .deploy
  rules:
    - *rule-skip-on-schedule
    - if: $CI_COMMIT_BRANCH == 'master'
  needs:
    - build:docs
  script:
    - rsync -avz --delete docs/.vitepress/dist/ "deploy@devdocs.foodsharing.network:/var/www/devdocs/htdocs/"
  environment:
    name: docs
    url: https://devdocs.foodsharing.network